# ─────────────────────────────────────────────────────────────────────────────
# configuration.yaml  —  Main Home Assistant configuration
# ─────────────────────────────────────────────────────────────────────────────
# Secrets are stored in secrets.yaml (git-ignored).  Reference them with the
# !secret <key> syntax.  See secrets.yaml.example for all required keys.
# ─────────────────────────────────────────────────────────────────────────────

homeassistant:
  name: !secret home_name           # e.g. "My Home"
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: !secret home_elevation
  unit_system: imperial             # or "metric"
  currency: USD
  country: US
  time_zone: !secret home_timezone  # e.g. "America/Chicago"
  customize: !include customize.yaml
  packages: !include_dir_named packages

# ── Default config entries (enabled by the UI) ────────────────────────────────
default_config:

# ── Frontend / Lovelace ───────────────────────────────────────────────────────
frontend:
  themes: !include_dir_merge_named themes

lovelace:
  resource_mode: yaml
  dashboards:
    imperial-dashboard:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Home
      icon: mdi:home
      show_in_sidebar: true
      require_admin: false
    imperial-manufacturing:
      mode: yaml
      filename: ui-manufacturing.yaml
      title: Manufacturing
      icon: mdi:printer-3d-nozzle
      show_in_sidebar: true
      require_admin: false
    cadets-barracks:
      mode: yaml
      filename: ui-cadets-barracks.yaml
      title: Cat's Room
      icon: mdi:ceiling-fan
      show_in_sidebar: true
      require_admin: false
    brent-room:
      mode: yaml
      filename: ui-brent-room.yaml
      title: Brent's Room
      icon: mdi:bed
      show_in_sidebar: true
      require_admin: false


# ── HTTP ──────────────────────────────────────────────────────────────────────
http:
  # TODO: set ip_ban_enabled and login_attempts_threshold for production
  # ip_ban_enabled: true
  # login_attempts_threshold: 5
  # ssl_certificate: !secret ssl_certificate
  # ssl_key: !secret ssl_key

# ── Shell Commands ────────────────────────────────────────────────────────────
shell_command:
  git_pull_config: "cd /config && git fetch --all && git reset --hard origin/main"

# ── Sensors ──────────────────────────────────────────────────────────────────
sensor:
  - platform: time_date
    display_options:
      - time
      - date
      - date_time

# ── Automations, Scripts, Scenes ─────────────────────────────────────────────
automation: !include automations.yaml
script:      !include scripts.yaml
scene:       !include scenes.yaml

# ── Logger ────────────────────────────────────────────────────────────────────
logger:
  default: warning
  logs:
    homeassistant.components.automation: info
