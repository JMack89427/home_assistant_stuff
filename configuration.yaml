# ─────────────────────────────────────────────────────────────────────────────
# configuration.yaml  —  Main Home Assistant configuration
# ─────────────────────────────────────────────────────────────────────────────
# Secrets are stored in secrets.yaml (git-ignored).  Reference them with the
# !secret <key> syntax.  See secrets.yaml.example for all required keys.
# ─────────────────────────────────────────────────────────────────────────────

homeassistant:
  name: !secret home_name           # e.g. "My Home"
  latitude: !secret home_latitude
  longitude: !secret home_longitude
  elevation: !secret home_elevation
  unit_system: imperial             # or "metric"
  currency: USD
  country: US
  time_zone: !secret home_timezone  # e.g. "America/Chicago"
  customize: !include customize.yaml
  packages: !include_dir_named packages

# ── Default config entries (enabled by the UI) ────────────────────────────────
default_config:

# ── Frontend / Lovelace ───────────────────────────────────────────────────────
frontend:
  themes: !include_dir_merge_named themes

lovelace:
  resource_mode: yaml
  dashboards:
    imperial-dashboard:
      mode: yaml
      filename: ui-lovelace.yaml
      title: Imperial Command Center
      icon: mdi:space-station
      show_in_sidebar: true
      require_admin: false
    imperial-manufacturing:
      mode: yaml
      filename: ui-manufacturing.yaml
      title: Imperial Manufacturing Facility
      icon: mdi:printer-3d-nozzle
      show_in_sidebar: true
      require_admin: false


# ── HTTP ──────────────────────────────────────────────────────────────────────
http:
  # TODO: set ip_ban_enabled and login_attempts_threshold for production
  # ip_ban_enabled: true
  # login_attempts_threshold: 5
  # ssl_certificate: !secret ssl_certificate
  # ssl_key: !secret ssl_key

# ── Shell Commands ────────────────────────────────────────────────────────────
shell_command:
  git_pull_config: "cd /config && git fetch --all && git reset --hard origin/main"
  apply_grocy_theme: "mkdir -p /share/grocy/data/custom_css && cp /config/themes/grocy-imperial.css /share/grocy/data/custom_css/custom.css"
  find_grocy_data: "{ echo 'START'; ls / 2>&1; echo '---'; ls /share/ 2>&1; echo '---'; ls /data/ 2>&1; } > /config/www/grocy_paths.txt"

# ── Sensors ──────────────────────────────────────────────────────────────────
sensor:
  - platform: time_date
    display_options:
      - time
      - date
      - date_time

# ── Automations, Scripts, Scenes ─────────────────────────────────────────────
automation: !include automations.yaml
script:      !include scripts.yaml
scene:       !include scenes.yaml

# ── Logger ────────────────────────────────────────────────────────────────────
logger:
  default: warning
  logs:
    homeassistant.components.automation: info
