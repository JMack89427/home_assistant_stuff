# ─────────────────────────────────────────────────────────────────────────────
# ui-safety.yaml  —  Life Safety dashboard (standalone)
# ─────────────────────────────────────────────────────────────────────────────

title: Safety
views:
  - title: Safety
    path: life-support
    icon: mdi:shield-alert
    panel: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          # ── Alarm banner — only rendered while any of the 10 smoke/CO
          # entities is 'on'. binary_sensor.life_safety_alarm_active is the
          # template helper defined in packages/life_safety.yaml.
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.life_safety_alarm_active
                state: "on"
            card:
              type: markdown
              content: >
                <div style="background: var(--error-color); color: #ffffff;
                padding: 16px; border-radius: 8px; font-weight: bold;
                font-size: 1.1em; text-align: center;">
                🚨 ALARM ACTIVE — {{ states('sensor.life_safety_active_zones') }}
                </div>

          - type: markdown
            content: "## Grow Room — Smoke & CO"

          - type: entities
            title: Grow Room
            entities:
              - entity: binary_sensor.grow_room_smoke_co_alarm_smoke_detected
                name: Smoke
                icon: mdi:smoke-detector-variant-alert
              - entity: binary_sensor.grow_room_smoke_co_alarm_carbon_monoxide_detected
                name: CO
                icon: mdi:molecule-co
              - entity: binary_sensor.grow_room_smoke_co_alarm_smoke_alarm_test
                name: Test
                icon: mdi:test-tube
              - entity: binary_sensor.grow_room_smoke_co_alarm_alarm_silenced
                name: Silenced (A)
                icon: mdi:volume-off
              - entity: binary_sensor.grow_room_smoke_co_alarm_alarm_silenced_2
                name: Silenced (B)
                icon: mdi:volume-off
              - entity: binary_sensor.grow_room_smoke_co_alarm_maintenance_required_dust_in_device
                name: Dust
                icon: mdi:spray-bottle
              - entity: binary_sensor.grow_room_smoke_co_alarm_replacement_required_end_of_life
                name: End-of-life
                icon: mdi:calendar-alert
              - entity: binary_sensor.grow_room_smoke_co_alarm_system_hardware_failure
                name: Hardware fault
                icon: mdi:alert-circle
              - entity: sensor.grow_room_smoke_co_alarm_battery_level
                name: Battery
                icon: mdi:battery
              - entity: sensor.grow_room_smoke_co_alarm_node_status
                name: Node status
                icon: mdi:lan-connect

          - type: markdown
            content: "## Maker Space — Smoke & CO"

