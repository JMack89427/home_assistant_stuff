# ─────────────────────────────────────────────────────────────────────────────
# scripts.yaml  —  Reusable Home Assistant scripts
# ─────────────────────────────────────────────────────────────────────────────

# ── Example: good-night routine ───────────────────────────────────────────────
good_night:
  alias: "Good Night"
  description: Lock the doors, turn off lights, and arm the alarm.
  sequence:
    - service: light.turn_off
      target:
        area_id: all
    - service: lock.lock
      target:
        entity_id: all    # TODO: scope to just your door lock entities
    # - service: alarm_control_panel.alarm_arm_away
    #   target:
    #     entity_id: alarm_control_panel.home_alarm
  mode: single

# ── Example: movie mode ───────────────────────────────────────────────────────
movie_mode:
  alias: "Movie Mode"
  description: Dim the lights and turn on the TV.
  sequence:
    - service: light.turn_on
      data:
        brightness_pct: 20
      target:
        area_id: living_room   # TODO: replace with your area/entity
    # - service: media_player.turn_on
    #   target:
    #     entity_id: media_player.living_room_tv
  mode: single

# ── Imperial Command Center Sync ──────────────────────────────────────────────
sync_github_config:
  alias: "Sync Configuration from GitHub"
  description: "Pulls the latest configuration from GitHub and updates the system."
  icon: mdi:github
  sequence:
    - service: shell_command.git_pull_config
    - delay: "00:00:05" # Wait 5 seconds for the git pull to finish
    - service: homeassistant.restart
  mode: single
