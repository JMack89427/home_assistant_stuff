# ─────────────────────────────────────────────────────────────────────────────
# customize.yaml  —  Entity customization (friendly names, icons, hidden, etc.)
# ─────────────────────────────────────────────────────────────────────────────
# See https://www.home-assistant.io/docs/configuration/customizing-devices/
# ─────────────────────────────────────────────────────────────────────────────

# Example entries — replace or remove as needed:
# light.living_room:
#   friendly_name: "Living Room Light"
#   icon: mdi:ceiling-light

# switch.porch_light:
#   friendly_name: "Porch Light"
#   icon: mdi:outdoor-lamp

# ─────────────────────────────────────────────────────────────────────────────
# Smoke/CO detectors (5x First Alert SMCO410, Z-Wave) — friendly_name overrides
#
# All 5 units report identical stock friendly names (e.g. "Smoke & CO Alarm
# Smoke detected"), and entity-level area_id is None on every detector entity
# (area is inherited from the device only) — so friendly_name alone can't
# distinguish rooms anywhere it surfaces (notifications, logbook, history,
# voice assistants). These overrides are the room-identity fix at the entity
# level; ui-lovelace.yaml additionally sets an explicit name: on every
# dashboard row as belt-and-suspenders. Keep this list, automations.yaml's
# zone_map, and packages/life_safety.yaml's zone_map in sync if a room is
# renamed or a unit is added/removed.
#
# alarm_silenced / alarm_silenced_2: which is smoke-silence vs CO-silence is
# not determinable from the registry — labeled neutrally as "Silenced (A)"
# and "Silenced (B)"; do not guess which is which.
# ─────────────────────────────────────────────────────────────────────────────

# Grow Room
binary_sensor.grow_room_smoke_co_alarm_smoke_detected:
  friendly_name: "Grow Room Smoke Detected"
binary_sensor.grow_room_smoke_co_alarm_carbon_monoxide_detected:
  friendly_name: "Grow Room CO Detected"
binary_sensor.grow_room_smoke_co_alarm_smoke_alarm_test:
  friendly_name: "Grow Room Alarm Test"
binary_sensor.grow_room_smoke_co_alarm_alarm_silenced:
  friendly_name: "Grow Room Silenced (A)"
binary_sensor.grow_room_smoke_co_alarm_alarm_silenced_2:
  friendly_name: "Grow Room Silenced (B)"
binary_sensor.grow_room_smoke_co_alarm_maintenance_required_dust_in_device:
  friendly_name: "Grow Room Dust Maintenance Required"
binary_sensor.grow_room_smoke_co_alarm_replacement_required_end_of_life:
  friendly_name: "Grow Room Replacement Required (End of Life)"
binary_sensor.grow_room_smoke_co_alarm_system_hardware_failure:
  friendly_name: "Grow Room Hardware Failure"

