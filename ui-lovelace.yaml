title: Imperial Command Center
resources:
  - url: /local/imperial-cards.js?v=38
    type: module
  - url: /hacsfiles/calendar-card-pro/calendar-card-pro.js
    type: module
  - url: /hacsfiles/mealie-card/mealie-card.js
    type: module
views:

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 1: KIOSK — DEFAULT LANDING VIEW
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Kiosk
    path: kiosk
    icon: local:empire
    panel: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: custom:imperial-header
            title: Imperial Command Center
            icon: local:empire
            lock: true

          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: custom:imperial-clock
                    weather: weather.forecast_home_3
                  - type: custom:imperial-panel
                    title: Atmospheric Conditions
                    entities:
                      - entity: weather.forecast_home_3
                        name: Conditions
                        icon: mdi:weather-cloudy
                      - entity: weather.forecast_home_3
                        name: Temperature
                        icon: mdi:thermometer
                        attribute: temperature
                        unit: "°F"
                      - entity: weather.forecast_home_3
                        name: Humidity
                        icon: mdi:water-percent
                        attribute: humidity
                        unit: "%"
                      - entity: weather.forecast_home_3
                        name: Wind Speed
                        icon: mdi:weather-windy
                        attribute: wind_speed
                      - entity: weather.forecast_home_3
                        name: Pressure
                        icon: mdi:gauge
                        attribute: pressure
                      - entity: weather.forecast_home_3
                        name: UV Index
                        icon: mdi:sun-wireless
                        attribute: uv_index
                      - entity: weather.forecast_home_3
                        name: Cloud Cover
                        icon: mdi:cloud-percent
                        attribute: cloud_coverage
                        unit: "%"

              - type: vertical-stack
                cards:
                  - type: custom:mealie-mealplan-card
                    title: "Tonight's Rations"
                    config_entry_id: 01KRC45RGW4GTDF6KA325E97AB
                    day_offset: 0
                    show_image: true
                    show_description: true
                    show_prep_time: false
                    show_perform_time: false
                    show_total_time: false
                    show_rating: false
                    show_servings: true
                    layout: horizontal
                  - type: custom:imperial-panel
                    title: Perimeter Illumination Grid
                    entities:
                      - entity: light.garage_light
                        name: Hangar Alpha
                        icon: mdi:light-flood-down
                      - entity: light.front_light
                        name: Forward Array
                        icon: mdi:outdoor-lamp
                      - entity: light.side_light
                        name: Starboard Array
                        icon: mdi:wall-sconce-flat
                  - type: custom:imperial-alert-panel
                    title: System Alerts
                    battery_threshold: 20

              - type: custom:calendar-card-pro
                entities:
                  - calendar.jmack89427_gmail_com
                  - calendar.jcummings522_gmail_com
                  - calendar.catriona_cummings
                  - calendar.catriona_l_cummings_gmail_com
                  - calendar.chores
                days_to_show: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 2: DETENTION BLOCK
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Detention Block
    path: detention
    panel: true
    icon: local:first-order
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: custom:imperial-header
            title: Detention Block AA-23
            subtitle: Surveillance grid active — no unauthorized movement tolerated
            icon: local:first-order

          - type: horizontal-stack
            cards:
              - type: custom:imperial-camera
                entity: camera.front_door_live_view
                title: Main Airlock
                aspect_ratio: "3 / 4"
              - type: custom:imperial-camera
                entity: camera.front_door_live_view_2
                title: Central Command
                aspect_ratio: "3 / 4"

          - type: horizontal-stack
            cards:
              - type: picture-glance
                title: Forward Sector
                camera_image: camera.front_live_view
                camera_view: auto
                entities:
                  - entity: switch.front_motion_detection
                    icon: mdi:motion-sensor
              - type: picture-glance
                title: Hangar Bay Alpha
                camera_image: camera.garage_live_view
                camera_view: auto
                entities:
                  - entity: switch.garage_motion_detection
                    icon: mdi:motion-sensor
              - type: picture-glance
                title: Starboard Sector
                camera_image: camera.side_live_view
                camera_view: auto
                entities:
                  - entity: switch.side_motion_detection
                    icon: mdi:motion-sensor

          - type: custom:imperial-panel
            title: Perimeter Defense Systems
            entities:
              - entity: switch.front_door_motion_detection
                name: Main Airlock Sensors
                icon: mdi:shield-lock
              - entity: switch.front_motion_detection
                name: Forward Sector Sensors
                icon: mdi:shield-lock
              - entity: switch.garage_motion_detection
                name: Hangar Bay Sensors
                icon: mdi:shield-lock
              - entity: switch.side_motion_detection
                name: Starboard Sensors
                icon: mdi:shield-lock
              - entity: sensor.front_door_battery_2
                name: Central Command Battery
                icon: mdi:battery
              - entity: sensor.front_door_last_activity_2
                name: Central Command Last Activity
                icon: mdi:clock-outline

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 3: SHIP COMMUNICATIONS
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Ship Comms
    path: communications
    icon: local:galactic-senate
    badges: []
    cards:
      - type: custom:imperial-header
        title: Ship Communications Array
        subtitle: Holographic broadcast systems online
        icon: local:galactic-senate

      - type: media-control
        entity: media_player.living_room
        name: Emperor's Throne Room

      - type: media-control
        entity: media_player.family_room
        name: Officers' Quarters

      - type: media-control
        entity: media_player.crafting_room
        name: Engineering Bay

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 4: IMPERIAL OPERATIONS
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Operations
    path: operations
    icon: local:sith
    panel: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: custom:imperial-header
            title: Forward Command Post — Climate Control
            subtitle: Atmospheric temperature regulation — Forward sector
            icon: mdi:thermostat

          - type: horizontal-stack
            cards:
              - type: custom:imperial-panel
                title: Climate Status
                entities:
                  - entity: climate.t6_pro_z_wave_programmable_thermostat
                    name: System Mode
                    icon: mdi:thermostat
                  - entity: climate.t6_pro_z_wave_programmable_thermostat
                    name: System Action
                    icon: mdi:lightning-bolt
                    attribute: hvac_action
                  - entity: sensor.t6_pro_z_wave_programmable_thermostat_air_temperature
                    name: Current Temp
                    icon: mdi:thermometer
                  - entity: sensor.t6_pro_z_wave_programmable_thermostat_humidity
                    name: Current Humidity
                    icon: mdi:water-percent
                    round: true
                  - entity: climate.t6_pro_z_wave_programmable_thermostat
                    name: Fan Mode
                    icon: mdi:fan
                    attribute: fan_mode
                  - entity: sensor.t6_fan_status
                    name: Fan Status
                    icon: mdi:fan-clock
                  - entity: input_boolean.climate_manual_override
                    name: Manual Override
                    icon: mdi:hand-back-right

              - type: thermostat
                entity: climate.t6_pro_z_wave_programmable_thermostat
                name: Set Temperature

              - type: vertical-stack
                cards:
                  - type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: custom:imperial-button
                        name: "Off"
                        icon: mdi:power-off
                        service: climate.set_hvac_mode
                        service_data:
                          entity_id: climate.t6_pro_z_wave_programmable_thermostat
                          hvac_mode: "off"
                        color: red
                      - type: custom:imperial-button
                        name: Heat
                        icon: mdi:fire
                        service: climate.set_hvac_mode
                        service_data:
                          entity_id: climate.t6_pro_z_wave_programmable_thermostat
                          hvac_mode: heat
                        color: red
                      - type: custom:imperial-button
                        name: Cool
                        icon: mdi:snowflake
                        service: climate.set_hvac_mode
                        service_data:
                          entity_id: climate.t6_pro_z_wave_programmable_thermostat
                          hvac_mode: cool
                        color: amber
                      - type: custom:imperial-button
                        name: Heat + Cool
                        icon: mdi:thermostat-auto
                        service: climate.set_hvac_mode
                        service_data:
                          entity_id: climate.t6_pro_z_wave_programmable_thermostat
                          hvac_mode: heat_cool
                        color: amber

                  - type: grid
                    columns: 3
                    square: false
                    cards:
                      - type: custom:imperial-button
                        name: Fan Auto
                        icon: mdi:fan-auto
                        service: climate.set_fan_mode
                        service_data:
                          entity_id: climate.t6_pro_z_wave_programmable_thermostat
                          fan_mode: "Auto low"
                        color: amber
                      - type: custom:imperial-button
                        name: Fan Low
                        icon: mdi:fan-speed-1
                        service: climate.set_fan_mode
                        service_data:
                          entity_id: climate.t6_pro_z_wave_programmable_thermostat
                          fan_mode: Low
                        color: amber
                      - type: custom:imperial-button
                        name: Fan Circ
                        icon: mdi:fan-chevron-up
                        service: climate.set_fan_mode
                        service_data:
                          entity_id: climate.t6_pro_z_wave_programmable_thermostat
                          fan_mode: Circulation
                        color: amber

