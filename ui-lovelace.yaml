title: Imperial Command Center
resources:
  - url: /local/imperial-cards.js?v=3
    type: module
views:

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 1: BRIDGE
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Bridge
    path: bridge
    icon: local:empire
    badges: []
    cards:
      - type: custom:imperial-header
        title: Imperial Command Center
        subtitle: All systems nominal — awaiting orders
        icon: local:empire

      - type: horizontal-stack
        cards:
          - type: custom:imperial-readout
            entity: weather.forecast_home_3
            attribute: temperature
            name: Outside Temp
            color: amber
          - type: custom:imperial-readout
            entity: weather.forecast_home_3
            attribute: humidity
            name: Outside Humidity
            color: green

      - type: custom:imperial-panel
        title: Atmospheric Conditions
        entities:
          - entity: weather.forecast_home_3
            name: Conditions
            icon: mdi:weather-cloudy
          - entity: weather.forecast_home_3
            name: Wind Speed
            icon: mdi:weather-windy
            attribute: wind_speed
          - entity: weather.forecast_home_3
            name: Pressure
            icon: mdi:gauge
            attribute: pressure
          - entity: weather.forecast_home_3
            name: UV Index
            icon: mdi:sun-wireless
            attribute: uv_index
          - entity: weather.forecast_home_3
            name: Cloud Cover
            icon: mdi:cloud-percent
            attribute: cloud_coverage
            unit: "%"

      - type: custom:imperial-panel
        title: Perimeter Illumination Grid
        entities:
          - entity: light.garage_light
            name: Hangar Alpha
            icon: mdi:light-flood-down
          - entity: light.front_light
            name: Forward Array
            icon: mdi:outdoor-lamp
          - entity: light.side_light
            name: Starboard Array
            icon: mdi:wall-sconce-flat

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 2: DETENTION BLOCK
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Detention Block
    path: detention
    icon: local:first-order
    badges: []
    cards:
      - type: custom:imperial-header
        title: Detention Block AA-23
        subtitle: Surveillance grid active — no unauthorized movement tolerated
        icon: local:first-order

      - type: horizontal-stack
        cards:
          - type: picture-glance
            title: Main Airlock
            camera_image: camera.front_door_live_view
            camera_view: auto
            entities:
              - entity: switch.front_door_motion_detection
                icon: mdi:motion-sensor
          - type: picture-glance
            title: Forward Sector
            camera_image: camera.front_live_view
            camera_view: auto
            entities:
              - entity: switch.front_motion_detection
                icon: mdi:motion-sensor

      - type: horizontal-stack
        cards:
          - type: picture-glance
            title: Hangar Bay Alpha
            camera_image: camera.garage_live_view
            camera_view: auto
            entities:
              - entity: switch.garage_motion_detection
                icon: mdi:motion-sensor
          - type: picture-glance
            title: Starboard Sector
            camera_image: camera.side_live_view
            camera_view: auto
            entities:
              - entity: switch.side_motion_detection
                icon: mdi:motion-sensor

      - type: custom:imperial-panel
        title: Perimeter Defense Systems
        entities:
          - entity: switch.front_door_motion_detection
            name: Main Airlock Sensors
            icon: mdi:shield-lock
          - entity: switch.front_motion_detection
            name: Forward Sector Sensors
            icon: mdi:shield-lock
          - entity: switch.garage_motion_detection
            name: Hangar Bay Sensors
            icon: mdi:shield-lock
          - entity: switch.side_motion_detection
            name: Starboard Sensors
            icon: mdi:shield-lock

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 3: SHIP COMMUNICATIONS
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Ship Comms
    path: communications
    icon: local:galactic-senate
    badges: []
    cards:
      - type: custom:imperial-header
        title: Ship Communications Array
        subtitle: Holographic broadcast systems online
        icon: local:galactic-senate

      - type: media-control
        entity: media_player.living_room
        name: Emperor's Throne Room

      - type: media-control
        entity: media_player.family_room
        name: Officers' Quarters

      - type: media-control
        entity: media_player.crafting_room
        name: Engineering Bay

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 4: IMPERIAL OPERATIONS
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Operations
    path: operations
    icon: local:sith
    badges: []
    cards:
      - type: custom:imperial-header
        title: Imperial Operations Console
        subtitle: Execute standing orders with precision
        icon: local:sith

      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:imperial-button
            name: Good Night Protocol
            icon: mdi:power-sleep
            service: script.turn_on
            service_data:
              entity_id: script.good_night
            entity: script.good_night
            color: red
          - type: custom:imperial-button
            name: Movie Mode
            icon: mdi:movie-open
            service: script.turn_on
            service_data:
              entity_id: script.movie_mode
            entity: script.movie_mode
            color: amber

      - type: custom:imperial-panel
        title: Holonet Status
        entities:
          - entity: sensor.eero_external_ip
            name: Holonet Uplink IP
            icon: mdi:ip-network

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 5: FABRICATION FLEET COMMAND
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Fleet
    path: fleet
    icon: local:galactic-republic
    badges: []
    cards:
      - type: custom:imperial-header
        title: Fabrication Fleet Command
        subtitle: Replicator status — all units reporting
        icon: local:galactic-republic

      - type: custom:imperial-printer-status
        prefix: p1p_01s00c431300106
        name: Bambu P1P — Unit Alpha

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 6: IMPERIAL MANUFACTURING FACILITY
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Manufacturing
    path: manufacturing
    icon: mdi:printer-3d-nozzle
    badges: []
    cards:
      - type: custom:imperial-header
        title: Imperial Manufacturing Facility
        subtitle: Fabrication systems online — awaiting replication orders
        icon: local:old-republic

      - type: horizontal-stack
        cards:
          - type: custom:imperial-readout
            entity: sensor.p1p_01s00c431300106_print_progress
            name: Print Progress
            color: green
            unit: "%"
          - type: custom:imperial-readout
            entity: sensor.p1p_01s00c431300106_current_layer
            name: Current Layer
            color: amber
          - type: custom:imperial-readout
            entity: sensor.p1p_01s00c431300106_total_layer_count
            name: Total Layers
            color: red

      - type: picture-glance
        title: Fabrication Bay
        camera_image: camera.p1p_01s00c431300106_camera
        camera_view: auto
        entities:
          - entity: binary_sensor.p1p_01s00c431300106_print_error
            icon: mdi:alert-circle
          - entity: binary_sensor.p1p_01s00c431300106_online
            icon: mdi:network
          - entity: light.p1p_01s00c431300106_chamber_light
            icon: mdi:lightbulb

      - type: custom:imperial-panel
        title: Fabrication Status
        entities:
          - entity: sensor.p1p_01s00c431300106_task_name
            name: Job Name
            icon: mdi:file-document-outline
          - entity: sensor.p1p_01s00c431300106_print_status
            name: Print Status
            icon: mdi:printer-3d
          - entity: sensor.p1p_01s00c431300106_current_stage
            name: Current Stage
            icon: mdi:state-machine
          - entity: sensor.p1p_01s00c431300106_remaining_time
            name: Time Remaining
            icon: mdi:timer-outline
          - entity: sensor.p1p_01s00c431300106_end_time
            name: Est. Completion
            icon: mdi:clock-end
          - entity: sensor.p1p_01s00c431300106_print_weight
            name: Filament Weight
            icon: mdi:weight-gram
          - entity: sensor.p1p_01s00c431300106_print_length
            name: Filament Length
            icon: mdi:ruler

      - type: custom:imperial-panel
        title: Thermal Systems
        entities:
          - entity: sensor.p1p_01s00c431300106_nozzle_temperature
            name: Nozzle Temp
            icon: mdi:printer-3d-nozzle-heat
          - entity: sensor.p1p_01s00c431300106_nozzle_target_temperature
            name: Nozzle Target
            icon: mdi:thermometer-chevron-up
          - entity: sensor.p1p_01s00c431300106_bed_temperature
            name: Bed Temp
            icon: mdi:radiator
          - entity: sensor.p1p_01s00c431300106_bed_target_temperature
            name: Bed Target
            icon: mdi:thermometer-chevron-up

      - type: custom:imperial-panel
        title: Hardware Configuration
        entities:
          - entity: sensor.p1p_01s00c431300106_nozzle_size
            name: Nozzle Size
            icon: mdi:printer-3d-nozzle
          - entity: sensor.p1p_01s00c431300106_nozzle_type
            name: Nozzle Type
            icon: mdi:printer-3d-nozzle-outline
          - entity: sensor.p1p_01s00c431300106_print_bed_type
            name: Bed Type
            icon: mdi:table-furniture
          - entity: sensor.p1p_01s00c431300106_speed_profile
            name: Speed Profile
            icon: mdi:speedometer
          - entity: light.p1p_01s00c431300106_chamber_light
            name: Chamber Light
            icon: mdi:lightbulb
          - entity: fan.p1p_01s00c431300106_cooling_fan
            name: Cooling Fan
            icon: mdi:fan
          - entity: fan.p1p_01s00c431300106_aux_fan
            name: Aux Fan
            icon: mdi:fan-chevron-up

      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:imperial-button
            name: Pause
            icon: mdi:pause-circle
            service: button.press
            service_data:
              entity_id: button.p1p_01s00c431300106_pause_printing
            entity: button.p1p_01s00c431300106_pause_printing
            color: amber
          - type: custom:imperial-button
            name: Resume
            icon: mdi:play-circle
            service: button.press
            service_data:
              entity_id: button.p1p_01s00c431300106_resume_printing
            entity: button.p1p_01s00c431300106_resume_printing
            color: green
          - type: custom:imperial-button
            name: Stop Print
            icon: mdi:stop-circle
            service: button.press
            service_data:
              entity_id: button.p1p_01s00c431300106_stop_printing
            entity: button.p1p_01s00c431300106_stop_printing
            color: red
