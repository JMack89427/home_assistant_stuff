# ─────────────────────────────────────────────────────────────────────────────
# ui-lovelace.yaml  —  Main Command Center Dashboard (Modern Sections Layout)
# ─────────────────────────────────────────────────────────────────────────────
# Master household landing dashboard featuring:
#   - Glance Badges: Safety, House Avg Temp & Humidity, HVAC, Weather, Occupancy
#   - Conditional Critical Alerts: Smoke/CO active alarm & Dehumidifier tank full
#   - Domain Command Portals: Direct navigation cards with live status for all 11
#     specialized dashboards (Climate, Cameras, Manufacturing, Grow Room, Vacuums,
#     Lawn & Pool, Safety, Meals, Media, Cat's Room, Brent's Room)
#   - Quick Actions: Perimeter lighting, Good Night & Movie Mode routines, HVAC override
#   - Live Surveillance: Perimeter camera glance tiles with motion sensors
#   - Household Hub: Clock, Weather, Mealie dinner plan, Family calendar & System alerts
# ─────────────────────────────────────────────────────────────────────────────

title: Home
resources:
  - url: /local/imperial-cards.js?v=40
    type: module
  - url: /local/grow-room-cards.js?v=2
    type: module
  - url: /hacsfiles/calendar-card-pro/calendar-card-pro.js
    type: module
  - url: /hacsfiles/mealie-card/mealie-card.js
    type: module

views:
  - title: Command Center
    path: home
    icon: mdi:view-dashboard
    type: sections
    max_columns: 4
    badges:
      - entity: binary_sensor.life_safety_alarm_active
        name: Safety
        color: red
      - entity: sensor.house_average_temperature
        name: House Temp
        icon: mdi:thermometer
        color: orange
      - entity: sensor.house_average_humidity
        name: House Humidity
        icon: mdi:water-percent
        color: cyan
      - entity: climate.t6_pro_z_wave_programmable_thermostat
        name: HVAC
        color: teal
      - entity: weather.forecast_home_3
        name: Weather
        color: light-blue
      - entity: input_boolean.cats_room_occupied
        name: Cat's Room
        icon: mdi:bed
        color: amber
      - entity: input_boolean.brent_room_occupied
        name: Brent's Room
        icon: mdi:bed
        color: indigo

    sections:
      # ═══════════════════════════════════════════════════════════════════════
      # SECTION 0: CONDITIONAL CRITICAL ALERTS
      # ═══════════════════════════════════════════════════════════════════════
      - type: grid
        column_span: 4
        cards:
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.life_safety_alarm_active
                state: "on"
            card:
              type: markdown
              content: >
                <div style="background: var(--error-color, #e53935); color: #ffffff;
                padding: 16px 20px; border-radius: 12px; font-weight: bold;
                font-size: 1.2em; text-align: center; box-shadow: 0 4px 12px rgba(229,57,53,0.4);
                cursor: pointer;">
                🚨 CRITICAL ALARM ACTIVE — {{ states('sensor.life_safety_active_zones') }}
                <div style="font-size: 0.8em; margin-top: 4px; font-weight: normal; opacity: 0.9;">
                Click to open Safety Dashboard & Diagnostics
                </div>
                </div>
              tap_action:
                action: navigate
                navigation_path: /life-safety

          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.150633095484711_tank_full
                state: "on"
            card:
              type: markdown
              content: >
                <div style="background: var(--warning-color, #ffa000); color: #000000;
                padding: 12px 18px; border-radius: 10px; font-weight: bold;
                font-size: 1.0em; text-align: center;">
                💧 DEHUMIDIFIER TANK FULL — Empty the bucket to resume moisture extraction.
                </div>
              tap_action:
                action: navigate
                navigation_path: /climate-control

      # ═══════════════════════════════════════════════════════════════════════
      # SECTION 1: DOMAIN COMMAND PORTALS (INTERACTIVE DASHBOARD HUB)
      # ═══════════════════════════════════════════════════════════════════════
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: "COMMAND PORTALS"
            heading_style: title
            icon: mdi:view-dashboard-variant

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: climate.t6_pro_z_wave_programmable_thermostat
                name: Climate & Air
                icon: mdi:thermostat
                color: teal
                tap_action:
                  action: navigate
                  navigation_path: /climate-control

              - type: tile
                entity: camera.front_door_live_view
                name: Cameras & Motion
                icon: mdi:cctv
                color: blue
                tap_action:
                  action: navigate
                  navigation_path: /cameras-hub

              - type: tile
                entity: sensor.maker_space_x1c_5_smart_plug_power
                name: 3D Manufacturing
                icon: mdi:printer-3d-nozzle
                color: deep-orange
                tap_action:
                  action: navigate
                  navigation_path: /imperial-manufacturing

              - type: tile
                entity: sensor.grow_room_inside_vpd
                name: Grow Room
                icon: mdi:sprout
                color: light-green
                tap_action:
                  action: navigate
                  navigation_path: /grow-room

              - type: tile
                entity: vacuum.roborock_qrevo_curv_series
                name: Robot Vacuums
                icon: mdi:robot-vacuum
                color: purple
                tap_action:
                  action: navigate
                  navigation_path: /robot-vacuums

              - type: tile
                entity: lawn_mower.garden_luba_va624unr
                name: Lawn & Pool
                icon: mdi:pool
                color: cyan
                tap_action:
                  action: navigate
                  navigation_path: /lawn-pool

              - type: tile
                entity: binary_sensor.life_safety_alarm_active
                name: Life Safety
                icon: mdi:shield-check
                color: green
                tap_action:
                  action: navigate
                  navigation_path: /life-safety

              - type: tile
                entity: media_player.living_room
                name: Whole-Home Audio
                icon: mdi:speaker-multiple
                color: pink
                tap_action:
                  action: navigate
                  navigation_path: /media-hub

              - type: tile
                entity: input_boolean.cats_room_occupied
                name: Cat's Room
                icon: mdi:ceiling-fan
                color: amber
                tap_action:
                  action: navigate
                  navigation_path: /cadets-barracks

              - type: tile
                entity: input_boolean.brent_room_occupied
                name: Brent's Room
                icon: mdi:bed
                color: indigo
                tap_action:
                  action: navigate
                  navigation_path: /brent-room

      # ═══════════════════════════════════════════════════════════════════════
      # SECTION 2: QUICK ACTIONS & MASTER LIGHTING
      # ═══════════════════════════════════════════════════════════════════════
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: "QUICK ACTIONS"
            heading_style: title
            icon: mdi:lightning-bolt

          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: light.front_light
                name: Front Lamp
                icon: mdi:outdoor-lamp
                color: amber

              - type: tile
                entity: light.garage_light
                name: Garage Flood
                icon: mdi:light-flood-down
                color: amber

              - type: tile
                entity: light.side_light
                name: Side Sconce
                icon: mdi:wall-sconce-flat
                color: amber

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: script.good_night
                name: Good Night
                icon: mdi:weather-night
                color: deep-purple
                tap_action:
                  action: call-service
                  service: script.good_night

              - type: tile
                entity: script.movie_mode
                name: Movie Mode
                icon: mdi:movie-open
                color: indigo
                tap_action:
                  action: call-service
                  service: script.movie_mode

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: input_boolean.climate_manual_override
                name: Climate Override
                icon: mdi:hand-back-right
                color: orange

              - type: tile
                entity: input_boolean.climate_sensor_bypass
                name: Sensor Bypass
                icon: mdi:thermometer-off
                color: blue-grey

      # ═══════════════════════════════════════════════════════════════════════
      # SECTION 3: LIVE SURVEILLANCE & PERIMETER GLANCE
      # ═══════════════════════════════════════════════════════════════════════
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: "PERIMETER CAMERAS"
            heading_style: title
            icon: mdi:cctv

          - type: grid
            columns: 2
            square: false
            cards:
              - type: picture-glance
                title: Front Door
                camera_image: camera.front_door_live_view
                camera_view: auto
                entities:
                  - entity: switch.front_door_motion_detection
                    icon: mdi:motion-sensor
                tap_action:
                  action: navigate
                  navigation_path: /cameras-hub

              - type: picture-glance
                title: Doorbell
                camera_image: camera.front_door_live_view_2
                camera_view: auto
                entities:
                  - entity: sensor.front_door_battery_2
                    icon: mdi:battery
                tap_action:
                  action: navigate
                  navigation_path: /cameras-hub

              - type: picture-glance
                title: Front Yard
                camera_image: camera.front_live_view
                camera_view: auto
                entities:
                  - entity: switch.front_motion_detection
                    icon: mdi:motion-sensor
                tap_action:
                  action: navigate
                  navigation_path: /cameras-hub

              - type: picture-glance
                title: Garage
                camera_image: camera.garage_live_view
                camera_view: auto
                entities:
                  - entity: switch.garage_motion_detection
                    icon: mdi:motion-sensor
                tap_action:
                  action: navigate
                  navigation_path: /cameras-hub

      # ═══════════════════════════════════════════════════════════════════════
      # SECTION 4: HOUSEHOLD SCHEDULE, DINNER & SYSTEM ALERTS
      # ═══════════════════════════════════════════════════════════════════════
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: "HOUSEHOLD & SYSTEM"
            heading_style: title
            icon: mdi:calendar-clock

          - type: custom:mealie-mealplan-card
            title: "Tonight's Dinner"
            config_entry_id: 01KRC45RGW4GTDF6KA325E97AB
            day_offset: 0
            show_image: true
            show_description: true
            show_prep_time: false
            show_perform_time: false
            show_total_time: false
            show_rating: false
            show_servings: true
            layout: horizontal
            tap_action:
              action: navigate
              navigation_path: /meals-planner

          - type: custom:imperial-alert-panel
            title: System Alerts
            battery_threshold: 20

          - type: custom:calendar-card-pro
            entities:
              - calendar.jmack89427_gmail_com
              - calendar.jcummings522_gmail_com
              - calendar.catriona_cummings
              - calendar.catriona_l_cummings_gmail_com
              - calendar.chores
            days_to_show: 7
