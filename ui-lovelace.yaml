# ─────────────────────────────────────────────────────────────────────────────
# ui-lovelace.yaml  —  Modern Smart Home Command Dashboard
# ─────────────────────────────────────────────────────────────────────────────
# Responsive 3-Mode Dashboard (Phone, Tablet, Desktop)
#   - Computer (>1280px): Edge-to-edge 4 columns with balanced vitals
#   - Tablet (768px - 1280px): 2 balanced columns
#   - Phone (<768px): Thumb-friendly single column with quick routines first
# ─────────────────────────────────────────────────────────────────────────────

title: Overview
theme: sleek_modern
views:
  - title: Overview
    path: default_view
    icon: mdi:view-dashboard
    panel: true
    cards:
      - type: custom:imperial-responsive-console
        header:
          # 1. Critical Emergency Banner (Conditional)
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.life_safety_alarm_active
                state: "on"
            card:
              type: markdown
              content: >
                <div style="background: linear-gradient(135deg, #ef4444, #dc2626); color: #ffffff;
                padding: 16px 22px; border-radius: 16px; font-weight: 600;
                font-size: 1.15em; text-align: center; box-shadow: 0 8px 24px rgba(239,68,68,0.45);
                cursor: pointer; letter-spacing: 0.3px;">
                🚨 Life Safety Alarm Triggered — {{ states('sensor.life_safety_active_zones') }}
                <div style="font-size: 0.85em; margin-top: 4px; font-weight: 400; opacity: 0.95;">
                Tap to view safety sensors and active zones
                </div>
                </div>
              tap_action:
                action: navigate
                navigation_path: /life-safety

          # 2. Dehumidifier Bucket Full Notice (Conditional)
          - type: conditional
            conditions:
              - condition: state
                entity: binary_sensor.150633095484711_tank_full
                state: "on"
            card:
              type: markdown
              content: >
                <div style="background: linear-gradient(135deg, #f59e0b, #d97706); color: #111827;
                padding: 12px 20px; border-radius: 14px; font-weight: 600;
                font-size: 1.0em; text-align: center; box-shadow: 0 6px 18px rgba(245,158,11,0.3);
                cursor: pointer;">
                💧 Dehumidifier Tank Full — Please empty the reservoir
                </div>
              tap_action:
                action: navigate
                navigation_path: /climate-control

          # 3. Modern Glassmorphic Status Bar
          - type: custom:imperial-kpi-bar
            chips:
              - entity: binary_sensor.life_safety_alarm_active
                name: Safety
                icon: mdi:shield-check
                navigate: /life-safety
              - entity: sensor.house_average_temperature
                name: House
                color: "#f59e0b"
                navigate: /climate-control
              - entity: sensor.house_average_humidity
                name: Humidity
                color: "#0ea5e9"
                navigate: /climate-control
              - entity: climate.t6_pro_z_wave_programmable_thermostat
                name: HVAC
                color: "#38bdf8"
                navigate: /climate-control
              - entity: weather.forecast_home_3
                name: Weather
                color: "#38bdf8"
                action: more-info
              - entity: lawn_mower.garden_luba_va624unr
                name: Mower
                icon: mdi:robot-mower
                navigate: /lawn-pool
              - entity: vacuum.roborock_qrevo_curv_series
                name: Vacuum
                icon: mdi:robot-vacuum
                navigate: /robot-vacuums
              - entity: input_boolean.cats_room_occupied
                name: "Cat's Room"
                icon: mdi:bed
                color: "#f59e0b"
                action: toggle
              - entity: input_boolean.brent_room_occupied
                name: "Brent's Room"
                icon: mdi:bed
                color: "#818cf8"
                action: toggle

        columns:
          # ═══════════════════════════════════════════════════════════════════
          # COLUMN 1: NAVIGATION & ROOMS
          # ═══════════════════════════════════════════════════════════════════
          - cards:
              - type: heading
                heading: Navigation & Rooms
                heading_style: title
                icon: mdi:compass-outline

              # Subsystem Hub Portals
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: tile
                    entity: climate.t6_pro_z_wave_programmable_thermostat
                    name: Climate & Air
                    icon: mdi:thermostat
                    color: cyan
                    tap_action:
                      action: navigate
                      navigation_path: /climate-control

                  - type: tile
                    entity: camera.front_door_live_view_2
                    name: Cameras & Video
                    icon: mdi:cctv
                    color: blue
                    tap_action:
                      action: navigate
                      navigation_path: /cameras-hub

                  - type: tile
                    entity: sensor.maker_space_x1c_5_smart_plug_power
                    name: 3D Printing
                    icon: mdi:printer-3d-nozzle
                    color: orange
                    tap_action:
                      action: navigate
                      navigation_path: /imperial-manufacturing

                  - type: tile
                    entity: sensor.grow_room_inside_vpd
                    name: Grow Room
                    icon: mdi:sprout
                    color: light-green
                    tap_action:
                      action: navigate
                      navigation_path: /grow-room

                  - type: tile
                    entity: vacuum.roborock_qrevo_curv_series
                    name: Vacuums
                    icon: mdi:robot-vacuum
                    color: purple
                    tap_action:
                      action: navigate
                      navigation_path: /robot-vacuums

                  - type: tile
                    entity: lawn_mower.garden_luba_va624unr
                    name: Lawn & Pool
                    icon: mdi:pool
                    color: teal
                    tap_action:
                      action: navigate
                      navigation_path: /lawn-pool

                  - type: tile
                    entity: binary_sensor.life_safety_alarm_active
                    name: Life Safety
                    icon: mdi:shield-check
                    color: green
                    tap_action:
                      action: navigate
                      navigation_path: /life-safety

                  - type: tile
                    entity: media_player.living_room
                    name: Audio & Music
                    icon: mdi:speaker-multiple
                    color: pink
                    tap_action:
                      action: navigate
                      navigation_path: /media-hub

                  - type: tile
                    entity: calendar.mealie_dinner
                    name: Meal Planner
                    icon: mdi:silverware-fork-knife
                    color: amber
                    tap_action:
                      action: navigate
                      navigation_path: /meals-planner

                  - type: tile
                    entity: input_boolean.cats_room_occupied
                    name: Cat's Room
                    icon: mdi:ceiling-fan
                    color: amber
                    tap_action:
                      action: navigate
                      navigation_path: /cadets-barracks

                  - type: tile
                    entity: input_boolean.brent_room_occupied
                    name: Brent's Room
                    icon: mdi:bed
                    color: indigo
                    tap_action:
                      action: navigate
                      navigation_path: /brent-room

              # Room Occupancy & Controls
              - type: entities
                title: Room Occupancy & Overrides
                entities:
                  - entity: input_boolean.cats_room_occupied
                    name: Cat's Room Occupied
                    icon: mdi:bed
                  - entity: input_boolean.brent_room_occupied
                    name: Brent's Room Occupied
                    icon: mdi:bed
                  - entity: input_boolean.climate_manual_override
                    name: Climate Manual Override
                    icon: mdi:hand-back-right
                  - entity: input_boolean.climate_sensor_bypass
                    name: Sensor Bypass
                    icon: mdi:thermometer-off

          # ═══════════════════════════════════════════════════════════════════
          # COLUMN 2: SECURITY & LIVE CAMERAS
          # ═══════════════════════════════════════════════════════════════════
          - cards:
              - type: heading
                heading: Security & Cameras
                heading_style: title
                icon: mdi:shield-check-outline

              # Ring Front Door Live Feed
              - type: picture-glance
                title: Front Door & Entry
                camera_image: camera.front_door_live_view_2
                camera_view: live
                entities:
                  - entity: sensor.front_door_battery_2
                    icon: mdi:battery
                  - entity: sensor.front_door_last_activity_2
                    icon: mdi:clock-outline
                tap_action:
                  action: navigate
                  navigation_path: /cameras-hub

              # Grow Room Live Feed
              - type: picture-glance
                title: Grow Room Enclosure
                camera_image: camera.grow_room_clear
                camera_view: auto
                entities:
                  - entity: sensor.grow_room_inside_air_temperature
                    icon: mdi:thermometer
                  - entity: sensor.grow_room_inside_air_relative_humidity
                    icon: mdi:water-percent
                  - entity: sensor.grow_room_inside_vpd
                    icon: mdi:sprout
                tap_action:
                  action: navigate
                  navigation_path: /grow-room

              # Luba Robotic Mower Live Stream
              - type: picture-glance
                title: Lawn Mower Live Vision
                camera_image: camera.yard_luba_va624unr_vision_camera
                camera_view: live
                entities:
                  - entity: sensor.garden_luba_va624unr_battery
                    icon: mdi:battery
                  - entity: sensor.garden_luba_va624unr_mowing_speed
                    icon: mdi:speedometer
                tap_action:
                  action: navigate
                  navigation_path: /lawn-pool

              # Safety Subsystem Diagnostics
              - type: entities
                title: Life Safety Status
                entities:
                  - entity: binary_sensor.life_safety_alarm_active
                    name: Master Smoke / CO Alarm
                    icon: mdi:shield-check
                  - entity: sensor.life_safety_active_zones
                    name: Active Alarm Zones
                    icon: mdi:alert-circle-outline
                  - entity: sensor.life_safety_sensors_monitored
                    name: Monitored Sensors Online
                    icon: mdi:check-network
                  - entity: binary_sensor.150633095484711_tank_full
                    name: Dehumidifier Tank Status
                    icon: mdi:water-alert

          # ═══════════════════════════════════════════════════════════════════
          # COLUMN 3: CLIMATE & LIGHTING
          # ═══════════════════════════════════════════════════════════════════
          - cards:
              - type: heading
                heading: Climate & Lighting
                heading_style: title
                icon: mdi:home-thermometer-outline

              # T6 Thermostat
              - type: thermostat
                entity: climate.t6_pro_z_wave_programmable_thermostat
                name: Front Room Thermostat

              # Environment Matrix
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: tile
                    entity: sensor.house_average_temperature
                    name: House Avg Temp
                    icon: mdi:thermometer
                    color: orange
                  - type: tile
                    entity: sensor.house_average_humidity
                    name: House Humidity
                    icon: mdi:water-percent
                    color: cyan
                  - type: tile
                    entity: sensor.t6_pro_z_wave_programmable_thermostat_air_temperature
                    name: Thermostat Sensor
                    icon: mdi:home-thermometer
                    color: amber
                  - type: tile
                    entity: sensor.grow_room_inside_vpd
                    name: Grow Room VPD
                    icon: mdi:sprout
                    color: light-green

              # Quick Automation Routines
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: tile
                    entity: script.good_night
                    name: Good Night
                    icon: mdi:weather-night
                    color: deep-purple
                    tap_action:
                      action: call-service
                      service: script.good_night

                  - type: tile
                    entity: script.movie_mode
                    name: Movie Mode
                    icon: mdi:movie-open
                    color: indigo
                    tap_action:
                      action: call-service
                      service: script.movie_mode

              # Living Room Accent Lighting
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: tile
                    entity: light.couch_top
                    name: Couch Top
                    icon: mdi:sofa
                    color: amber

                  - type: tile
                    entity: light.couch_bottom
                    name: Couch Bottom
                    icon: mdi:sofa
                    color: amber

                  - type: tile
                    entity: light.cats_ceiling_fan_light
                    name: Cat's Fan
                    icon: mdi:ceiling-fan-light
                    color: amber

                  - type: tile
                    entity: light.corner_top
                    name: Corner Top
                    icon: mdi:floor-lamp-torchiere
                    color: amber

                  - type: tile
                    entity: light.corner_middle
                    name: Corner Mid
                    icon: mdi:floor-lamp
                    color: amber

                  - type: tile
                    entity: light.corner_bottom
                    name: Corner Bot
                    icon: mdi:floor-lamp-outline
                    color: amber

          # ═══════════════════════════════════════════════════════════════════
          # COLUMN 4: FLEET & HOUSEHOLD
          # ═══════════════════════════════════════════════════════════════════
          - cards:
              - type: heading
                heading: Fleet & Household
                heading_style: title
                icon: mdi:robot-outline

              # Autonomous Fleet Quick Status
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: tile
                    entity: vacuum.roborock_qrevo_curv_series
                    name: Roborock Curv
                    icon: mdi:robot-vacuum
                    color: purple
                    tap_action:
                      action: navigate
                      navigation_path: /robot-vacuums

                  - type: tile
                    entity: lawn_mower.garden_luba_va624unr
                    name: Luba Mower
                    icon: mdi:robot-mower
                    color: cyan
                    tap_action:
                      action: navigate
                      navigation_path: /lawn-pool

                  - type: tile
                    entity: script.roborock_curv_clean_room_by_room
                    name: Clean Room-by-Room
                    icon: mdi:play-circle-outline
                    color: deep-purple
                    tap_action:
                      action: call-service
                      service: script.roborock_curv_clean_room_by_room

                  - type: tile
                    entity: sensor.maker_space_x1c_5_smart_plug_power
                    name: 3D Farm Power
                    icon: mdi:lightning-bolt
                    color: deep-orange
                    tap_action:
                      action: navigate
                      navigation_path: /imperial-manufacturing

              # Mealie Dinner Planner
              - type: custom:mealie-mealplan-card
                title: "Tonight's Dinner"
                config_entry_id: 01KRC45RGW4GTDF6KA325E97AB
                day_offset: 0
                show_image: true
                show_description: true
                show_prep_time: false
                show_perform_time: false
                show_total_time: false
                show_rating: false
                show_servings: true
                layout: horizontal
                tap_action:
                  action: navigate
                  navigation_path: /meals-planner

              # Family Schedule Calendar
              - type: calendar
                title: Family Schedule
                entities:
                  - calendar.jmack89427_gmail_com
                  - calendar.jcummings522_gmail_com
                  - calendar.chores
                  - calendar.catriona_cummings
                  - calendar.mealie_dinner
                initial_view: list

              # Modern System Health & Battery Status
              - type: entities
                title: System Health & Batteries
                entities:
                  - entity: sensor.front_door_battery_2
                    name: Front Doorbell Battery
                    icon: mdi:battery
                  - entity: sensor.roborock_qrevo_curv_series_battery
                    name: Roborock Curv Battery
                    icon: mdi:battery-charging
                  - entity: sensor.garden_luba_va624unr_battery
                    name: Luba Mower Battery
                    icon: mdi:battery-charging
                  - entity: binary_sensor.150633095484711_tank_full
                    name: Dehumidifier Bucket Full
                    icon: mdi:water-alert
                  - entity: binary_sensor.life_safety_alarm_active
                    name: Life Safety Alarm State
                    icon: mdi:shield-check
