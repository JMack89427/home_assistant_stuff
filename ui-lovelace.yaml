# ─────────────────────────────────────────────────────────────────────────────
# ui-lovelace.yaml  —  Main household dashboard (8 views, plain naming)
# ─────────────────────────────────────────────────────────────────────────────
# Primary Lovelace dashboard with standard card types (entities, tile, clock,
# picture-entity). Custom imperial-* cards replaced except imperial-alert-panel,
# which has no standard-card equivalent for dynamic low-battery/offline entity
# scanning. Dashboard uses plain household naming (e.g. Home, Cat's Room) for
# all view titles and labels.
#
# NOTE: ui-manufacturing.yaml and ui-cadets-barracks.yaml still retain full
# Imperial theming internally — planned for separate redesign pass.
#
# See ui-lovelace.imperial.yaml.bak for the pre-redesign version (Star Wars
# theming, 10 views, custom imperial-* cards throughout).
# ─────────────────────────────────────────────────────────────────────────────

title: Home
resources:
  - url: /local/imperial-cards.js?v=40
    type: module
  - url: /local/grow-room-cards.js?v=1
    type: module
  - url: /hacsfiles/calendar-card-pro/calendar-card-pro.js
    type: module
  - url: /hacsfiles/mealie-card/mealie-card.js
    type: module
views:

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 1: HOME — DEFAULT LANDING VIEW
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Home
    path: kiosk
    icon: mdi:home
    panel: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: clock
                    clock_size: large
                    show_seconds: false
                  - type: entities
                    title: Atmospheric Conditions
                    entities:
                      - entity: weather.forecast_home_3
                        name: Conditions
                        icon: mdi:weather-cloudy
                      - type: attribute
                        entity: weather.forecast_home_3
                        name: Temperature
                        icon: mdi:thermometer
                        attribute: temperature
                        suffix: "°F"
                      - type: attribute
                        entity: weather.forecast_home_3
                        name: Humidity
                        icon: mdi:water-percent
                        attribute: humidity
                        suffix: "%"
                      - type: attribute
                        entity: weather.forecast_home_3
                        name: Wind Speed
                        icon: mdi:weather-windy
                        attribute: wind_speed
                      - type: attribute
                        entity: weather.forecast_home_3
                        name: Pressure
                        icon: mdi:gauge
                        attribute: pressure
                      - type: attribute
                        entity: weather.forecast_home_3
                        name: UV Index
                        icon: mdi:sun-wireless
                        attribute: uv_index
                      - type: attribute
                        entity: weather.forecast_home_3
                        name: Cloud Cover
                        icon: mdi:cloud-percent
                        attribute: cloud_coverage
                        suffix: "%"

              - type: vertical-stack
                cards:
                  - type: custom:mealie-mealplan-card
                    title: "Tonight's Dinner"
                    config_entry_id: 01KRC45RGW4GTDF6KA325E97AB
                    day_offset: 0
                    show_image: true
                    show_description: true
                    show_prep_time: false
                    show_perform_time: false
                    show_total_time: false
                    show_rating: false
                    show_servings: true
                    layout: horizontal
                  - type: entities
                    title: Outdoor Lights
                    entities:
                      - entity: light.garage_light
                        name: Garage
                        icon: mdi:light-flood-down
                      - entity: light.front_light
                        name: Front
                        icon: mdi:outdoor-lamp
                      - entity: light.side_light
                        name: Side
                        icon: mdi:wall-sconce-flat
                  - type: custom:imperial-alert-panel
                    title: System Alerts
                    battery_threshold: 20

              - type: custom:calendar-card-pro
                entities:
                  - calendar.jmack89427_gmail_com
                  - calendar.jcummings522_gmail_com
                  - calendar.catriona_cummings
                  - calendar.catriona_l_cummings_gmail_com
                  - calendar.chores
                days_to_show: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 2: CAMERAS
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Cameras
    path: detention
    panel: true
    icon: mdi:cctv
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: picture-entity
                entity: camera.front_door_live_view
                name: Front Door
                aspect_ratio: "3 / 4"
              - type: picture-entity
                entity: camera.front_door_live_view_2
                name: Doorbell
                aspect_ratio: "3 / 4"

          - type: horizontal-stack
            cards:
              - type: picture-glance
                title: Front
                camera_image: camera.front_live_view
                camera_view: auto
                entities:
                  - entity: switch.front_motion_detection
                    icon: mdi:motion-sensor
              - type: picture-glance
                title: Garage
                camera_image: camera.garage_live_view
                camera_view: auto
                entities:
                  - entity: switch.garage_motion_detection
                    icon: mdi:motion-sensor
              - type: picture-glance
                title: Side
                camera_image: camera.side_live_view
                camera_view: auto
                entities:
                  - entity: switch.side_motion_detection
                    icon: mdi:motion-sensor

          - type: entities
            title: Motion Detection
            entities:
              - entity: switch.front_door_motion_detection
                name: Front Door Motion
                icon: mdi:shield-lock
              - entity: switch.front_motion_detection
                name: Front Motion
                icon: mdi:shield-lock
              - entity: switch.garage_motion_detection
                name: Garage Motion
                icon: mdi:shield-lock
              - entity: switch.side_motion_detection
                name: Side Motion
                icon: mdi:shield-lock
              - entity: sensor.front_door_battery_2
                name: Doorbell Battery
                icon: mdi:battery
              - entity: sensor.front_door_last_activity_2
                name: Doorbell Last Activity
                icon: mdi:clock-outline

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 3: MEDIA
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Media
    path: communications
    icon: mdi:speaker
    badges: []
    cards:
      - type: media-control
        entity: media_player.living_room
        name: Living Room

      - type: media-control
        entity: media_player.family_room
        name: Family Room

      - type: media-control
        entity: media_player.crafting_room
        name: Crafting Room

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 4: CLIMATE — merges old Operations (thermostat) + Life Support (rooms)
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Climate
    path: operations
    icon: mdi:thermostat
    panel: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: entities
                title: Climate Status — Front Room
                entities:
                  - entity: climate.t6_pro_z_wave_programmable_thermostat
                    name: System Mode
                    icon: mdi:thermostat
                  - type: attribute
                    entity: climate.t6_pro_z_wave_programmable_thermostat
                    name: System Action
                    icon: mdi:lightning-bolt
                    attribute: hvac_action
                  - entity: sensor.t6_pro_z_wave_programmable_thermostat_air_temperature
                    name: Current Temp
                    icon: mdi:thermometer
                  - entity: sensor.t6_pro_z_wave_programmable_thermostat_humidity
                    name: Current Humidity
                    icon: mdi:water-percent
                  - type: attribute
                    entity: climate.t6_pro_z_wave_programmable_thermostat
                    name: Fan Mode
                    icon: mdi:fan
                    attribute: fan_mode
                  - entity: sensor.t6_fan_status
                    name: Fan Status
                    icon: mdi:fan-clock
                  - entity: input_boolean.climate_manual_override
                    name: Manual Override
                    icon: mdi:hand-back-right

              - type: thermostat
                entity: climate.t6_pro_z_wave_programmable_thermostat
                name: Set Temperature

              - type: vertical-stack
                cards:
                  - type: grid
                    columns: 2
                    square: false
                    cards:
                      - type: tile
                        entity: climate.t6_pro_z_wave_programmable_thermostat
                        name: "Off"
                        icon: mdi:power-off
                        tap_action:
                          action: call-service
                          service: climate.set_hvac_mode
                          service_data:
                            entity_id: climate.t6_pro_z_wave_programmable_thermostat
                            hvac_mode: "off"
                      - type: tile
                        entity: climate.t6_pro_z_wave_programmable_thermostat
                        name: Heat
                        icon: mdi:fire
                        tap_action:
                          action: call-service
                          service: climate.set_hvac_mode
                          service_data:
                            entity_id: climate.t6_pro_z_wave_programmable_thermostat
                            hvac_mode: heat
                      - type: tile
                        entity: climate.t6_pro_z_wave_programmable_thermostat
                        name: Cool
                        icon: mdi:snowflake
                        tap_action:
                          action: call-service
                          service: climate.set_hvac_mode
                          service_data:
                            entity_id: climate.t6_pro_z_wave_programmable_thermostat
                            hvac_mode: cool
                      - type: tile
                        entity: climate.t6_pro_z_wave_programmable_thermostat
                        name: Heat + Cool
                        icon: mdi:thermostat-auto
                        tap_action:
                          action: call-service
                          service: climate.set_hvac_mode
                          service_data:
                            entity_id: climate.t6_pro_z_wave_programmable_thermostat
                            hvac_mode: heat_cool

                  - type: grid
                    columns: 3
                    square: false
                    cards:
                      - type: tile
                        entity: climate.t6_pro_z_wave_programmable_thermostat
                        name: Fan Auto
                        icon: mdi:fan-auto
                        tap_action:
                          action: call-service
                          service: climate.set_fan_mode
                          service_data:
                            entity_id: climate.t6_pro_z_wave_programmable_thermostat
                            fan_mode: "Auto low"
                      - type: tile
                        entity: climate.t6_pro_z_wave_programmable_thermostat
                        name: Fan Low
                        icon: mdi:fan-speed-1
                        tap_action:
                          action: call-service
                          service: climate.set_fan_mode
                          service_data:
                            entity_id: climate.t6_pro_z_wave_programmable_thermostat
                            fan_mode: Low
                      - type: tile
                        entity: climate.t6_pro_z_wave_programmable_thermostat
                        name: Fan Circ
                        icon: mdi:fan-chevron-up
                        tap_action:
                          action: call-service
                          service: climate.set_fan_mode
                          service_data:
                            entity_id: climate.t6_pro_z_wave_programmable_thermostat
                            fan_mode: Circulation

          - type: horizontal-stack
            cards:
              - type: entities
                title: Master Bedroom
                entities:
                  - entity: sensor.master_bedroom_primary_suite_temp_humidity_temperature
                    name: Temperature
                    icon: mdi:thermometer
                  - entity: sensor.master_bedroom_primary_suite_temp_humidity_humidity
                    name: Humidity
                    icon: mdi:water-percent

              - type: entities
                title: Basement Office
                entities:
                  - entity: sensor.timmerflotte_temp_hmd_sensor_temperature
                    name: Temperature
                    icon: mdi:thermometer
                  - entity: sensor.timmerflotte_temp_hmd_sensor_humidity
                    name: Humidity
                    icon: mdi:water-percent

              - type: entities
                title: Garage Freezer
                entities:
                  # NOTE: device not plugged in yet per user — state may show unavailable
                  - entity: sensor.temperature_and_humidity_sensor_air_temperature
                    name: Temperature
                    icon: mdi:thermometer
                  - entity: sensor.temperature_and_humidity_sensor_humidity
                    name: Humidity
                    icon: mdi:water-percent

              - type: entities
                title: Front Room
                entities:
                  - entity: sensor.t6_pro_z_wave_programmable_thermostat_air_temperature
                    name: Temperature
                    icon: mdi:thermometer
                  - entity: sensor.t6_pro_z_wave_programmable_thermostat_humidity
                    name: Humidity
                    icon: mdi:water-percent

          - type: horizontal-stack
            cards:
              - type: entities
                title: Office
                entities:
                  - entity: sensor.ewelink_snzb_02p_temperature
                    name: Temperature
                    icon: mdi:thermometer
                  - entity: sensor.ewelink_snzb_02p_humidity
                    name: Humidity
                    icon: mdi:water-percent

              - type: entities
                title: Cat's Room
                entities:
                  - entity: sensor.cats_room_temp_humidity_sensor_temperature
                    name: Temperature
                    icon: mdi:thermometer
                  - entity: sensor.cats_room_temp_humidity_sensor_humidity
                    name: Humidity
                    icon: mdi:water-percent

              - type: entities
                title: Spare Bedroom
                entities:
                  - entity: sensor.spare_bedroom_temp_humidity_sensor_temperature
                    name: Temperature
                    icon: mdi:thermometer
                  - entity: sensor.spare_bedroom_temp_humidity_sensor_humidity
                    name: Humidity
                    icon: mdi:water-percent

              - type: entities
                title: Maker Space
                entities:
                  - entity: sensor.timmerflotte_temp_hmd_sensor_temperature_2
                    name: Temperature
                    icon: mdi:thermometer
                  - entity: sensor.timmerflotte_temp_hmd_sensor_humidity_2
                    name: Humidity
                    icon: mdi:water-percent

          - type: horizontal-stack
            cards:
              - type: entities
                title: House Average
                entities:
                  - entity: sensor.house_average_temperature
                    name: Avg Temperature
                    icon: mdi:thermometer
                  - entity: sensor.house_average_humidity
                    name: Avg Humidity
                    icon: mdi:water-percent

          - type: markdown
            content: "## Dehumidifier"

          - type: horizontal-stack
            cards:
              - type: entities
                title: Dehumidifier
                entities:
                  - entity: humidifier.150633095484711_humidifier
                    name: System Power
                    icon: mdi:power
                  - type: attribute
                    entity: humidifier.150633095484711_humidifier
                    name: Current Humidity
                    icon: mdi:water-percent
                    attribute: current_humidity
                    suffix: "%"
                  - type: attribute
                    entity: humidifier.150633095484711_humidifier
                    name: Target Humidity
                    icon: mdi:target
                    attribute: humidity
                    suffix: "%"
                  - type: attribute
                    entity: humidifier.150633095484711_humidifier
                    name: Active Mode
                    icon: mdi:cog
                    attribute: mode

              - type: grid
                columns: 3
                square: false
                cards:
                  - type: tile
                    entity: humidifier.150633095484711_humidifier
                    name: Manual
                    icon: mdi:hand-back-right
                    tap_action:
                      action: call-service
                      service: humidifier.set_mode
                      service_data:
                        entity_id: humidifier.150633095484711_humidifier
                        mode: Manual
                  - type: tile
                    entity: humidifier.150633095484711_humidifier
                    name: Auto
                    icon: mdi:auto-fix
                    tap_action:
                      action: call-service
                      service: humidifier.set_mode
                      service_data:
                        entity_id: humidifier.150633095484711_humidifier
                        mode: Auto
                  - type: tile
                    entity: humidifier.150633095484711_humidifier
                    name: Continuous
                    icon: mdi:infinity
                    tap_action:
                      action: call-service
                      service: humidifier.set_mode
                      service_data:
                        entity_id: humidifier.150633095484711_humidifier
                        mode: Continuous
                  - type: tile
                    entity: humidifier.150633095484711_humidifier
                    name: Clothes-Dry
                    icon: mdi:tshirt-crew
                    tap_action:
                      action: call-service
                      service: humidifier.set_mode
                      service_data:
                        entity_id: humidifier.150633095484711_humidifier
                        mode: Clothes-Dry
                  - type: tile
                    entity: humidifier.150633095484711_humidifier
                    name: Shoes-Dry
                    icon: mdi:shoe-sneaker
                    tap_action:
                      action: call-service
                      service: humidifier.set_mode
                      service_data:
                        entity_id: humidifier.150633095484711_humidifier
                        mode: Shoes-Dry

