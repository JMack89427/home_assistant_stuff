title: Imperial Command Center
views:

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 1: BRIDGE — Command Overview
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Bridge
    path: bridge
    icon: mdi:space-station
    badges: []
    cards:
      - type: markdown
        content: |
          # ⬡ IMPERIAL COMMAND CENTER ⬡
          All systems nominal. The fleet stands ready, Lord Vader.

      - type: glance
        title: Life Support Systems
        show_name: true
        show_state: true
        show_icon: true
        entities:
          - entity: sensor.temperature_and_humidity_sensor_air_temperature
            name: Temperature
            icon: mdi:thermometer
          - entity: sensor.temperature_and_humidity_sensor_humidity
            name: Humidity
            icon: mdi:water-percent
          - entity: sensor.eero_external_ip
            name: Holonet IP
            icon: mdi:ip-network-outline

      - type: sensor
        entity: sensor.temperature_and_humidity_sensor_air_temperature
        name: Atmospheric Temperature — 24h
        graph: line
        hours_to_show: 24
        detail: 2

      - type: markdown
        content: "## Perimeter Illumination Grid"

      - type: grid
        columns: 3
        square: false
        cards:
          - type: tile
            entity: light.garage_light
            name: Hangar Alpha
            icon: mdi:light-flood-down
          - type: tile
            entity: light.front_light
            name: Forward Array
            icon: mdi:outdoor-lamp
          - type: tile
            entity: light.side_light
            name: Starboard Array
            icon: mdi:wall-sconce-flat

      - type: button
        name: Sync Fleet Configuration
        icon: mdi:sync
        tap_action:
          action: call-service
          service: script.sync_github_config

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 2: DETENTION BLOCK — Surveillance Grid
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Detention Block
    path: detention
    icon: mdi:cctv
    badges: []
    cards:
      - type: markdown
        content: |
          ## Level 5, Block AA-23
          Surveillance grid active. No unauthorized movement tolerated.

      - type: horizontal-stack
        cards:
          - type: picture-glance
            title: Main Airlock
            camera_image: camera.front_door_live_view
            camera_view: auto
            entities:
              - entity: switch.front_door_motion_detection
                icon: mdi:motion-sensor
          - type: picture-glance
            title: Forward Sector
            camera_image: camera.front_live_view
            camera_view: auto
            entities:
              - entity: switch.front_motion_detection
                icon: mdi:motion-sensor

      - type: horizontal-stack
        cards:
          - type: picture-glance
            title: Hangar Bay Alpha
            camera_image: camera.garage_live_view
            camera_view: auto
            entities:
              - entity: switch.garage_motion_detection
                icon: mdi:motion-sensor
          - type: picture-glance
            title: Starboard Sector
            camera_image: camera.side_live_view
            camera_view: auto
            entities:
              - entity: switch.side_motion_detection
                icon: mdi:motion-sensor

      - type: glance
        title: Perimeter Defense Systems
        show_name: true
        show_state: true
        entities:
          - entity: switch.front_door_motion_detection
            name: Main Airlock
            icon: mdi:shield-lock
          - entity: switch.front_motion_detection
            name: Forward Sector
            icon: mdi:shield-lock
          - entity: switch.garage_motion_detection
            name: Hangar Bay
            icon: mdi:shield-lock
          - entity: switch.side_motion_detection
            name: Starboard
            icon: mdi:shield-lock

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 3: SHIP COMMUNICATIONS — Holographic Broadcast Systems
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Ship Comms
    path: communications
    icon: mdi:radio-tower
    badges: []
    cards:
      - type: markdown
        content: |
          ## Ship Communications Array
          Holographic broadcast systems online. Awaiting transmission.

      - type: media-control
        entity: media_player.living_room
        name: Emperor's Throne Room

      - type: media-control
        entity: media_player.family_room
        name: Officers' Quarters

      - type: media-control
        entity: media_player.crafting_room
        name: Engineering Bay

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 4: IMPERIAL OPERATIONS — Standing Orders & Fleet Status
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Operations
    path: operations
    icon: mdi:cog-outline
    badges: []
    cards:
      - type: markdown
        content: |
          ## Imperial Operations Console
          Execute standing orders with Imperial precision. Failure is not an option.

      - type: grid
        columns: 2
        square: false
        cards:
          - type: button
            name: Good Night Protocol
            icon: mdi:power-sleep
            tap_action:
              action: call-service
              service: script.good_night
          - type: button
            name: Movie Mode
            icon: mdi:movie-open
            tap_action:
              action: call-service
              service: script.movie_mode
          - type: button
            name: Sync Fleet Config
            icon: mdi:github
            tap_action:
              action: call-service
              service: script.sync_github_config

      - type: entities
        title: Holonet Status
        entities:
          - entity: sensor.eero_external_ip
            name: Holonet Uplink IP
            icon: mdi:ip-network
