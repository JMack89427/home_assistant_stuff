  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 6: VACUUMS
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Vacuums
    path: droid-bay
    icon: mdi:robot-vacuum
    panel: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Roborock Qrevo Curv"

          - type: grid
            columns: 4
            square: false
            cards:
              - type: tile
                entity: vacuum.roborock_qrevo_curv_series
                name: Start
                icon: mdi:play
                tap_action:
                  action: call-service
                  service: vacuum.start
                  service_data:
                    entity_id: vacuum.roborock_qrevo_curv_series
              - type: tile
                entity: vacuum.roborock_qrevo_curv_series
                name: Pause
                icon: mdi:pause
                tap_action:
                  action: call-service
                  service: vacuum.pause
                  service_data:
                    entity_id: vacuum.roborock_qrevo_curv_series
              - type: tile
                entity: vacuum.roborock_qrevo_curv_series
                name: Stop
                icon: mdi:stop
                tap_action:
                  action: call-service
                  service: vacuum.stop
                  service_data:
                    entity_id: vacuum.roborock_qrevo_curv_series
              - type: tile
                entity: vacuum.roborock_qrevo_curv_series
                name: Return to Base
                icon: mdi:home-import-outline
                tap_action:
                  action: call-service
                  service: vacuum.return_to_base
                  service_data:
                    entity_id: vacuum.roborock_qrevo_curv_series

          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: entities
                    title: Status
                    entities:
                      - entity: sensor.roborock_qrevo_curv_series_status
                        name: Status
                        icon: mdi:information-outline
                      - entity: sensor.roborock_qrevo_curv_series_battery
                        name: Battery
                        icon: mdi:battery
                      - entity: sensor.roborock_qrevo_curv_series_current_room
                        name: Current Room
                        icon: mdi:map-marker
                      - entity: binary_sensor.roborock_qrevo_curv_series_cleaning
                        name: Cleaning
                        icon: mdi:broom
                      - entity: binary_sensor.roborock_qrevo_curv_series_charging
                        name: Charging
                        icon: mdi:lightning-bolt

                  - type: entities
                    title: Active Cleaning
                    entities:
                      - entity: sensor.roborock_qrevo_curv_series_cleaning_area
                        name: Area Covered
                        icon: mdi:texture-box
                      - entity: sensor.roborock_qrevo_curv_series_cleaning_progress
