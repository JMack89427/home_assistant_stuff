  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 8: GROW ROOM (Botanical Bay) — rebuilt 2026-08-14
  #
  # (a) AC Infinity AI+ integration (dalinicus/homeassistant-acinfinity) is
  #     READ-ONLY for AI-series controllers — there is no fan.*/switch.*
  #     entity for any grow-room equipment, only sensor.grow_controller_*
  #     readouts. Do not add control tiles/services against
  #     fan.ac_infinity_cloudline or switch.grow_lights — neither exists.
  #     grow-equipment-card (www/grow-room-cards.js) is read-only for the
  #     same reason; see the comment above its class definition.
  # (b) sensor.grow_tent_* (temp/rh/vpd) are the old simulation entities, now
  #     stale/frozen — do not use.
  # (c) Derived sensor.grow_room_* entities (defined in
  #     packages/botanical_bay.yaml) are the source of truth for this view;
  #     they re-derive temp/RH/VPD from the controller's raw probe/controller
  #     sensors the same way grow_sre's own backend does, since the vendor
  #     integration's own units are unreliable (°F on some sensors, VPD
  #     mislabeled psi).
  # (d) Entity IDs are still contract-shared with the grow_sre repo for the
  #     underlying sensor.grow_controller_* names — relabel only, don't
  #     rename.
  # (e) See the inline comment directly above the statistics-graph card below
  #     for why 14-day trends use statistics-graph, not history-graph — this
  #     repo sets no extended recorder.purge_keep_days.
  # (f) This view now sets theme: brass_instrument — the first per-view theme
  #     override in this repo. Intentional visual divergence from the rest of
  #     the dashboard (which stays on imperial_dark): the Grow Room reads as
  #     its own brass instrument panel, not a Death Star console.
  # (g) column_span layout: masthead heading section is full-width (3/3);
  #     main content (camera + vitals gauges) is 2/3; equipment + trend
  #     sidebar is 1/3 — on wide screens these sit side by side. On narrow/
  #     mobile widths the `sections` view type collapses them to a single
  #     stacked column in source order: video, gauges, equipment, soil trend,
  #     VPD trend. Verified against iPhone 16 Pro (402px) and iPhone 14 Pro
  #     Max (430px) logical widths.
  # (h) grid_options ARE used deliberately here on the camera card and both
  #     new custom cards, because grow-gauge-card and grow-equipment-card
  #     both implement getGridOptions() (unlike the old custom:imperial-panel
  #     / custom:imperial-readout cards, which didn't — that was the reason
  #     for the old "no grid_options anywhere in this view" rule). That old
  #     blanket rule no longer applies to this view.
  # (i) The old "Environment — Inside vs Outside" comparison panel has been
  #     removed from this view per explicit user decision, not an oversight.
  #     sensor.grow_room_outside_temp_f / _outside_humidity / _outside_vpd
  #     remain defined and functional in packages/botanical_bay.yaml — they
  #     are simply no longer displayed on this dashboard.
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Grow Room
    path: botanical-bay
    icon: mdi:sprout
    theme: brass_instrument
    badges: []
    type: sections
    max_columns: 3
    sections:

      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: "BOTANICAL BAY // ENVIRONMENTAL CONTROL"
            heading_style: subtitle
          - type: heading
            heading: GROW ROOM
            heading_style: title
            icon: mdi:sprout
            badges:
              - type: entity
                entity: sensor.grow_room_vpd_status
                color: green
                visibility:
                  - condition: state
                    entity: sensor.grow_room_vpd_status
                    state: "Ideal"
              - type: entity
                entity: sensor.grow_room_vpd_status
                color: yellow
                visibility:
                  - condition: state
                    entity: sensor.grow_room_vpd_status
                    state: "High"
              - type: entity
                entity: sensor.grow_room_vpd_status
                color: red
                visibility:
                  - condition: state
                    entity: sensor.grow_room_vpd_status
                    state: "Low"
              - type: entity
                entity: sensor.grow_room_vpd_status
                color: grey
                visibility:
                  - condition: state
                    entity: sensor.grow_room_vpd_status
                    state: "N/A"
              - type: entity
                entity: sensor.grow_room_soil_status
                color: green
                visibility:
                  - condition: state
                    entity: sensor.grow_room_soil_status
                    state: "Optimal"
              - type: entity
                entity: sensor.grow_room_soil_status
                color: red
                visibility:
                  - condition: state
                    entity: sensor.grow_room_soil_status
                    state: "Needs Water"
              - type: entity
                entity: sensor.grow_room_soil_status
                color: yellow
                visibility:
                  - condition: state
                    entity: sensor.grow_room_soil_status
                    state: "Too Wet"
              - type: entity
                entity: sensor.grow_room_soil_status
                color: grey
                visibility:
                  - condition: state
                    entity: sensor.grow_room_soil_status
                    state: "Unknown"

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: LIVE
            heading_style: subtitle

          - type: picture-entity
            entity: camera.grow_room_clear
            camera_view: live
            aspect_ratio: "16:9"
            show_name: false
            show_state: false
            theme: brass_instrument_porthole
            grid_options:
              columns: full
              rows: auto

          - type: heading
            heading: VITALS
            heading_style: subtitle

          - type: custom:grow-gauge-card
            grid_options:
              columns: full
              rows: auto
            gauges:
              - entity: sensor.grow_room_inside_vpd
                name: VPD
                min: 0
                max: 2.0
                decimals: 2
                ideal_min: 0.8
                ideal_max: 1.2
                status_entity: sensor.grow_room_vpd_status
              - entity: sensor.grow_room_inside_temp_f
                name: Temp
                min: 50
                max: 100
                decimals: 1
              - entity: sensor.grow_room_inside_humidity
                name: Humidity
                min: 0
                max: 100
                decimals: 1
              - entity: sensor.grow_controller_soil_sensor_soil_moisture
                name: Soil Moisture
                min: 0
                max: 100
                decimals: 0
                ideal_min: 40
                ideal_max: 70
                status_entity: sensor.grow_room_soil_status
            footer:
              - entity: sensor.grow_room_dew_point_f
                name: Dew Point

      - type: grid
        column_span: 1
        cards:
          - type: custom:grow-equipment-card
            title: EQUIPMENT
            max: 10
            grid_options:
              columns: full
              rows: auto
            entities:
              - entity: sensor.grow_controller_port_3_current_power
                name: Lights
                icon: mdi:lightbulb-on
              - entity: sensor.grow_controller_port_4_current_power
                name: Humidifier
                icon: mdi:air-humidifier
              - entity: sensor.grow_controller_port_5_current_power
                name: Dehumidifier
                icon: mdi:air-humidifier-off
              - entity: sensor.grow_controller_port_6_current_power
                name: Exhaust Fan
                icon: mdi:fan
              - entity: sensor.grow_controller_port_7_current_power
                name: Oscillating Fan 1
                icon: mdi:fan
              - entity: sensor.grow_controller_port_8_current_power
                name: Oscillating Fan 2
                icon: mdi:fan

          # 14-day soil moisture trend. Uses type: statistics-graph rather than
          # type: history-graph on purpose: this repo sets no recorder: /
          # purge_keep_days anywhere, so raw recorder history only reliably
          # goes back ~10 days (HA stock default) and a history-graph would
          # silently truncate the requested 14-day window. This sensor carries
          # state_class: measurement, so HA records long-term statistics for it
          # and retains them indefinitely regardless of the purge setting —
          # statistics-graph reads those. (The 24h VPD history-graph below is
          # fine as-is; 24h is well inside the raw-history retention window.)
          - type: statistics-graph
            title: "SOIL MOISTURE — 14 DAY TREND"
            days_to_show: 14
            chart_type: line
            stat_types:
              - mean
            entities:
              - entity: sensor.grow_controller_soil_sensor_soil_moisture
                name: Soil Moisture

          - type: history-graph
            title: "VPD HISTORY (INSIDE)"
            hours_to_show: 24
            entities:
              - entity: sensor.grow_room_inside_vpd
                name: VPD (kPa)
