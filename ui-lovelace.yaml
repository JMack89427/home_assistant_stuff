                        icon: mdi:progress-check
                      - entity: sensor.roborock_qrevo_curv_series_cleaning_time
                        name: Cleaning Time
                        icon: mdi:timer
                      - entity: sensor.roborock_qrevo_curv_series_last_clean_begin
                        name: Last Started
                        icon: mdi:clock-start
                      - entity: sensor.roborock_qrevo_curv_series_last_clean_end
