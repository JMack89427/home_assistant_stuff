  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 8: GROW ROOM
  # Entity IDs are contract-shared with the grow_sre repo — relabel only, do
  # not rename sensor.grow_tent_*, fan.ac_infinity_cloudline, switch.grow_lights.
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Grow Room
    path: botanical-bay
    icon: mdi:sprout
    panel: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: entities
                title: Atmospheric Conditions
                entities:
                  - entity: sensor.grow_tent_vpd
                    name: VPD
                    icon: mdi:water-thermometer
                  - entity: sensor.grow_tent_temp
                    name: Temperature
                    icon: mdi:thermometer
                  - entity: sensor.grow_tent_rh
                    name: Humidity
                    icon: mdi:water-percent
                  - entity: sensor.grow_tent_co2
                    name: CO₂
                    icon: mdi:molecule-co2

              - type: entities
                title: Light & Fan Systems
                entities:
                  - entity: fan.ac_infinity_cloudline
                    name: Exhaust Fan
                    icon: mdi:fan
                  - type: attribute
                    entity: fan.ac_infinity_cloudline
                    name: Fan Speed
                    icon: mdi:speedometer
                    attribute: percentage
                  - entity: switch.grow_lights
                    name: Grow Lights
                    icon: mdi:lightbulb-on

          - type: horizontal-stack
            cards:
              - type: gauge
                entity: sensor.grow_tent_vpd
                name: VPD (kPa)
                min: 0
                max: 3
                severity:
                  green: 0.8
                  yellow: 1.4
                  red: 1.8

              - type: gauge
                entity: sensor.grow_tent_temp
                name: Temp (°C)
                min: 15
                max: 35
                severity:
                  green: 20
                  yellow: 28
                  red: 31

              - type: gauge
                entity: sensor.grow_tent_rh
                name: Humidity (%)
                min: 0
                max: 100
                severity:
                  green: 50
                  yellow: 75
                  red: 85

              - type: gauge
                entity: sensor.grow_tent_co2
                name: CO₂ (ppm)
                min: 300
                max: 2000
                severity:
                  green: 800
                  yellow: 1300
                  red: 1600

          - type: horizontal-stack
            cards:
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: tile
                    entity: fan.ac_infinity_cloudline
                    name: Fan Off
                    icon: mdi:fan-off
                    tap_action:
                      action: call-service
                      service: fan.turn_off
                      service_data:
                        entity_id: fan.ac_infinity_cloudline

                  - type: tile
                    entity: fan.ac_infinity_cloudline
                    name: Fan 50%
                    icon: mdi:fan
                    tap_action:
                      action: call-service
                      service: fan.set_percentage
                      service_data:
                        entity_id: fan.ac_infinity_cloudline
                        percentage: 50

                  - type: tile
                    entity: fan.ac_infinity_cloudline
                    name: Fan 100%
                    icon: mdi:fan-alert
                    tap_action:
                      action: call-service
                      service: fan.set_percentage
                      service_data:
                        entity_id: fan.ac_infinity_cloudline
                        percentage: 100

                  - type: tile
                    entity: switch.grow_lights
                    name: Lights On
                    icon: mdi:lightbulb-on
                    tap_action:
                      action: call-service
                      service: switch.turn_on
                      service_data:
                        entity_id: switch.grow_lights

                  - type: tile
                    entity: switch.grow_lights
                    name: Lights Off
                    icon: mdi:lightbulb-off
                    tap_action:
                      action: call-service
                      service: switch.turn_off
                      service_data:
                        entity_id: switch.grow_lights

              - type: history-graph
                title: VPD History
                hours_to_show: 12
                entities:
                  - entity: sensor.grow_tent_vpd
                    name: VPD (kPa)
