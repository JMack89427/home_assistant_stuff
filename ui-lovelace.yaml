  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 6: IMPERIAL LIFE SUPPORT
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Life Support
    path: life-support
    icon: mdi:air-filter
    panel: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: custom:imperial-header
            title: Imperial Life Support Systems
            subtitle: Atmospheric monitoring across all sectors — crew safety nominal
            icon: mdi:air-filter

          - type: horizontal-stack
            cards:
              - type: custom:imperial-panel
                title: Admiral's Quarters
                entities:
                  - entity: sensor.timmerflotte_temp_hmd_sensor_temperature_2
                    name: Temperature
                    icon: mdi:thermometer
                    round: true
                  - entity: sensor.timmerflotte_temp_hmd_sensor_humidity_2
                    name: Humidity
                    icon: mdi:water-percent
                    round: true

              - type: custom:imperial-panel
                title: Lower Deck
                entities:
                  - entity: sensor.timmerflotte_temp_hmd_sensor_temperature
                    name: Temperature
                    icon: mdi:thermometer
                    round: true
                  - entity: sensor.timmerflotte_temp_hmd_sensor_humidity
                    name: Humidity
                    icon: mdi:water-percent
                    round: true

              - type: custom:imperial-panel
                title: Carbonite Vault
                entities:
                  - entity: sensor.temperature_and_humidity_sensor_air_temperature
                    name: Temperature
                    icon: mdi:thermometer
                    round: true
                  - entity: sensor.temperature_and_humidity_sensor_humidity
                    name: Humidity
                    icon: mdi:water-percent
                    round: true

