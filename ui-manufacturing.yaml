title: Imperial Manufacturing Facility
resources:
  - url: /local/imperial-cards.js?v=19
    type: module
views:

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 1: FABRICATION FLEET COMMAND
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Fleet
    path: fleet
    panel: true
    icon: local:galactic-republic
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: custom:imperial-header
            title: Fabrication Fleet Command
            subtitle: Replicator status — all units reporting
            icon: local:galactic-republic

          - type: custom:imperial-fleet-grid
            printers:
              - prefix: p1p_01s00c431300106
                name: Bambu P1P
              - prefix: flsuns1pro
                name: Flsun S1 Pro
              - prefix: printz
                name: Printz
              - prefix: ratrig
                name: RatRig

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 2: BAMBU P1P — UNIT ALPHA
  # ═══════════════════════════════════════════════════════════════════════════
  - title: P1P Alpha
    path: p1p-alpha
    panel: true
    icon: mdi:printer-3d-nozzle
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: custom:imperial-header
            title: Bambu P1P — Unit Alpha
            subtitle: Bambu Lab fabrication unit — Crafting Room
            icon: local:old-republic

          - type: custom:imperial-responsive-columns
            left:
              - type: horizontal-stack
                cards:
                  - type: custom:imperial-readout
                    entity: sensor.p1p_01s00c431300106_print_progress
                    name: Print Progress
                    color: green
                    unit: "%"
                  - type: custom:imperial-readout
                    entity: sensor.p1p_01s00c431300106_current_layer
                    name: Current Layer
                    color: amber
                  - type: custom:imperial-readout
                    entity: sensor.p1p_01s00c431300106_total_layer_count
                    name: Total Layers
                    color: red
              - type: picture-glance
                title: Fabrication Bay
                camera_image: camera.p1p_01s00c431300106_camera
                camera_view: auto
                entities:
                  - entity: binary_sensor.p1p_01s00c431300106_print_error
                    icon: mdi:alert-circle
                  - entity: binary_sensor.p1p_01s00c431300106_online
                    icon: mdi:network
                  - entity: light.p1p_01s00c431300106_chamber_light
                    icon: mdi:lightbulb
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: custom:imperial-button
                    name: Pause
                    icon: mdi:pause-circle
                    service: button.press
                    service_data:
                      entity_id: button.p1p_01s00c431300106_pause_printing
                    entity: button.p1p_01s00c431300106_pause_printing
                    color: amber
                  - type: custom:imperial-button
                    name: Resume
                    icon: mdi:play-circle
                    service: button.press
                    service_data:
                      entity_id: button.p1p_01s00c431300106_resume_printing
                    entity: button.p1p_01s00c431300106_resume_printing
                    color: green
                  - type: custom:imperial-button
                    name: Stop Print
                    icon: mdi:stop-circle
                    service: button.press
                    service_data:
                      entity_id: button.p1p_01s00c431300106_stop_printing
                    entity: button.p1p_01s00c431300106_stop_printing
                    color: red
            right:
              - type: custom:imperial-panel
                title: Fabrication Status
                entities:
                  - entity: sensor.p1p_01s00c431300106_task_name
                    name: Job Name
                    icon: mdi:file-document-outline
                  - entity: sensor.p1p_01s00c431300106_print_status
                    name: Print Status
                    icon: mdi:printer-3d
                  - entity: sensor.p1p_01s00c431300106_current_stage
                    name: Current Stage
                    icon: mdi:state-machine
                  - entity: sensor.p1p_01s00c431300106_remaining_time
                    name: Time Remaining
                    icon: mdi:timer-outline
                  - entity: sensor.p1p_01s00c431300106_end_time
                    name: Est. Completion
                    icon: mdi:clock-end
                  - entity: sensor.p1p_01s00c431300106_print_weight
                    name: Filament Weight
                    icon: mdi:weight-gram
                  - entity: sensor.p1p_01s00c431300106_print_length
                    name: Filament Length
                    icon: mdi:ruler
              - type: custom:imperial-panel
                title: Thermal Systems
                entities:
                  - entity: sensor.p1p_01s00c431300106_nozzle_temperature
                    name: Extruder Temp
                    icon: mdi:printer-3d-nozzle-heat
                  - entity: sensor.p1p_01s00c431300106_bed_temperature
                    name: Bed Temp
                    icon: mdi:radiator

