# ─────────────────────────────────────────────────────────────────────────────
# ui-manufacturing.yaml  —  Manufacturing dashboard (partial redesign)
# ─────────────────────────────────────────────────────────────────────────────
# Multi-view dashboard for 3D printer fleet monitoring and fabrication metadata.
# Redesigned 2026-07-02: most custom imperial-* cards replaced with standard
# Lovelace types (entities, tile, markdown, horizontal/vertical stacks). Custom
# icon-pack references (local:galactic-republic, local:old-republic) replaced
# with mdi:* icons.
#
# INTENTIONALLY RETAINED: custom:imperial-fleet-grid in Fleet view. This card
# performs cross-prefix printer normalization across Bambu/Klipper/PrusaLink
# integrations (backed by packages/manufacturing.yaml) with no standard-card
# equivalent. Kept for functional necessity despite Imperial theming alignment.
#
# KNOWN TRADEOFF: Flsun S1 Pro camera now displays sideways (previously rotated
# 90° by removed imperial-camera card). User approved this tradeoff.
#
# Entity IDs unchanged. See ui-manufacturing.imperial.yaml.bak for pre-redesign.
# ─────────────────────────────────────────────────────────────────────────────

title: Manufacturing
resources:
  - url: /local/imperial-cards.js?v=40
    type: module
views:

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 1: FLEET
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Fleet
    path: fleet
    panel: true
    icon: mdi:printer-3d
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Manufacturing Fleet"

          # imperial-fleet-grid kept as-is — does cross-prefix printer
          # normalization (Bambu/Klipper/PrusaLink) backed by template
          # sensors in packages/manufacturing.yaml, no standard-card equivalent.
          - type: custom:imperial-fleet-grid
            printers:
              - prefix: p1p_01s00c431300106
                name: Bambu P1P
              - prefix: flsuns1pro
                name: Flsun S1 Pro
              - prefix: printz
                name: Printz
              - prefix: ratrig
                name: RatRig
              - prefix: magneto
                name: Magneto X
              - prefix: prusa_mk4
                name: Prusa MK4S
              - prefix: maker_space_x1c_5
                name: X1C 5
              - prefix: x1c_00m09a351803154
                name: X1C 4
              - prefix: x1c_00m09a3c1301432
                name: X1C 6

  # ═══════════════════════════════════════════════════════════════════════════
  # VIEW 2: BAMBU P1P
  # ═══════════════════════════════════════════════════════════════════════════
  - title: Bambu P1P
    path: p1p-alpha
    panel: true
    icon: mdi:printer-3d-nozzle
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Bambu P1P"

          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: horizontal-stack
                    cards:
                      - type: tile
                        entity: sensor.p1p_01s00c431300106_print_progress
                        name: Print Progress
                      - type: tile
                        entity: sensor.p1p_01s00c431300106_current_layer
                        name: Current Layer
                      - type: tile
                        entity: sensor.p1p_01s00c431300106_total_layer_count
                        name: Total Layers
                  - type: picture-glance
                    title: Fabrication Bay
                    camera_image: camera.p1p_01s00c431300106_camera
                    camera_view: auto
                    entities:
                      - entity: binary_sensor.p1p_01s00c431300106_print_error
                        icon: mdi:alert-circle
                      - entity: binary_sensor.p1p_01s00c431300106_online
                        icon: mdi:network
                      - entity: light.p1p_01s00c431300106_chamber_light
                        icon: mdi:lightbulb
                  - type: grid
                    columns: 3
                    square: false
                    cards:
                      - type: tile
                        entity: button.p1p_01s00c431300106_pause_printing
                        name: Pause
                        icon: mdi:pause-circle
                        tap_action:
                          action: call-service
                          service: button.press
                          service_data:
                            entity_id: button.p1p_01s00c431300106_pause_printing
                      - type: tile
                        entity: button.p1p_01s00c431300106_resume_printing
                        name: Resume
                        icon: mdi:play-circle
                        tap_action:
                          action: call-service
                          service: button.press
                          service_data:
                            entity_id: button.p1p_01s00c431300106_resume_printing
                      - type: tile
                        entity: button.p1p_01s00c431300106_stop_printing
                        name: Stop Print
                        icon: mdi:stop-circle
                        tap_action:
                          action: call-service
                          service: button.press
                          service_data:
                            entity_id: button.p1p_01s00c431300106_stop_printing

              - type: vertical-stack
                cards:
                  - type: entities
                    title: Fabrication Status
                    entities:
                      - entity: sensor.p1p_01s00c431300106_task_name
                        name: Job Name
                        icon: mdi:file-document-outline
                      - entity: sensor.p1p_01s00c431300106_print_status
                        name: Print Status
                        icon: mdi:printer-3d
                      - entity: sensor.p1p_01s00c431300106_current_stage
                        name: Current Stage
                        icon: mdi:state-machine
