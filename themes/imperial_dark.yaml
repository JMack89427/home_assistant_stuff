imperial_dark:
  # ═══════════════════════════════════════════════════════════════════════════
  # IMPERIAL DARK THEME — Death Star Command Console
  # The Empire demands precision. No rounded corners. No mercy.
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Core Background Palette ─────────────────────────────────────────────────
  primary-background-color: "#070707"        # Void of space
  secondary-background-color: "#111111"      # Imperial hull plating
  card-background-color: "#191919"           # Console panel grey
  dialog-background-color: "#1D1D1D"         # Briefing room
  clear-background-color: "transparent"

  # ── Imperial Color System ───────────────────────────────────────────────────
  primary-color: "#C8C8C8"                   # Sith Lightsaber Red
  accent-color: "#3D3D3D"                    # Imperial Grey
  light-primary-color: "#E8E8E8"             # Alert red (hover)
  dark-primary-color: "#8C8C8C"              # Deep red (active/pressed)

  # ── Text Hierarchy ──────────────────────────────────────────────────────────
  primary-text-color: "#E8E8E8"              # Primary readout text
  text-primary-color: "#FFFFFF"              # High-contrast labels
  secondary-text-color: "#909090"            # Secondary annotations
  disabled-text-color: "#484848"             # Offline / inactive
  text-accent-color: "#C8C8C8"               # Highlighted text

  # ── State Color System ──────────────────────────────────────────────────────
  state-on-color: "#C8C8C8"                  # Active — Sith Red
  state-off-color: "#3D3D3D"                 # Offline — Imperial Grey
  state-unavailable-color: "#484848"
  state-unknown-color: "#686868"
  state-sensor-color: "#E8E8E8"

  # ── Status Indicator Colors ─────────────────────────────────────────────────
  success-color: "#1B5E20"                   # Systems operational
  warning-color: "#E65100"                   # Alert status
  error-color: "#CC0000"                     # Critical failure
  info-color: "#0D47A1"                      # Holonet data

  # ── Card Styling — Angular, harsh Imperial design ───────────────────────────
  ha-card-border-radius: "0px"               # No curves — the Empire is angular
  ha-card-border-width: "1px"
  ha-card-border-color: "rgba(200,200,200,0.30)"
  ha-card-box-shadow: "0 0 14px rgba(200,200,200,0.10), inset 0 0 1px rgba(255,255,255,0.03)"
  ha-card-background: "var(--card-background-color)"
  ha-card-header-color: "#E8E8E8"            # Card titles in Imperial Red
  ha-card-header-font-size: "16px"

  # ── App Header / Top Bar ────────────────────────────────────────────────────
  app-header-background-color: "#0A0A0A"
  app-header-text-color: "#E8E8E8"
  app-header-edit-background-color: "#0F0F0F"
  app-header-edit-text-color: "#C8C8C8"

  # ── Sidebar / Navigation ────────────────────────────────────────────────────
  sidebar-background-color: "#0A0A0A"
  sidebar-text-color: "#909090"
  sidebar-icon-color: "#686868"
  sidebar-selected-icon-color: "#C8C8C8"
  sidebar-selected-text-color: "#C8C8C8"
  sidebar-selected-background-color: "rgba(200,200,200,0.10)"

  # ── Switches & Toggles ──────────────────────────────────────────────────────
  switch-checked-button-color: "#FFFFFF"
  switch-checked-track-color: "#C8C8C8"
  switch-unchecked-button-color: "#686868"
  switch-unchecked-track-color: "#2A2A2A"

  # ── Sliders ─────────────────────────────────────────────────────────────────
  paper-slider-active-color: "var(--primary-color)"
  paper-slider-knob-color: "var(--primary-color)"
  paper-slider-knob-start-color: "var(--accent-color)"
  paper-slider-pin-color: "var(--primary-color)"
  paper-slider-secondary-color: "rgba(200,200,200,0.30)"

  # ── Chips (Filter / Tag elements) ───────────────────────────────────────────
  chip-background-color: "rgba(200,200,200,0.12)"
  chip-text-color: "var(--primary-text-color)"
  chip-icon-color: "var(--primary-color)"
  chip-border-color: "rgba(200,200,200,0.40)"

  # ── Badges & Labels ─────────────────────────────────────────────────────────
  label-badge-background-color: "var(--primary-background-color)"
  label-badge-text-color: "var(--primary-text-color)"
  label-badge-red: "#CC0000"
  label-badge-blue: "#0D47A1"
  label-badge-green: "#1B5E20"
  label-badge-yellow: "#E65100"
  label-badge-gray: "#3D3D3D"

  # ── Input Fields ────────────────────────────────────────────────────────────
  input-fill-color: "rgba(255,255,255,0.08)"
  input-ink-color: "#1A1A1A"
  input-label-ink-color: "#444444"
  input-idle-line-color: "rgba(200,200,200,0.20)"
  input-hover-line-color: "rgba(200,200,200,0.50)"
  input-disabled-line-color: "rgba(200,200,200,0.10)"
  input-outlined-idle-border-color: "rgba(200,200,200,0.30)"
  input-outlined-hover-border-color: "rgba(200,200,200,0.60)"
  input-outlined-disabled-border-color: "rgba(200,200,200,0.10)"
  input-disabled-fill-color: "rgba(255,255,255,0.02)"
  input-disabled-ink-color: "var(--disabled-text-color)"
  input-disabled-label-ink-color: "var(--disabled-text-color)"

  # ── Dividers & Scroll ───────────────────────────────────────────────────────
  divider-color: "rgba(200,200,200,0.15)"
  scrollbar-thumb-color: "rgba(200,200,200,0.30)"

  # ── MDC Material Components (complete set) ──────────────────────────────────
  mdc-theme-primary: "#C8C8C8"
  mdc-theme-secondary: "#3D3D3D"
  mdc-theme-background: "var(--primary-background-color)"
  mdc-theme-surface: "var(--card-background-color)"
  mdc-theme-error: "#B71C1C"
  mdc-theme-on-primary: "#FFFFFF"
  mdc-theme-on-secondary: "#E8E8E8"
  mdc-theme-on-background: "var(--primary-text-color)"
  mdc-theme-on-surface: "var(--primary-text-color)"
  mdc-theme-on-error: "#FFFFFF"
  mdc-theme-text-primary-on-background: "var(--primary-text-color)"
  mdc-theme-text-secondary-on-background: "var(--secondary-text-color)"
  mdc-theme-text-disabled-on-background: "var(--disabled-text-color)"
  mdc-ripple-color: "#C8C8C8"
  mdc-ripple-unconstrained-opacity: "0.15"

  # ── Paper Components ────────────────────────────────────────────────────────
  paper-item-icon-color: "var(--secondary-text-color)"
  paper-item-icon-active-color: "var(--primary-color)"
  paper-listbox-background-color: "var(--secondary-background-color)"
  paper-dialog-background-color: "var(--dialog-background-color)"
  paper-toast-background-color: "#1F1F1F"

  # ── Energy Dashboard ────────────────────────────────────────────────────────
  energy-grid-consumption-color: "#C8C8C8"
  energy-grid-return-color: "#1B5E20"
  energy-solar-color: "#E65100"
  energy-non-fossil-color: "#1B5E20"
  energy-battery-out-color: "#C8C8C8"
  energy-battery-in-color: "#1B5E20"

  # ── Map Tiles — Dark Space aesthetic ────────────────────────────────────────
  leaflet-tile-filter: "brightness(0.45) invert(0.9) hue-rotate(180deg) saturate(0.4)"
