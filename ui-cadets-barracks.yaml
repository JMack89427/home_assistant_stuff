# ─────────────────────────────────────────────────────────────────────────────
# ui-cadets-barracks.yaml  —  Cat's Room dashboard (standard card redesign)
# ─────────────────────────────────────────────────────────────────────────────
# Single-view dashboard for the household cat room (ceiling fan, lights, temp/
# humidity monitoring). Redesigned 2026-07-02 to replace all custom imperial-*
# cards (imperial-header, imperial-button, imperial-panel) with standard Lovelace
# card types (markdown, tile, entities, grid). Zero custom card dependencies —
# imperial-cards.js resource block removed.
#
# Entity IDs unchanged (fan.cats_ceiling_fan_fan, light.cats_ceiling_fan_light,
# sensor.cats_room_temp_humidity_sensor_*).
#
# See ui-cadets-barracks.imperial.yaml.bak for the pre-redesign version.
# ─────────────────────────────────────────────────────────────────────────────

title: Cat's Room
views:
  - title: Cat's Room
    path: cadets-barracks
    icon: mdi:ceiling-fan
    panel: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Cat's Room"

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: fan.cats_ceiling_fan_fan
                name: Fan On — Low
                icon: mdi:fan-speed-1
                tap_action:
                  action: call-service
                  service: fan.set_percentage
                  service_data:
                    entity_id: fan.cats_ceiling_fan_fan
                    percentage: 25
              - type: tile
                entity: fan.cats_ceiling_fan_fan
                name: Fan Off
                icon: mdi:fan-off
                tap_action:
                  action: call-service
                  service: fan.turn_off
                  service_data:
                    entity_id: fan.cats_ceiling_fan_fan

          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: fan.cats_ceiling_fan_fan
                name: Medium
                icon: mdi:fan-speed-2
                tap_action:
                  action: call-service
                  service: fan.set_percentage
                  service_data:
                    entity_id: fan.cats_ceiling_fan_fan
                    percentage: 50
              - type: tile
                entity: fan.cats_ceiling_fan_fan
                name: Medium High
                icon: mdi:fan-speed-3
                tap_action:
                  action: call-service
                  service: fan.set_percentage
                  service_data:
                    entity_id: fan.cats_ceiling_fan_fan
                    percentage: 75
              - type: tile
                entity: fan.cats_ceiling_fan_fan
                name: High
                icon: mdi:fan
                tap_action:
                  action: call-service
                  service: fan.set_percentage
                  service_data:
                    entity_id: fan.cats_ceiling_fan_fan
                    percentage: 100

          - type: horizontal-stack
            cards:
              - type: entities
                title: Environment
                entities:
                  - entity: sensor.cats_room_temp_humidity_sensor_temperature
                    name: Temperature
                    icon: mdi:thermometer
                  - entity: sensor.cats_room_temp_humidity_sensor_humidity
                    name: Humidity
                    icon: mdi:water-percent
                  - entity: sensor.cats_room_temp_humidity_sensor_battery
                    name: Sensor Battery
                    icon: mdi:battery

              - type: entities
                title: Fan Status
                entities:
                  - entity: fan.cats_ceiling_fan_fan
                    name: Fan
                  - entity: light.cats_ceiling_fan_light
                    name: Light
                  - entity: sensor.cats_ceiling_fan_wifi_rssi
                    name: Signal
                    icon: mdi:wifi
