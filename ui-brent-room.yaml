# ─────────────────────────────────────────────────────────────────────────────
# ui-brent-room.yaml  —  Brent's Room dashboard (standard card design)
# ─────────────────────────────────────────────────────────────────────────────
# Single-view dashboard for Brent's room (temp/humidity monitoring, occupancy
# override). Built standard-cards-first to match the ui-cadets-barracks.yaml
# redesign — no custom imperial-* cards, zero resource dependencies.
#
# Entity scope is intentionally limited: a temp/humidity/battery sensor trio
# (sensor.spare_bedroom_temp_humidity_sensor_*) and the existing occupancy
# input_boolean (input_boolean.brent_room_occupied, defined in
# packages/climate_control.yaml). Confirmed 2026-07-17 against the live HA
# device registry: the sensor device (now assigned to area brent_s_room) has
# no sibling fan or light device in this room, so those rows are omitted —
# unlike Cat's Room, Brent's Room has no ceiling fan/light fixture.
# ─────────────────────────────────────────────────────────────────────────────

title: Brent's Room
views:
  - title: Brent's Room
    path: brent-room
    icon: mdi:bed
    panel: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Brent's Room"

          - type: horizontal-stack
            cards:
              - type: entities
                title: Environment
                entities:
                  - entity: sensor.spare_bedroom_temp_humidity_sensor_temperature
                    name: Temperature
                    icon: mdi:thermometer
                  - entity: sensor.spare_bedroom_temp_humidity_sensor_humidity
                    name: Humidity
                    icon: mdi:water-percent
                  - entity: sensor.spare_bedroom_temp_humidity_sensor_battery
                    name: Sensor Battery
                    icon: mdi:battery

              - type: entities
                title: Room Status
                entities:
                  - entity: input_boolean.brent_room_occupied
                    name: Occupied
                    icon: mdi:bed
