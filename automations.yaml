# ─────────────────────────────────────────────────────────────────────────────
# automations.yaml  —  Home Assistant automation rules
# ─────────────────────────────────────────────────────────────────────────────
# Add automations here or create them through the UI (they will be written to
# this file automatically when the file is referenced by configuration.yaml).
# ─────────────────────────────────────────────────────────────────────────────

# ── Vacuum: Qrevo Curv (main level) — daily 10am ─────────────────────────────
- id: vacuum_curv_daily_10am
  alias: "Vacuum: Curv Series daily 10am"
  trigger:
    - platform: time
      at: "10:00:00"
  condition: []
  action:
    - service: vacuum.start
      target:
        entity_id: vacuum.roborock_qrevo_curv_series
  mode: single

# ── Vacuum: QR 798 (basement) — daily 5pm ────────────────────────────────────
- id: vacuum_qr798_daily_5pm
  alias: "Vacuum: QR 798 daily 5pm"
  trigger:
    - platform: time
      at: "17:00:00"
  condition: []
  action:
    - service: vacuum.start
      target:
        entity_id: vacuum.roborock_qr_798
  mode: single

# ── Climate: Room-balanced heat_cool setpoints ────────────────────────────────
# Runs at 7am (day → 72°F), 10pm (night → 68°F), and every 15 min to
# recalibrate. Offsets the T6 setpoint so the whole-house average hits target.
- id: climate_apply_setpoints
  alias: "Climate: Room-balanced heat/cool setpoints"
  trigger:
    - platform: time
      at: "07:00:00"
    - platform: time
      at: "22:00:00"
    - platform: time_pattern
      minutes: "/15"
  action:
    - variables:
        target: >
          {% if now().hour >= 7 and now().hour < 22 %}72{% else %}68{% endif %}
        t6_temp: >
          {{ states('sensor.t6_pro_z_wave_programmable_thermostat_air_temperature') | float(72) }}
        house_avg: >
          {{ states('sensor.house_average_temperature') | float(72) }}
        offset: "{{ house_avg - t6_temp }}"
        adjusted: "{{ (target | float - offset) | round(0) | int }}"
        cool_sp: "{{ [[adjusted + 1, 69] | max, 78] | min }}"
        heat_sp: "{{ [[cool_sp - 4, 60] | max, 60] | min }}"
        room_temps: >
          {{ [
            states('sensor.timmerflotte_temp_hmd_sensor_temperature') | float(72),
            states('sensor.timmerflotte_temp_hmd_sensor_temperature_2') | float(72),
            states('sensor.timmerflotte_temp_hmd_sensor_temperature_3') | float(72),
            states('sensor.timmerflotte_temp_hmd_sensor_temperature_4') | float(72),
            states('sensor.timmerflotte_temp_hmd_sensor_temperature_5') | float(72),
            states('sensor.timmerflotte_temp_hmd_sensor_temperature_6') | float(72),
            states('sensor.t6_pro_z_wave_programmable_thermostat_air_temperature') | float(72)
          ] }}
        spread: "{{ room_temps | max - room_temps | min }}"
        fan_mode: "{{ 'Circulation' if spread > 3 else 'Auto low' }}"
    - service: climate.set_temperature
      data:
        entity_id: climate.t6_pro_z_wave_programmable_thermostat
        hvac_mode: heat_cool
        target_temp_high: "{{ cool_sp }}"
        target_temp_low: "{{ heat_sp }}"
    - service: climate.set_fan_mode
      data:
        entity_id: climate.t6_pro_z_wave_programmable_thermostat
        fan_mode: "{{ fan_mode }}"
  mode: single

# ── Dehumidifier: Force on when any room exceeds 40% humidity ────────────────
- id: dehumidifier_force_on_any_room_humid
  alias: "Dehumidifier: Force on — any room above 40% humidity"
  trigger:
    - platform: numeric_state
      entity_id:
        - sensor.timmerflotte_temp_hmd_sensor_humidity
        - sensor.timmerflotte_temp_hmd_sensor_humidity_2
        - sensor.timmerflotte_temp_hmd_sensor_humidity_3
        - sensor.timmerflotte_temp_hmd_sensor_humidity_4
        - sensor.timmerflotte_temp_hmd_sensor_humidity_5
        - sensor.timmerflotte_temp_hmd_sensor_humidity_6
        - sensor.t6_pro_z_wave_programmable_thermostat_humidity
      above: 40
  condition: []
  action:
    - service: humidifier.turn_on
      target:
        entity_id: humidifier.150633095484711_humidifier
  mode: single

# ── Dehumidifier: Allow off when all rooms drop to 40% or below ──────────────
- id: dehumidifier_allow_off_all_rooms_dry
  alias: "Dehumidifier: Allow off — all rooms at or below 40% humidity"
  trigger:
    - platform: numeric_state
      entity_id:
        - sensor.timmerflotte_temp_hmd_sensor_humidity
        - sensor.timmerflotte_temp_hmd_sensor_humidity_2
        - sensor.timmerflotte_temp_hmd_sensor_humidity_3
        - sensor.timmerflotte_temp_hmd_sensor_humidity_4
        - sensor.timmerflotte_temp_hmd_sensor_humidity_5
        - sensor.timmerflotte_temp_hmd_sensor_humidity_6
        - sensor.t6_pro_z_wave_programmable_thermostat_humidity
      below: 41
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.timmerflotte_temp_hmd_sensor_humidity') | float(0) <= 40
           and states('sensor.timmerflotte_temp_hmd_sensor_humidity_2') | float(0) <= 40
           and states('sensor.timmerflotte_temp_hmd_sensor_humidity_3') | float(0) <= 40
           and states('sensor.timmerflotte_temp_hmd_sensor_humidity_4') | float(0) <= 40
           and states('sensor.timmerflotte_temp_hmd_sensor_humidity_5') | float(0) <= 40
           and states('sensor.timmerflotte_temp_hmd_sensor_humidity_6') | float(0) <= 40
           and states('sensor.t6_pro_z_wave_programmable_thermostat_humidity') | float(0) <= 40 }}
  action:
    - service: humidifier.turn_off
      target:
        entity_id: humidifier.150633095484711_humidifier
  mode: single

# ── Example: notify when someone arrives home ─────────────────────────────────
- id: notify_someone_arrived_home
  alias: "Notify: Someone arrived home"
  description: Send a notification when a person arrives home.
  trigger:
    - platform: state
      entity_id: person.example_person   # TODO: replace with your person entity
      to: home
  condition: []
  action:
    - service: notify.mobile_app         # TODO: replace with your notification target
      data:
        title: "Welcome home!"
        message: "{{ trigger.to_state.name }} just arrived."
  mode: single

# ── Example: turn off all lights at midnight ──────────────────────────────────
- id: lights_off_at_midnight
  alias: "Lights: Turn off at midnight"
  description: Turn off every light at midnight.
  trigger:
    - platform: time
      at: "00:00:00"
  condition: []
  action:
    - service: light.turn_off
      target:
        area_id: all
  mode: single
