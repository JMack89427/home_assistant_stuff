# ─────────────────────────────────────────────────────────────────────────────
# automations.yaml  —  Home Assistant automation rules
# ─────────────────────────────────────────────────────────────────────────────
# Add automations here or create them through the UI (they will be written to
# this file automatically when the file is referenced by configuration.yaml).
# ─────────────────────────────────────────────────────────────────────────────

# ── Vacuum: Qrevo Curv (main level) — daily 10am ─────────────────────────────
- id: vacuum_curv_daily_10am
  alias: "Vacuum: Curv Series daily 10am"
  trigger:
    - platform: time
      at: "10:00:00"
  condition: []
  action:
    - service: vacuum.start
      target:
        entity_id: vacuum.roborock_qrevo_curv_series
  mode: single

# ── Vacuum: QR 798 (basement) — daily 5pm ────────────────────────────────────
- id: vacuum_qr798_daily_5pm
  alias: "Vacuum: QR 798 daily 5pm"
  trigger:
    - platform: time
      at: "17:00:00"
  condition: []
  action:
    - service: vacuum.start
      target:
        entity_id: vacuum.roborock_qr_798
  mode: single

# ── Climate: Room-balanced heat_cool setpoints ────────────────────────────────
# Runs at 7am (day → 72°F), 10pm (night → 68°F), and every 15 min to
# recalibrate. Offsets the T6 setpoint so the whole-house average hits target.
- id: climate_apply_setpoints
  alias: "Climate: Room-balanced heat/cool setpoints"
  trigger:
    - platform: time
      at: "06:00:00"
      id: day
    - platform: time
      at: "21:00:00"
      id: night
    - platform: time_pattern
      minutes: "/15"
      id: recalibrate
  action:
    - variables:
        is_scheduled: "{{ trigger.id in ['day', 'night'] }}"
        is_day: "{{ now().hour >= 6 and now().hour < 21 }}"
        base_cool: "{{ 72 if is_day else 68 }}"
        base_heat: "{{ 68 if is_day else 64 }}"
        t6_temp: >
          {{ states('sensor.t6_pro_z_wave_programmable_thermostat_air_temperature') | float(72) }}
        house_avg: >
          {{ states('sensor.house_average_temperature') | float(72) }}
        offset: >
          {% if is_state('input_boolean.climate_sensor_bypass', 'on')
             or states('sensor.house_average_temperature') in ['unavailable', 'unknown'] %}
            0
          {% else %}
            {{ house_avg - t6_temp }}
          {% endif %}
        cool_sp: "{{ (base_cool | float - offset) | round(0) | int }}"
        heat_sp: "{{ [[(base_heat | float - offset) | round(0) | int, 60] | max, cool_sp - 3] | min }}"
        room_temps: >
          {{ [
            states('sensor.ewelink_snzb_02p_temperature') | float(72),
            states('sensor.master_bedroom_primary_suite_temp_humidity_temperature') | float(72),
            states('sensor.cats_room_temp_humidity_sensor_temperature') | float(72),
            states('sensor.spare_bedroom_temp_humidity_sensor_temperature') | float(72),
            states('sensor.t6_pro_z_wave_programmable_thermostat_air_temperature') | float(72)
          ] }}
        spread: "{{ room_temps | max - room_temps | min }}"
        fan_mode: "{{ 'Low' if spread > 3 else 'Circulation' }}"
    # Skip recalibration ticks when manual override is active.
    # Scheduled triggers (day/night) always run and clear the override.
    - condition: or
      conditions:
        - condition: template
          value_template: "{{ is_scheduled }}"
        - condition: state
          entity_id: input_boolean.climate_manual_override
          state: "off"
    - service: climate.set_temperature
      target:
        entity_id: climate.t6_pro_z_wave_programmable_thermostat
      data:
        hvac_mode: heat_cool
        target_temp_high: "{{ cool_sp }}"
        target_temp_low: "{{ heat_sp }}"
    - service: climate.set_fan_mode
      target:
        entity_id: climate.t6_pro_z_wave_programmable_thermostat
      data:
        fan_mode: "{{ fan_mode }}"
    - if:
        - condition: template
          value_template: "{{ is_scheduled }}"
      then:
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.climate_manual_override
  mode: single

# ── Dehumidifier: Force on when any room exceeds 40% humidity ────────────────
- id: dehumidifier_force_on_any_room_humid
  alias: "Dehumidifier: Force on — any room above 40% humidity"
  trigger:
    - platform: numeric_state
      entity_id:
        - sensor.ewelink_snzb_02p_humidity
        - sensor.master_bedroom_primary_suite_temp_humidity_humidity
        - sensor.cats_room_temp_humidity_sensor_humidity
        - sensor.spare_bedroom_temp_humidity_sensor_humidity
        - sensor.t6_pro_z_wave_programmable_thermostat_humidity
      above: 40
  condition: []
  action:
    - service: humidifier.turn_on
      target:
        entity_id: humidifier.150633095484711_humidifier
  mode: single

# ── Dehumidifier: Allow off when all rooms drop to 40% or below ──────────────
- id: dehumidifier_allow_off_all_rooms_dry
  alias: "Dehumidifier: Allow off — all rooms at or below 40% humidity"
  trigger:
    - platform: numeric_state
      entity_id:
        - sensor.ewelink_snzb_02p_humidity
        - sensor.master_bedroom_primary_suite_temp_humidity_humidity
        - sensor.cats_room_temp_humidity_sensor_humidity
        - sensor.spare_bedroom_temp_humidity_sensor_humidity
        - sensor.t6_pro_z_wave_programmable_thermostat_humidity
      below: 41
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.ewelink_snzb_02p_humidity') | float(0) <= 40
           and states('sensor.master_bedroom_primary_suite_temp_humidity_humidity') | float(0) <= 40
           and states('sensor.cats_room_temp_humidity_sensor_humidity') | float(0) <= 40
           and states('sensor.spare_bedroom_temp_humidity_sensor_humidity') | float(0) <= 40
           and states('sensor.t6_pro_z_wave_programmable_thermostat_humidity') | float(0) <= 40 }}
  action:
    - service: humidifier.turn_off
      target:
        entity_id: humidifier.150633095484711_humidifier
  mode: single

# ── Terrain: Chopper rain delay ───────────────────────────────────────────────
# Uses weather forecast entity — physical rain sensor unreliable under garage.
# Morning check fires regardless of mower state (day-ahead notice).
# Forecast-change trigger fires only if Chopper is already out mowing.
- id: chopper_rain_delay
  alias: "Terrain: Chopper rain delay"
  trigger:
    - platform: time
      at: "07:00:00"
      id: morning_check
    - platform: state
      entity_id: weather.forecast_home_3
      to:
        - rainy
        - pouring
        - lightning
        - lightning-rainy
        - hail
      id: forecast_change
  condition:
    - condition: template
      value_template: >
        {{ states('weather.forecast_home_3') in
           ['rainy', 'pouring', 'lightning', 'lightning-rainy', 'hail'] }}
    - condition: template
      value_template: >
        {{ trigger.id == 'morning_check' or
           not is_state('lawn_mower.garden_luba_va624unr', 'docked') }}
  action:
    - if:
        - condition: not
          conditions:
            - condition: state
              entity_id: lawn_mower.garden_luba_va624unr
              state: docked
      then:
        - service: lawn_mower.dock
          target:
            entity_id: lawn_mower.garden_luba_va624unr
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations"
        message: >
          Rain forecast ({{ states('weather.forecast_home_3') }}) — Chopper mow delayed today
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations"
        message: >
          Rain forecast ({{ states('weather.forecast_home_3') }}) — Chopper mow delayed today
  mode: single

# ── Terrain: Chopper stuck notification ──────────────────────────────────────
# Template trigger holds for 2 min before firing — debounces momentary obstacles.
- id: chopper_stuck_notification
  alias: "Terrain: Chopper stuck notification"
  trigger:
    - platform: template
      value_template: >
        {{ 'STUCK' in states('sensor.garden_luba_va624unr_activity_mode') or
           'TRAPPED' in states('sensor.garden_luba_va624unr_activity_mode') }}
      for:
        minutes: 2
  condition:
    - condition: not
      conditions:
        - condition: state
          entity_id: lawn_mower.garden_luba_va624unr
          state: docked
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations — CHOPPER STUCK"
        message: "{{ states('sensor.garden_luba_va624unr_last_error') }}"
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations — CHOPPER STUCK"
        message: "{{ states('sensor.garden_luba_va624unr_last_error') }}"
  mode: single


# ── Terrain: LUBA 3 Mow Automations ──────────────────────────────────────────

# 1. Auto-start mowing on clear mornings
- id: chopper_auto_mow_clear_morning
  alias: "Terrain: Auto-mow clear morning (zone rotation)"
  trigger:
    - platform: time
      at: "11:00:00"
  condition:
    - condition: state
      entity_id: lawn_mower.garden_luba_va624unr
      state: docked
    # No-mow day — rotation must NOT advance, so today's zone carries over
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sun
    # Abort if precipitation is forecast — partly cloudy is acceptable
    - condition: not
      conditions:
        - condition: state
          entity_id: weather.forecast_home_3
          state:
            - rainy
            - pouring
            - lightning
            - lightning-rainy
            - hail
  action:
    # Clear any stale low-battery-dock flag before today's run starts — a day
    # that docked on low battery and never recharged above the resume
    # threshold must not corrupt this fresh scheduled mow.
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.chopper_battery_dock_active

    - variables:
        # Resolve the target zone switch dynamically by matching friendly_name
        # rather than a hardcoded entity_id map. This integration has repeatedly
        # regenerated zone switch entity_ids (new internal hash) after restarts
        # or app-side zone edits, silently breaking any hardcoded map. Matching
        # on friendly_name instead is self-healing: as long as the mower still
        # reports "Luba-VA624UNR Area <Zone Name>" for each switch, this finds
        # the right entity regardless of what entity_id HA assigned it this time.
        chopper_target_zone_name: "{{ states('input_select.chopper_mow_rotation') }}"
        chopper_all_zone_switches: >-
          {{ states.switch
             | selectattr('entity_id', 'match', '^switch\.garden_luba_va624unr_area_')
             | selectattr('attributes.friendly_name', 'search', '(North Lawn|Back Lawn|South Lawn)')
             | list }}
        chopper_target_switch: >-
          {{ (chopper_all_zone_switches
              | selectattr('attributes.friendly_name', 'search', chopper_target_zone_name)
              | map(attribute='entity_id')
              | list | first) }}
        chopper_other_switches: >-
          {{ chopper_all_zone_switches
             | rejectattr('entity_id', 'eq', chopper_target_switch)
             | map(attribute='entity_id')
             | list }}

    # Step A/B — turn on the resolved target zone switch
    - service: switch.turn_on
      target:
        entity_id: "{{ chopper_target_switch }}"

    # Step C — turn off the other two rotation switches idempotently
    - service: switch.turn_off
      target:
        entity_id: "{{ chopper_other_switches }}"

    # Step D — start mowing
    - service: lawn_mower.start_mowing
      target:
        entity_id: lawn_mower.garden_luba_va624unr

    # Step E — advance rotation LAST, only after mowing was successfully
    # started; if step D fails/throws, this never runs and the same zone
    # retries on the next scheduled run.
    - service: input_select.select_next
      target:
        entity_id: input_select.chopper_mow_rotation
      data:
        cycle: true
  mode: single

# 2. Dock and alert on low battery
- id: chopper_low_battery_dock
  alias: "Terrain: Low battery dock + alert"
  trigger:
    - platform: numeric_state
      entity_id: sensor.garden_luba_va624unr_battery
      below: 20
  condition:
    - condition: not
      conditions:
        - condition: state
          entity_id: lawn_mower.garden_luba_va624unr
          state: docked
  action:
    # Mark this dock as battery-forced so the resume automation knows to
    # restart mowing later, and so chopper_mow_complete suppresses its
    # "mow complete" notification for this dock event.
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.chopper_battery_dock_active
    - service: lawn_mower.dock
      target:
        entity_id: lawn_mower.garden_luba_va624unr
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations — LOW BATTERY"
        message: >
          CHOPPER battery at {{ states('sensor.garden_luba_va624unr_battery') }}% — returning to dock.
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations — LOW BATTERY"
        message: >
          CHOPPER battery at {{ states('sensor.garden_luba_va624unr_battery') }}% — returning to dock.
  mode: single

# 3. Alert if mower has been paused for 30+ minutes during waking hours
- id: chopper_paused_too_long
  alias: "Terrain: Paused too long alert"
  trigger:
    # Wait 30 min after state transitions to paused before firing
    - platform: state
      entity_id: lawn_mower.garden_luba_va624unr
      to: paused
      for: "00:30:00"
  condition:
    # Suppress overnight — only alert during operational window
    - condition: time
      after: "08:00:00"
      before: "22:00:00"
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations — CHOPPER PAUSED"
        message: >
          CHOPPER has been paused for 30 min.
          Mode: {{ states('sensor.garden_luba_va624unr_activity_mode') }} |
          Last error: {{ states('sensor.garden_luba_va624unr_last_error') }}
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations — CHOPPER PAUSED"
        message: >
          CHOPPER has been paused for 30 min.
          Mode: {{ states('sensor.garden_luba_va624unr_activity_mode') }} |
          Last error: {{ states('sensor.garden_luba_va624unr_last_error') }}
  mode: single

# 4. Alert on any new error state (watchdog)
- id: chopper_error_watchdog
  alias: "Terrain: Error watchdog"
  trigger:
    # Fires on any change to the last_error sensor — no to: filter intentional
    - platform: state
      entity_id: sensor.garden_luba_va624unr_last_error
  condition:
    # Skip sentinel/transient values the integration emits on reconnect
    - condition: template
      value_template: >
        {{ trigger.to_state.state not in
           ['Error message not found', 'unavailable', 'unknown'] }}
    # Skip stale errors — only alert if the sensor changed within the last 60s
    - condition: template
      value_template: >
        {{ (now() - trigger.to_state.last_changed).total_seconds() < 60 }}
    - condition: not
      conditions:
        - condition: state
          entity_id: lawn_mower.garden_luba_va624unr
          state: docked
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations — CHOPPER ERROR"
        message: "{{ trigger.to_state.state }}"
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations — CHOPPER ERROR"
        message: "{{ trigger.to_state.state }}"
  mode: single

# 5. Resume mowing after rain clears
- id: chopper_resume_after_rain
  alias: "Terrain: Resume after rain clears"
  trigger:
    # Fires whenever weather leaves any rain state; to: intentionally open
    - platform: state
      entity_id: weather.forecast_home_3
      from:
        - rainy
        - pouring
        - lightning
        - lightning-rainy
        - hail
  condition:
    # Only resume during the main mow window
    - condition: time
      after: "11:00:00"
      before: "15:00:00"
    # Only issue start_mowing when fully docked — guards against issuing duplicate
    # commands if the forecast oscillates between rain states while mower is mid-run
    - condition: state
      entity_id: lawn_mower.garden_luba_va624unr
      state: docked
    # Guard: don't resume if weather transitioned between rain states
    - condition: not
      conditions:
        - condition: state
          entity_id: weather.forecast_home_3
          state:
            - rainy
            - pouring
            - lightning
            - lightning-rainy
            - hail
  action:
    # Wait for ground to dry before resuming — mode: single drops duplicate triggers during delay
    - delay: "00:30:00"
    - service: lawn_mower.start_mowing
      target:
        entity_id: lawn_mower.garden_luba_va624unr
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations"
        message: "Rain cleared — CHOPPER resuming mow."
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations"
        message: "Rain cleared — CHOPPER resuming mow."
  mode: single

# 6. Resume mowing after low-battery recharge completes
- id: chopper_resume_after_charge
  alias: "Terrain: Resume after low-battery recharge"
  trigger:
    - platform: numeric_state
      entity_id: sensor.garden_luba_va624unr_battery
      above: 90
  condition:
    # Only resume if this was a low-battery-forced dock, not a genuine completion
    - condition: state
      entity_id: input_boolean.chopper_battery_dock_active
      state: "on"
    # Safety — mower must actually be at the charging station before resuming.
    # NOTE: lawn_mower.garden_luba_va624unr's own `docked` state is unreliable
    # for this — the integration reports `paused` (not `docked`) even when the
    # mower is fully charged and sitting at the dock. device_position_type is
    # a more durable signal (reflects physical location, not active charge
    # draw, so it stays CHARGE_ON even after the battery tops out) — unlike
    # binary_sensor.garden_luba_va624unr_charging, which can flip off once
    # fully charged while still docked, or the generic `paused` state, which
    # is also used for unrelated mid-lawn pauses (see chopper_paused_too_long)
    # and would be unsafe to treat as "safe to resume" broadly.
    - condition: state
      entity_id: sensor.garden_luba_va624unr_device_position_type
      state: "CHARGE_ON"
    # Only resume during a reasonable operating window — mower is silent
    # with night-vision capability, so this isn't a noise/darkness guard,
    # just a hard stop against starting a fresh mow cycle after 2am
    - condition: time
      after: "11:00:00"
      before: "02:00:00"
  action:
    # Let the charge reading settle before resuming
    - delay: "00:02:00"
    - service: lawn_mower.start_mowing
      target:
        entity_id: lawn_mower.garden_luba_va624unr
    # Clear the flag LAST, only after start_mowing succeeds — mirrors the
    # advance-only-on-success pattern in chopper_auto_mow_clear_morning
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.chopper_battery_dock_active
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations"
        message: >
          CHOPPER recharged to {{ states('sensor.garden_luba_va624unr_battery') }}% — resuming interrupted mow.
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations"
        message: >
          CHOPPER recharged to {{ states('sensor.garden_luba_va624unr_battery') }}% — resuming interrupted mow.
  mode: single

# 7. Notify when mow session completes (mower returns to dock)
- id: chopper_mow_complete
  alias: "Terrain: Mow complete notification"
  trigger:
    # from: mowing is required so manual recalls etc. don't fire this, but the
    # real guard against spurious alerts is the condition below: it suppresses
    # this notification whenever the dock was low-battery-forced rather than
    # a genuine completed mow.
    - platform: state
      entity_id: lawn_mower.garden_luba_va624unr
      from: mowing
      to: docked
  condition:
    - condition: state
      entity_id: input_boolean.chopper_battery_dock_active
      state: "off"
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations"
        message: >
          CHOPPER mow complete. Battery: {{ states('sensor.garden_luba_va624unr_battery') }}%
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations"
        message: >
          CHOPPER mow complete. Battery: {{ states('sensor.garden_luba_va624unr_battery') }}%
  mode: single

# 8. Connectivity watchdog — reload integration and alert when Mammotion drops
- id: chopper_connection_watchdog
  alias: "Terrain Operations: CHOPPER connection lost"
  trigger:
    - platform: state
      entity_id: sensor.garden_luba_va624unr_connection
      to:
        - unknown
        - unavailable
      for: "00:05:00"
  condition: []
  action:
    - service: homeassistant.reload_config_entry
      data:
        entry_id: 01KG00YSDYK6AJ8M0QTCZ5GX2P
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations"
        message: >
          CHOPPER connection lost — integration reload attempted.
          Check status if issue persists.
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations"
        message: >
          CHOPPER connection lost — integration reload attempted.
          Check status if issue persists.
  mode: single

# ── Vacuum: Watchdog Automations ─────────────────────────────────────────────

- id: vacuum_error_watchdog
  alias: "Vacuum: Error Watchdog"
  description: >
    Notifies when any Roborock vacuum or dock reports a real error state.
  trigger:
    - platform: state
      entity_id:
        - sensor.roborock_qrevo_curv_series_vacuum_error
        - sensor.roborock_qrevo_curv_series_dock_dock_error
        - sensor.roborock_qr_798_vacuum_error
        - sensor.roborock_qr_798_dock_dock_error
  condition:
    - condition: template
      value_template: >
        {{ trigger.to_state.state not in ['none', 'unknown', 'unavailable'] }}
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Vacuum Operations"
        message: >
          {{ trigger.to_state.attributes.friendly_name }} error:
          {{ trigger.to_state.state }}
    - service: notify.mobile_app_ipad
      data:
        title: "Vacuum Operations"
        message: >
          {{ trigger.to_state.attributes.friendly_name }} error:
          {{ trigger.to_state.state }}
  mode: single

- id: vacuum_connection_watchdog
  alias: "Vacuum: Connection Watchdog"
  description: >
    Reloads the Roborock config entry and notifies when either vacuum goes
    unavailable for 5 minutes.
  trigger:
    - platform: state
      entity_id:
        - vacuum.roborock_qrevo_curv_series
        - vacuum.roborock_qr_798
      to: unavailable
      for: "00:05:00"
  action:
    - service: homeassistant.reload_config_entry
      data:
        entry_id: 01KRYAJJ7DTE9BCXKM30X3HEMB
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Vacuum Operations"
        message: >
          {{ trigger.to_state.attributes.friendly_name }} went offline —
          integration reload attempted.
    - service: notify.mobile_app_ipad
      data:
        title: "Vacuum Operations"
        message: >
          {{ trigger.to_state.attributes.friendly_name }} went offline —
          integration reload attempted.
  mode: single

# ── Maintenance: Consumable & Wear Alerts ────────────────────────────────────

- id: vacuum_consumable_alert
  alias: "Vacuum: Consumable Overdue Alert"
  description: >
    Notifies when any Qrevo Curv consumable drops below 10 hours remaining
    (negative values = overdue). Uses mode: queued so each sensor fires its
    own notification rather than being dropped when multiple are simultaneously
    overdue.
  trigger:
    - platform: numeric_state
      entity_id: sensor.roborock_qrevo_curv_series_sensor_time_left
      below: 10
    - platform: numeric_state
      entity_id: sensor.roborock_qrevo_curv_series_filter_time_left
      below: 10
    - platform: numeric_state
      entity_id: sensor.roborock_qrevo_curv_series_side_brush_time_left
      below: 10
    - platform: numeric_state
      entity_id: sensor.roborock_qrevo_curv_series_main_brush_time_left
      below: 10
    - platform: numeric_state
      entity_id: sensor.roborock_qrevo_curv_series_dock_strainer_time_left
      below: 10
  condition:
    - condition: template
      value_template: >
        {{ trigger.to_state.state not in ['unavailable', 'unknown'] }}
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Vacuum Operations"
        message: >
          Curv consumable service due:
          {{ trigger.to_state.attributes.friendly_name }}
          ({{ trigger.to_state.state | round(1) }}h remaining)
    - service: notify.mobile_app_ipad
      data:
        title: "Vacuum Operations"
        message: >
          Curv consumable service due:
          {{ trigger.to_state.attributes.friendly_name }}
          ({{ trigger.to_state.state | round(1) }}h remaining)
  mode: queued
  max: 5

- id: chopper_blade_wear_alert
  alias: "Chopper: Blade Wear Alert"
  description: >
    Notifies when the Mammotion Luba blade used time exceeds 90 hours —
    the recommended replacement interval. Triggers on blade_used_time rather
    than blade_wear_warning_time because the semantics of the warning sensor
    (0.0 = no warning vs. positive = warning hours remaining) are unverified
    from integration docs. Revisit once sensor history is available to confirm
    whether blade_wear_warning_time can replace this trigger.
  trigger:
    - platform: numeric_state
      entity_id: sensor.garden_luba_va624unr_blade_used_time
      above: 200
  condition:
    - condition: template
      value_template: >
        {{ this.last_triggered is none or
           (now() - this.last_triggered).total_seconds() > 604800 }}
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Chopper Maintenance"
        message: >
          Chopper blade service due. Blade used time:
          {{ states('sensor.garden_luba_va624unr_blade_used_time') | round(1) }}h
          (recommended interval: 200h)
    - service: notify.mobile_app_ipad
      data:
        title: "Chopper Maintenance"
        message: >
          Chopper blade service due. Blade used time:
          {{ states('sensor.garden_luba_va624unr_blade_used_time') | round(1) }}h
          (recommended interval: 90h)
  mode: single

- id: vacuum_curv_dock_problem
  alias: "Vacuum: Curv Dock Problem Alert"
  description: >
    Notifies when any Qrevo Curv dock problem sensor turns on (water shortage,
    dirty water box full, or clean water box empty). Sensors use
    device_class: problem where on = problem active.
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.roborock_qrevo_curv_series_water_shortage
        - binary_sensor.roborock_qrevo_curv_series_dock_dirty_water_box
        - binary_sensor.roborock_qrevo_curv_series_dock_clean_water_box
      to: "on"
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Vacuum Operations"
        message: >
          Curv dock problem: {{ trigger.to_state.attributes.friendly_name }}
    - service: notify.mobile_app_ipad
      data:
        title: "Vacuum Operations"
        message: >
          Curv dock problem: {{ trigger.to_state.attributes.friendly_name }}
  mode: single

# ── Manufacturing: Print Monitoring ──────────────────────────────────────────

- id: manufacturing_print_complete
  alias: "Manufacturing: Print Job Complete"
  description: >
    Notifies when any of the six printers completes a print job. Handles
    three different integration state schemas: Moonraker (printing→complete),
    Bambu (running→finish), and PrusaLink (PRINTING→FINISHED). Uses
    mode: parallel so simultaneous completions each generate a notification.
  trigger:
    - platform: state
      entity_id: sensor.flsuns1pro_current_print_state
      from: printing
      to: complete
    - platform: state
      entity_id: sensor.magneto_x_current_print_state
      from: printing
      to: complete
    - platform: state
      entity_id: sensor.printz_current_print_state
      from: printing
      to: complete
    - platform: state
      entity_id: sensor.ratrig_current_print_state
      from: printing
      to: complete
    - platform: state
      entity_id: sensor.p1p_01s00c431300106_print_status
      from: running
      to: finish
    - platform: state
      entity_id: sensor.prusa_mk4s_print_status
      from: PRINTING
      to: FINISHED
  variables:
    filename_map:
      sensor.flsuns1pro_current_print_state: sensor.flsuns1pro_filename
      sensor.magneto_x_current_print_state: sensor.magneto_x_filename
      sensor.printz_current_print_state: sensor.printz_filename
      sensor.ratrig_current_print_state: sensor.ratrig_filename
      sensor.p1p_01s00c431300106_print_status: sensor.p1p_01s00c431300106_gcode_filename
      sensor.prusa_mk4s_print_status: sensor.prusa_mk4_filename
    filename: "{{ states(filename_map[trigger.entity_id]) }}"
    printer: "{{ trigger.to_state.attributes.friendly_name }}"
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Manufacturing"
        message: "{{ printer }} print complete: {{ filename }}"
    - service: notify.mobile_app_ipad
      data:
        title: "Manufacturing"
        message: "{{ printer }} print complete: {{ filename }}"
  mode: parallel
  max: 6

- id: manufacturing_filament_runout
  alias: "Manufacturing: Filament Runout Alert"
  description: >
    Notifies mid-print filament runout on printers with confirmed filament
    sensors. Sensor semantics: off = no filament / runout for all three
    integrations (Moonraker and Bambu both use off = runout/not-loaded).
    Condition ensures the printer is actively printing before alerting,
    suppressing spurious triggers when loading/unloading outside a print.
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.flsuns1pro_filament_sensor
        - binary_sensor.ratrig_toolhead_filament_sensor_t0
        - binary_sensor.p1p_01s00c431300106_extruder_filament_state
      to: "off"
  condition:
    - condition: template
      value_template: >
        {% set print_map = {
          'binary_sensor.flsuns1pro_filament_sensor':
            'sensor.flsuns1pro_current_print_state',
          'binary_sensor.ratrig_toolhead_filament_sensor_t0':
            'sensor.ratrig_current_print_state',
          'binary_sensor.p1p_01s00c431300106_extruder_filament_state':
            'sensor.p1p_01s00c431300106_print_status'
        } %}
        {% set active_states = {
          'binary_sensor.flsuns1pro_filament_sensor': 'printing',
          'binary_sensor.ratrig_toolhead_filament_sensor_t0': 'printing',
          'binary_sensor.p1p_01s00c431300106_extruder_filament_state': 'running'
        } %}
        {{ states(print_map[trigger.entity_id]) == active_states[trigger.entity_id] }}
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Manufacturing — FILAMENT RUNOUT"
        message: >
          {{ trigger.to_state.attributes.friendly_name }}
          — filament runout detected mid-print!
    - service: notify.mobile_app_ipad
      data:
        title: "Manufacturing — FILAMENT RUNOUT"
        message: >
          {{ trigger.to_state.attributes.friendly_name }}
          — filament runout detected mid-print!
  mode: parallel
  max: 3

- id: manufacturing_prusa_plug_off
  alias: "Manufacturing: Prusa MK4S Auto Plug-Off"
  description: >
    Automatically powers off the Prusa MK4S smart plug after print completion.
    The 5-minute delay allows post-print sequences (nozzle park, bed cooling
    fan rundown, final homing moves) to complete before cutting power.
  trigger:
    - platform: state
      entity_id: sensor.prusa_mk4s_print_status
      to: FINISHED
  condition:
    - condition: state
      entity_id: switch.prusa_mk4s_plug
      state: "on"
  action:
    - delay: "00:05:00"
    - service: switch.turn_off
      target:
        entity_id: switch.prusa_mk4s_plug
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Manufacturing"
        message: "Prusa MK4S print complete — plug powered off."
    - service: notify.mobile_app_ipad
      data:
        title: "Manufacturing"
        message: "Prusa MK4S print complete — plug powered off."
  mode: single

# ── Infrastructure: Connectivity & Hardware ───────────────────────────────────

- id: infrastructure_wan_outage
  alias: "Infrastructure: WAN Outage"
  description: >
    Fires a local persistent notification (visible without internet) and
    attempts mobile push (queued for delivery when connectivity returns)
    after the eero WAN sensor reports offline for 2 minutes.
    eero_wan_status semantics: on = WAN connected, off = WAN down
    (standard HA binary sensor convention for connectivity sensors).
  trigger:
    - platform: state
      entity_id: binary_sensor.eero_wan_status
      to: "off"
      for: "00:02:00"
  action:
    - service: persistent_notification.create
      data:
        notification_id: wan_outage
        title: "WAN Outage"
        message: >
          Internet connection lost. Cloud integrations (Roborock, Mammotion,
          Bambu, Ring) will appear unavailable.
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Infrastructure"
        message: "WAN outage detected. Internet connection lost."
    - service: notify.mobile_app_ipad
      data:
        title: "Infrastructure"
        message: "WAN outage detected. Internet connection lost."
  mode: single

- id: infrastructure_wan_restored
  alias: "Infrastructure: WAN Restored"
  description: >
    Dismisses the wan_outage persistent notification and sends a recovery
    push when the eero WAN sensor returns to on (connected).
  trigger:
    - platform: state
      entity_id: binary_sensor.eero_wan_status
      from: "off"
      to: "on"
  action:
    - service: persistent_notification.dismiss
      data:
        notification_id: wan_outage
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Infrastructure"
        message: "Internet connection restored."
    - service: notify.mobile_app_ipad
      data:
        title: "Infrastructure"
        message: "Internet connection restored."
  mode: single

- id: infrastructure_rpi_undervoltage
  alias: "Infrastructure: RPi Under-Voltage Alert"
  description: >
    Notifies immediately when the RPi power monitor detects under-voltage.
    Under-voltage during SD card writes risks filesystem corruption.
    device_class: problem — on = problem detected.
  trigger:
    - platform: state
      entity_id: binary_sensor.rpi_power_status
      to: "on"
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Infrastructure — HA HOST ALERT"
        message: >
          Raspberry Pi under-voltage detected. Check power supply to prevent
          SD card corruption.
    - service: notify.mobile_app_ipad
      data:
        title: "Infrastructure — HA HOST ALERT"
        message: >
          Raspberry Pi under-voltage detected. Check power supply to prevent
          SD card corruption.
  mode: single

# ── Kamino Station: R2 (Spino E1) ────────────────────────────────────────────
- id: r2_low_battery_alert
  alias: "R2: Low Battery Alert"
  description: >
    Alerts when R2's battery drops below 10% while it is accessible (signal
    range). Fires on two paths: (1) battery crosses below 10% while already
    reachable, (2) R2 reconnects after a dive and battery is already low.
    Underwater the vacuum entity goes unavailable — the guard condition blocks
    false triggers from stale sensor values during that window.
  trigger:
    - platform: numeric_state
      entity_id: sensor.pool_spino_e13d6btg_battery
      below: 10
    - platform: state
      entity_id: vacuum.pool_spino_e13d6btg
      from: unavailable
  condition:
    - condition: numeric_state
      entity_id: sensor.pool_spino_e13d6btg_battery
      below: 10
    - condition: not
      conditions:
        - condition: state
          entity_id: vacuum.pool_spino_e13d6btg
          state: unavailable
    - condition: template
      value_template: >
        {{ this.last_triggered is none or
           (now() - this.last_triggered).total_seconds() > 3600 }}
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Kamino Station"
        message: >
          R2 battery critical: {{ states('sensor.pool_spino_e13d6btg_battery') | int }}%.
          Unit is accessible — retrieve or dock for recharge.
    - service: notify.mobile_app_ipad
      data:
        title: "Kamino Station"
        message: >
          R2 battery critical: {{ states('sensor.pool_spino_e13d6btg_battery') | int }}%.
          Unit is accessible — retrieve or dock for recharge.
  mode: single

- id: cadets_barracks_fan_temp_control
  alias: "Cadet's Barracks: Fan Speed — Temperature Adaptive"
  trigger:
    - platform: time_pattern
      minutes: "/15"
  condition:
    - condition: time
      after: "07:00:00"
      before: "21:00:00"
  action:
    - variables:
        setpoint: >
          {{ state_attr('climate.t6_pro_z_wave_programmable_thermostat', 'target_temp_high')
             | float(state_attr('climate.t6_pro_z_wave_programmable_thermostat', 'temperature') | float(72)) }}
        room_temp: "{{ states('sensor.cats_room_temp_humidity_sensor_temperature') | float }}"
        drift: "{{ room_temp - setpoint }}"
        pct: >
          {% if drift <= 0 %} 0
          {% elif drift < 1 %} 25
          {% elif drift < 2 %} 50
          {% elif drift < 3 %} 75
          {% else %} 100
          {% endif %}
    - choose:
        - conditions: "{{ pct | int == 0 }}"
          sequence:
            - service: fan.turn_off
              target:
                entity_id: fan.cats_ceiling_fan_fan
      default:
        - service: fan.set_percentage
          target:
            entity_id: fan.cats_ceiling_fan_fan
          data:
            percentage: "{{ pct | int }}"
  mode: single

- id: cadets_barracks_fan_night_high
  alias: "Cadet's Barracks: Fan — Night High"
  trigger:
    - platform: time
      at: "21:00:00"
  action:
    - service: fan.set_percentage
      target:
        entity_id: fan.cats_ceiling_fan_fan
      data:
        percentage: 100
  mode: single
