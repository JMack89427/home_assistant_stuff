# ─────────────────────────────────────────────────────────────────────────────
# automations.yaml  —  Home Assistant automation rules
# ─────────────────────────────────────────────────────────────────────────────
# Add automations here or create them through the UI (they will be written to
# this file automatically when the file is referenced by configuration.yaml).
#
# CRITICAL AUTOMATIONS: life_safety_smoke_co_alarm (iOS critical push + TTS
# announcement on Sonos), life_safety_sonos_alarm_snapshot/restore (Sonos
# speaker volume management during alarms), life_safety_detector_maintenance
# (low-battery and maintenance alerts for 5 Z-Wave smoke/CO detectors).
# See packages/life_safety.yaml for template sensor definitions and
# customize.yaml for entity-level friendly_name overrides.
# ─────────────────────────────────────────────────────────────────────────────

# ── Vacuum: Qrevo Curv (main level) — daily 10am ─────────────────────────────
- id: vacuum_curv_daily_10am
  alias: "Vacuum: Curv Series daily 10am"
  trigger:
    - platform: time
      at: "10:00:00"
  condition: []
  action:
    - service: vacuum.start
      target:
        entity_id: vacuum.roborock_qrevo_curv_series
  mode: single

# ── Vacuum: QR 798 (basement) — daily 5pm ────────────────────────────────────
- id: vacuum_qr798_daily_5pm
  alias: "Vacuum: QR 798 daily 5pm"
  trigger:
    - platform: time
      at: "17:00:00"
  condition: []
  action:
    - service: vacuum.start
      target:
        entity_id: vacuum.roborock_qr_798
  mode: single

# ── Climate: Room-balanced heat_cool setpoints ────────────────────────────────
# Runs at 7am (day → 72°F), 10pm (night → 68°F), and every 15 min to
# recalibrate. Offsets the T6 setpoint so the whole-house average hits target.
# Also owns fan_mode: forces 'Low' (continuous circulation) when room temps are
# uneven OR house humidity is at/above 45%, to keep air moving through the
# passive whole-house dehumidifier. Sole writer of fan_mode — do not add a
# second automation that calls climate.set_fan_mode.
- id: climate_apply_setpoints
  alias: "Climate: Room-balanced heat/cool setpoints"
  trigger:
    - platform: time
      at: "06:00:00"
      id: day
    - platform: time
      at: "21:00:00"
      id: night
    - platform: time_pattern
      minutes: "/15"
      id: recalibrate
  action:
    - variables:
        is_scheduled: "{{ trigger.id in ['day', 'night'] }}"
        is_day: "{{ now().hour >= 6 and now().hour < 21 }}"
        base_cool: "{{ 72 if is_day else 68 }}"
        base_heat: "{{ 68 if is_day else 64 }}"
        t6_temp: >
          {{ states('sensor.t6_pro_z_wave_programmable_thermostat_air_temperature') | float(72) }}
        house_avg: >
          {{ states('sensor.house_average_temperature') | float(72) }}
        offset: >
          {% if is_state('input_boolean.climate_sensor_bypass', 'on')
             or states('sensor.house_average_temperature') in ['unavailable', 'unknown'] %}
            0
          {% else %}
            {{ house_avg - t6_temp }}
          {% endif %}
        cool_sp: "{{ (base_cool | float - offset) | round(0) | int }}"
        heat_sp: "{{ [[(base_heat | float - offset) | round(0) | int, 60] | max, cool_sp - 3] | min }}"
        room_temps: >
          {{ [
            states('sensor.ewelink_snzb_02p_temperature') | float(72),
            states('sensor.master_bedroom_primary_suite_temp_humidity_temperature') | float(72),
            states('sensor.cats_room_temp_humidity_sensor_temperature') | float(72),
            states('sensor.t6_pro_z_wave_programmable_thermostat_air_temperature') | float(72)
          ] + (
            [states('sensor.spare_bedroom_temp_humidity_sensor_temperature') | float(72)]
            if is_state('input_boolean.brent_room_occupied', 'on') else []
          ) }}
        spread: "{{ room_temps | max - room_temps | min }}"
        # Force continuous low-speed circulation when humid: the whole-house
        # dehumidifier is passive ductwork with no HA entity, so airflow is the
        # only control we have over it.
        house_avg_humidity: "{{ states('sensor.house_average_humidity') | float(0) }}"
        fan_mode: "{{ 'Low' if (spread > 3 or house_avg_humidity >= 45) else 'Circulation' }}"
    # Skip recalibration ticks when manual override is active.
    # Scheduled triggers (day/night) always run and clear the override.
    - condition: or
      conditions:
        - condition: template
          value_template: "{{ is_scheduled }}"
        - condition: state
          entity_id: input_boolean.climate_manual_override
          state: "off"
    - service: climate.set_temperature
      target:
        entity_id: climate.t6_pro_z_wave_programmable_thermostat
      data:
        hvac_mode: heat_cool
        target_temp_high: "{{ cool_sp }}"
        target_temp_low: "{{ heat_sp }}"
    - service: climate.set_fan_mode
      target:
        entity_id: climate.t6_pro_z_wave_programmable_thermostat
      data:
        fan_mode: "{{ fan_mode }}"
    - if:
        - condition: template
          value_template: "{{ is_scheduled }}"
      then:
        - service: input_boolean.turn_off
          target:
            entity_id: input_boolean.climate_manual_override
  mode: single

# ── Dehumidifier: Force on when any room exceeds 40% humidity ────────────────
- id: dehumidifier_force_on_any_room_humid
  alias: "Dehumidifier: Force on — any room above 40% humidity"
  trigger:
    - platform: numeric_state
      entity_id:
        - sensor.ewelink_snzb_02p_humidity
        - sensor.master_bedroom_primary_suite_temp_humidity_humidity
        - sensor.cats_room_temp_humidity_sensor_humidity
        - sensor.spare_bedroom_temp_humidity_sensor_humidity
        - sensor.t6_pro_z_wave_programmable_thermostat_humidity
      above: 40
  condition:
    - condition: template
      value_template: >
        {{ not (trigger.entity_id == 'sensor.spare_bedroom_temp_humidity_sensor_humidity'
                and is_state('input_boolean.brent_room_occupied', 'off')) }}
  action:
    - service: humidifier.turn_on
      target:
        entity_id: humidifier.150633095484711_humidifier
  mode: single

# ── Dehumidifier: Allow off when all rooms drop to 40% or below ──────────────
- id: dehumidifier_allow_off_all_rooms_dry
  alias: "Dehumidifier: Allow off — all rooms at or below 40% humidity"
  trigger:
    - platform: numeric_state
      entity_id:
        - sensor.ewelink_snzb_02p_humidity
        - sensor.master_bedroom_primary_suite_temp_humidity_humidity
        - sensor.cats_room_temp_humidity_sensor_humidity
        - sensor.spare_bedroom_temp_humidity_sensor_humidity
        - sensor.t6_pro_z_wave_programmable_thermostat_humidity
      below: 41
  condition:
    - condition: template
      value_template: >
        {{ states('sensor.ewelink_snzb_02p_humidity') | float(0) <= 40
           and states('sensor.master_bedroom_primary_suite_temp_humidity_humidity') | float(0) <= 40
           and states('sensor.cats_room_temp_humidity_sensor_humidity') | float(0) <= 40
           and states('sensor.t6_pro_z_wave_programmable_thermostat_humidity') | float(0) <= 40
           and (is_state('input_boolean.brent_room_occupied', 'off')
                or states('sensor.spare_bedroom_temp_humidity_sensor_humidity') | float(0) <= 40) }}
  action:
    - service: humidifier.turn_off
      target:
        entity_id: humidifier.150633095484711_humidifier
  mode: single

# ── Dehumidifier: Tank Full ──────────────────────────────────────────────────
- id: dehumidifier_tank_full
  alias: "Dehumidifier: Tank Full"
  trigger:
    - platform: state
      entity_id: binary_sensor.150633095484711_tank_full
      to: "on"
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Dehumidifier"
        message: "Midea 50 Pint tank is full — empty it to resume dehumidifying."
  mode: single

# ── Terrain: Chopper rain delay ───────────────────────────────────────────────
# Uses weather forecast entity — physical rain sensor unreliable under garage.
# Morning check fires regardless of mower state (day-ahead notice).
# Forecast-change trigger fires only if Chopper is already out mowing.
- id: chopper_rain_delay
  alias: "Terrain: Chopper rain delay"
  trigger:
    - platform: time
      at: "07:00:00"
      id: morning_check
    - platform: state
      entity_id: weather.forecast_home_3
      to:
        - rainy
        - pouring
        - lightning
        - lightning-rainy
        - hail
      id: forecast_change
  condition:
    - condition: template
      value_template: >
        {{ states('weather.forecast_home_3') in
           ['rainy', 'pouring', 'lightning', 'lightning-rainy', 'hail'] }}
    - condition: template
      value_template: >
        {{ trigger.id == 'morning_check' or
           not is_state('lawn_mower.garden_luba_va624unr', 'docked') }}
  action:
    - if:
        - condition: not
          conditions:
            - condition: state
              entity_id: lawn_mower.garden_luba_va624unr
              state: docked
      then:
        - service: lawn_mower.dock
          target:
            entity_id: lawn_mower.garden_luba_va624unr
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations"
        message: >
          Rain forecast ({{ states('weather.forecast_home_3') }}) — Chopper's 11am mow may be delayed. Will recheck then.
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations"
        message: >
          Rain forecast ({{ states('weather.forecast_home_3') }}) — Chopper's 11am mow may be delayed. Will recheck then.
  mode: single

# ── Terrain: Chopper stuck notification ──────────────────────────────────────
# Template trigger holds for 2 min before firing — debounces momentary obstacles.
- id: chopper_stuck_notification
  alias: "Terrain: Chopper stuck notification"
  trigger:
    - platform: template
      value_template: >
        {{ 'STUCK' in states('sensor.garden_luba_va624unr_activity_mode') or
           'TRAPPED' in states('sensor.garden_luba_va624unr_activity_mode') }}
      for:
        minutes: 2
  condition:
    - condition: not
      conditions:
        - condition: state
          entity_id: lawn_mower.garden_luba_va624unr
          state: docked
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations — CHOPPER STUCK"
        message: "{{ states('sensor.garden_luba_va624unr_last_error') }}"
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations — CHOPPER STUCK"
        message: "{{ states('sensor.garden_luba_va624unr_last_error') }}"
  mode: single


# ── Terrain: LUBA 3 Mow Automations ──────────────────────────────────────────

# 1. Auto-start mowing on clear mornings
- id: chopper_auto_mow_clear_morning
  alias: "Terrain: Auto-mow clear morning (zone rotation)"
  trigger:
    - platform: time
      at: "11:00:00"
  condition:
    - condition: state
      entity_id: lawn_mower.garden_luba_va624unr
      state: docked
    # No-mow day — rotation must NOT advance, so today's zone carries over
    - condition: time
      weekday:
        - mon
        - tue
        - wed
        - thu
        - fri
        - sun
    # Abort if precipitation is forecast — partly cloudy is acceptable
    - condition: not
      conditions:
        - condition: state
          entity_id: weather.forecast_home_3
          state:
            - rainy
            - pouring
            - lightning
            - lightning-rainy
            - hail
  action:
    # Clear any stale low-battery-dock flag before today's run starts — a day
    # that docked on low battery and never recharged above the resume
    # threshold must not corrupt this fresh scheduled mow.
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.chopper_battery_dock_active

    - variables:
        # Resolve the target zone switch dynamically by matching friendly_name
        # rather than a hardcoded entity_id map. This integration has repeatedly
        # regenerated zone switch entity_ids (new internal hash) after restarts
        # or app-side zone edits, and an area-registry rename (e.g. "garden" ->
        # "yard") regenerates the entity_id's area-name prefix too — either
        # would silently break a hardcoded map. The entity_id filter below is
        # prefix-agnostic (matches any area-name token via \w+, anchored on
        # the mower's stable device slug `_luba_va624unr_area_`), so it
        # self-heals against both the hash suffix changing and the area
        # prefix changing; the friendly_name filter right after it does the
        # actual zone disambiguation — as long as the mower still reports
        # "Luba-VA624UNR Area <Zone Name>" for each switch, this finds the
        # right entity regardless of what entity_id HA assigned it this time.
        #
        # On 2026-08-25 the integration regenerated North/South Lawn with new
        # unique_ids but registered them as new entities rather than updating
        # in place, leaving the old entity_ids as orphaned `restored: true`
        # ghosts stuck at `unavailable`; HA appended `_2` to the new
        # object_ids to resolve the naming collision. Both the ghost and its
        # live duplicate carry the identical friendly_name, and `match` is a
        # prefix test, so both pass the entity_id and friendly_name filters,
        # leaving two candidates per zone and making `| first` non-
        # deterministic. The consequence was not cosmetic: when `| first`
        # picked the ghost, switch.turn_on no-opped against a dead entity
        # while the live switch for that same zone landed in
        # chopper_other_switches and got turned off — deactivating precisely
        # the zone scheduled to mow. The rejectattr('state', ...) liveness
        # filter below resolves this generally: ghosts are always
        # unavailable/restored, live zone switches are always on/off, so the
        # filter self-heals on any future recurrence without hardcoding
        # specific _2/_3 entity_ids.
        #
        # NOTE: the states.switch | selectattr | selectattr prefix below is
        # intentionally duplicated in both chopper_target_switch and
        # chopper_other_switches rather than factored into a shared variable.
        # HA only preserves native Python types across a variable boundary
        # when the rendered string round-trips through ast.literal_eval — a
        # list of State objects does NOT round-trip, so HA silently falls
        # back to storing it as a raw string, and any later selectattr/
        # rejectattr against that "list" iterates it character-by-character
        # instead. Only strings and lists of strings are ever assigned to a
        # variable here to avoid that trap.
        chopper_target_zone_name: "{{ states('input_select.chopper_mow_rotation') }}"
        chopper_target_switch: >-
          {{ (states.switch
              | selectattr('entity_id', 'match', '^switch\.\w+_luba_va624unr_area_')
              | rejectattr('state', 'in', ['unavailable', 'unknown'])
              | selectattr('attributes.friendly_name', 'search', '(North Lawn|Back Lawn|South Lawn)')
              | selectattr('attributes.friendly_name', 'search', chopper_target_zone_name)
              | map(attribute='entity_id')
              | list | first | default('', true)) }}
        chopper_other_switches: >-
          {{ states.switch
             | selectattr('entity_id', 'match', '^switch\.\w+_luba_va624unr_area_')
             | rejectattr('state', 'in', ['unavailable', 'unknown'])
             | selectattr('attributes.friendly_name', 'search', '(North Lawn|Back Lawn|South Lawn)')
             | rejectattr('entity_id', 'eq', chopper_target_switch)
             | map(attribute='entity_id')
             | list }}

    # Step A/B — turn on the resolved target zone switch
    - service: switch.turn_on
      target:
        entity_id: "{{ chopper_target_switch }}"

    # Step C — turn off the other two rotation switches idempotently
    - service: switch.turn_off
      target:
        entity_id: "{{ chopper_other_switches }}"

    # Settle delay — this integration has shown laggy command propagation;
    # calling start_mowing immediately after the zone-switch changes can
    # silently no-op or start with stale zone state. A manual test confirmed
    # a natural pause between toggling the switch and pressing Start works
    # reliably, so give the mower a moment to register the zone change first.
    - delay: "00:00:10"

    # Step D — start mowing
    - service: lawn_mower.start_mowing
      target:
        entity_id: lawn_mower.garden_luba_va624unr

    # Step E — advance rotation LAST, only after mowing was successfully
    # started; if step D fails/throws, this never runs and the same zone
    # retries on the next scheduled run.
    - service: input_select.select_next
      target:
        entity_id: input_select.chopper_mow_rotation
      data:
        cycle: true
  mode: single

# 2. Dock and alert on low battery
- id: chopper_low_battery_dock
  alias: "Terrain: Low battery dock + alert"
  trigger:
    # Battery sensor occasionally glitches to 0% for a fraction of a second
    # during connection instability, then recovers immediately. Require the
    # low reading to hold for a full minute so we only react to genuine
    # gradual battery drain, not the transient glitch.
    - platform: numeric_state
      entity_id: sensor.garden_luba_va624unr_battery
      below: 20
      for: "00:01:00"
  condition:
    - condition: not
      conditions:
        - condition: state
          entity_id: lawn_mower.garden_luba_va624unr
          state: docked
  action:
    # Mark this dock as battery-forced so the resume automation knows to
    # restart mowing later, and so chopper_mow_complete suppresses its
    # "mow complete" notification for this dock event.
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.chopper_battery_dock_active
    - service: lawn_mower.dock
      target:
        entity_id: lawn_mower.garden_luba_va624unr
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations — LOW BATTERY"
        message: >
          CHOPPER battery at {{ states('sensor.garden_luba_va624unr_battery') }}% — returning to dock.
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations — LOW BATTERY"
        message: >
          CHOPPER battery at {{ states('sensor.garden_luba_va624unr_battery') }}% — returning to dock.
  mode: single

# 3. Alert if mower has been paused for 30+ minutes during waking hours
- id: chopper_paused_too_long
  alias: "Terrain: Paused too long alert"
  trigger:
    # Wait 30 min after state transitions to paused before firing
    - platform: state
      entity_id: lawn_mower.garden_luba_va624unr
      to: paused
      for: "00:30:00"
  condition:
    # Suppress overnight — only alert during operational window
    - condition: time
      after: "08:00:00"
      before: "22:00:00"
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations — CHOPPER PAUSED"
        message: >
          CHOPPER has been paused for 30 min.
          Mode: {{ states('sensor.garden_luba_va624unr_activity_mode') }} |
          Last error: {{ states('sensor.garden_luba_va624unr_last_error') }}
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations — CHOPPER PAUSED"
        message: >
          CHOPPER has been paused for 30 min.
          Mode: {{ states('sensor.garden_luba_va624unr_activity_mode') }} |
          Last error: {{ states('sensor.garden_luba_va624unr_last_error') }}
  mode: single

# 4. Alert on any new error state (watchdog)
- id: chopper_error_watchdog
  alias: "Terrain: Error watchdog"
  trigger:
    # Fires on any change to the last_error sensor — no to: filter intentional
    - platform: state
      entity_id: sensor.garden_luba_va624unr_last_error
  condition:
    # Skip sentinel/transient values the integration emits on reconnect
    - condition: template
      value_template: >
        {{ trigger.to_state.state not in
           ['Error message not found', 'unavailable', 'unknown'] }}
    # Skip stale errors — only alert if the sensor changed within the last 60s
    - condition: template
      value_template: >
        {{ (now() - trigger.to_state.last_changed).total_seconds() < 60 }}
    - condition: not
      conditions:
        - condition: state
          entity_id: lawn_mower.garden_luba_va624unr
          state: docked
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations — CHOPPER ERROR"
        message: "{{ trigger.to_state.state }}"
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations — CHOPPER ERROR"
        message: "{{ trigger.to_state.state }}"
  mode: single

# 5. Resume mowing after rain clears
- id: chopper_resume_after_rain
  alias: "Terrain: Resume after rain clears"
  trigger:
    # Fires whenever weather leaves any rain state; to: intentionally open
    - platform: state
      entity_id: weather.forecast_home_3
      from:
        - rainy
        - pouring
        - lightning
        - lightning-rainy
        - hail
  condition:
    # Only resume during the main mow window
    - condition: time
      after: "11:00:00"
      before: "15:00:00"
    # Only issue start_mowing when fully docked — guards against issuing duplicate
    # commands if the forecast oscillates between rain states while mower is mid-run
    - condition: state
      entity_id: lawn_mower.garden_luba_va624unr
      state: docked
    # Guard: don't resume if weather transitioned between rain states
    - condition: not
      conditions:
        - condition: state
          entity_id: weather.forecast_home_3
          state:
            - rainy
            - pouring
            - lightning
            - lightning-rainy
            - hail
  action:
    # Wait for ground to dry before resuming — mode: single drops duplicate triggers during delay
    - delay: "00:30:00"
    - service: lawn_mower.start_mowing
      target:
        entity_id: lawn_mower.garden_luba_va624unr
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations"
        message: "Rain cleared — CHOPPER resuming mow."
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations"
        message: "Rain cleared — CHOPPER resuming mow."
  mode: single

# 6. Resume mowing after low-battery recharge completes
- id: chopper_resume_after_charge
  alias: "Terrain: Resume after low-battery recharge"
  trigger:
    - platform: numeric_state
      entity_id: sensor.garden_luba_va624unr_battery
      above: 90
  condition:
    # Only resume if this was a low-battery-forced dock, not a genuine completion
    - condition: state
      entity_id: input_boolean.chopper_battery_dock_active
      state: "on"
    # Safety — mower must actually be at the charging station before resuming.
    # NOTE: lawn_mower.garden_luba_va624unr's own `docked` state is unreliable
    # for this — the integration reports `paused` (not `docked`) even when the
    # mower is fully charged and sitting at the dock. device_position_type is
    # a more durable signal (reflects physical location, not active charge
    # draw, so it stays CHARGE_ON even after the battery tops out) — unlike
    # binary_sensor.garden_luba_va624unr_charging, which can flip off once
    # fully charged while still docked, or the generic `paused` state, which
    # is also used for unrelated mid-lawn pauses (see chopper_paused_too_long)
    # and would be unsafe to treat as "safe to resume" broadly.
    - condition: state
      entity_id: sensor.garden_luba_va624unr_device_position_type
      state: "CHARGE_ON"
    # Only resume during a reasonable operating window — mower is silent
    # with night-vision capability, so this isn't a noise/darkness guard,
    # just a hard stop against starting a fresh mow cycle after 2am
    - condition: time
      after: "11:00:00"
      before: "02:00:00"
  action:
    # Let the charge reading settle before resuming
    - delay: "00:02:00"
    - service: lawn_mower.start_mowing
      target:
        entity_id: lawn_mower.garden_luba_va624unr
    # Clear the flag LAST, only after start_mowing succeeds — mirrors the
    # advance-only-on-success pattern in chopper_auto_mow_clear_morning
    - service: input_boolean.turn_off
      target:
        entity_id: input_boolean.chopper_battery_dock_active
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations"
        message: >
          CHOPPER recharged to {{ states('sensor.garden_luba_va624unr_battery') }}% — resuming interrupted mow.
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations"
        message: >
          CHOPPER recharged to {{ states('sensor.garden_luba_va624unr_battery') }}% — resuming interrupted mow.
  mode: single

# 7. Notify when mow session completes (mower returns to dock)
- id: chopper_mow_complete
  alias: "Terrain: Mow complete notification"
  trigger:
    # from: mowing is required so manual recalls etc. don't fire this, but the
    # real guard against spurious alerts is the condition below: it suppresses
    # this notification whenever the dock was low-battery-forced rather than
    # a genuine completed mow.
    - platform: state
      entity_id: lawn_mower.garden_luba_va624unr
      from: mowing
      to: docked
  condition:
    - condition: state
      entity_id: input_boolean.chopper_battery_dock_active
      state: "off"
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations"
        message: >
          CHOPPER mow complete. Battery: {{ states('sensor.garden_luba_va624unr_battery') }}%
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations"
        message: >
          CHOPPER mow complete. Battery: {{ states('sensor.garden_luba_va624unr_battery') }}%
  mode: single

# 8. Connectivity watchdog — reload integration and alert when Mammotion drops
- id: chopper_connection_watchdog
  alias: "Terrain Operations: CHOPPER connection lost"
  trigger:
    - platform: state
      entity_id: sensor.garden_luba_va624unr_connection
      to:
        - unknown
        - unavailable
      for: "00:05:00"
  condition: []
  action:
    - service: homeassistant.reload_config_entry
      data:
        entry_id: 01KSQ4PQJK1Z1YJJR15V8VA5KG  # Mammotion (LUBA) config entry ID — must not point to HACS integration
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Terrain Operations"
        message: >
          CHOPPER connection lost — integration reload attempted.
          Check status if issue persists.
    - service: notify.mobile_app_ipad
      data:
        title: "Terrain Operations"
        message: >
          CHOPPER connection lost — integration reload attempted.
          Check status if issue persists.
  mode: single

# ── Vacuum: Watchdog Automations ─────────────────────────────────────────────

- id: vacuum_error_watchdog
  alias: "Vacuum: Error Watchdog"
  description: >
    Notifies when any Roborock vacuum or dock reports a real error state.
  trigger:
    - platform: state
      entity_id:
        - sensor.roborock_qrevo_curv_series_vacuum_error
        - sensor.roborock_qrevo_curv_series_dock_dock_error
        - sensor.roborock_qr_798_vacuum_error
        - sensor.roborock_qr_798_dock_dock_error
  condition:
    - condition: template
      value_template: >
        {{ trigger.to_state.state not in ['none', 'unknown', 'unavailable'] }}
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Vacuum Operations"
        message: >
          {{ trigger.to_state.attributes.friendly_name }} error:
          {{ trigger.to_state.state }}
    - service: notify.mobile_app_ipad
      data:
        title: "Vacuum Operations"
        message: >
          {{ trigger.to_state.attributes.friendly_name }} error:
          {{ trigger.to_state.state }}
  mode: single

- id: vacuum_connection_watchdog
  alias: "Vacuum: Connection Watchdog"
  description: >
    Reloads the Roborock config entry and notifies when either vacuum goes
    unavailable for 5 minutes.
  trigger:
    - platform: state
      entity_id:
        - vacuum.roborock_qrevo_curv_series
        - vacuum.roborock_qr_798
      to: unavailable
      for: "00:05:00"
  action:
    - service: homeassistant.reload_config_entry
      data:
        entry_id: 01KRYAJJ7DTE9BCXKM30X3HEMB
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Vacuum Operations"
        message: >
          {{ trigger.to_state.attributes.friendly_name }} went offline —
          integration reload attempted.
    - service: notify.mobile_app_ipad
      data:
        title: "Vacuum Operations"
        message: >
          {{ trigger.to_state.attributes.friendly_name }} went offline —
          integration reload attempted.
  mode: single

# ── Maintenance: Consumable & Wear Alerts ────────────────────────────────────

- id: vacuum_consumable_alert
  alias: "Vacuum: Consumable Overdue Alert"
  description: >
    Notifies when any Qrevo Curv consumable drops below 10 hours remaining
    (negative values = overdue). Uses mode: queued so each sensor fires its
    own notification rather than being dropped when multiple are simultaneously
    overdue.
  trigger:
    - platform: numeric_state
      entity_id: sensor.roborock_qrevo_curv_series_sensor_time_left
      below: 10
    - platform: numeric_state
      entity_id: sensor.roborock_qrevo_curv_series_filter_time_left
      below: 10
    - platform: numeric_state
      entity_id: sensor.roborock_qrevo_curv_series_side_brush_time_left
      below: 10
    - platform: numeric_state
      entity_id: sensor.roborock_qrevo_curv_series_main_brush_time_left
      below: 10
    - platform: numeric_state
      entity_id: sensor.roborock_qrevo_curv_series_dock_strainer_time_left
      below: 10
  condition:
    - condition: template
      value_template: >
        {{ trigger.to_state.state not in ['unavailable', 'unknown'] }}
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Vacuum Operations"
        message: >
          Curv consumable service due:
          {{ trigger.to_state.attributes.friendly_name }}
          ({{ trigger.to_state.state | round(1) }}h remaining)
    - service: notify.mobile_app_ipad
      data:
        title: "Vacuum Operations"
        message: >
          Curv consumable service due:
          {{ trigger.to_state.attributes.friendly_name }}
          ({{ trigger.to_state.state | round(1) }}h remaining)
  mode: queued
  max: 5

- id: chopper_blade_wear_alert
  alias: "Chopper: Blade Wear Alert"
  description: >
    Notifies when the Mammotion Luba blade used time exceeds 90 hours —
    the recommended replacement interval. Triggers on blade_used_time rather
    than blade_wear_warning_time because the semantics of the warning sensor
    (0.0 = no warning vs. positive = warning hours remaining) are unverified
    from integration docs. Revisit once sensor history is available to confirm
    whether blade_wear_warning_time can replace this trigger.
  trigger:
    - platform: numeric_state
      entity_id: sensor.garden_luba_va624unr_blade_used_time
      above: 200
  condition:
    - condition: template
      value_template: >
        {{ this.last_triggered is none or
           (now() - this.last_triggered).total_seconds() > 604800 }}
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Chopper Maintenance"
        message: >
          Chopper blade service due. Blade used time:
          {{ states('sensor.garden_luba_va624unr_blade_used_time') | round(1) }}h
          (recommended interval: 200h)
    - service: notify.mobile_app_ipad
      data:
        title: "Chopper Maintenance"
        message: >
          Chopper blade service due. Blade used time:
          {{ states('sensor.garden_luba_va624unr_blade_used_time') | round(1) }}h
          (recommended interval: 90h)
  mode: single

- id: vacuum_curv_dock_problem
  alias: "Vacuum: Curv Dock Problem Alert"
  description: >
    Notifies when any Qrevo Curv dock problem sensor turns on (water shortage,
    dirty water box full, or clean water box empty). Sensors use
    device_class: problem where on = problem active.
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.roborock_qrevo_curv_series_water_shortage
        - binary_sensor.roborock_qrevo_curv_series_dock_dirty_water_box
        - binary_sensor.roborock_qrevo_curv_series_dock_clean_water_box
      to: "on"
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Vacuum Operations"
        message: >
          Curv dock problem: {{ trigger.to_state.attributes.friendly_name }}
    - service: notify.mobile_app_ipad
      data:
        title: "Vacuum Operations"
        message: >
          Curv dock problem: {{ trigger.to_state.attributes.friendly_name }}
  mode: single

# ── Manufacturing: Print Monitoring ──────────────────────────────────────────

- id: manufacturing_print_complete
  alias: "Manufacturing: Print Job Complete"
  description: >
    Notifies when any of the six printers completes a print job. Handles
    three different integration state schemas: Moonraker (printing→complete),
    Bambu (running→finish), and PrusaLink (PRINTING→FINISHED). Uses
    mode: parallel so simultaneous completions each generate a notification.
  trigger:
    - platform: state
      entity_id: sensor.flsuns1pro_current_print_state
      from: printing
      to: complete
    - platform: state
      entity_id: sensor.magneto_current_print_state
      from: printing
      to: complete
    - platform: state
      entity_id: sensor.printz_current_print_state
      from: printing
      to: complete
    - platform: state
      entity_id: sensor.ratrig_current_print_state
      from: printing
      to: complete
    - platform: state
      entity_id: sensor.p1p_01s00c431300106_print_status
      from: running
      to: finish
    - platform: state
      entity_id: sensor.prusa_mk4s_print_status
      from: PRINTING
      to: FINISHED
  variables:
    filename_map:
      sensor.flsuns1pro_current_print_state: sensor.flsuns1pro_filename
      sensor.magneto_current_print_state: sensor.magneto_filename
      sensor.printz_current_print_state: sensor.printz_filename
      sensor.ratrig_current_print_state: sensor.ratrig_filename
      sensor.p1p_01s00c431300106_print_status: sensor.p1p_01s00c431300106_gcode_filename
      sensor.prusa_mk4s_print_status: sensor.prusa_mk4_filename
    filename: "{{ states(filename_map[trigger.entity_id]) }}"
    printer: "{{ trigger.to_state.attributes.friendly_name }}"
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Manufacturing"
        message: "{{ printer }} print complete: {{ filename }}"
    - service: notify.mobile_app_ipad
      data:
        title: "Manufacturing"
        message: "{{ printer }} print complete: {{ filename }}"
  mode: parallel
  max: 6

- id: manufacturing_filament_runout
  alias: "Manufacturing: Filament Runout Alert"
  description: >
    Notifies mid-print filament runout on printers with confirmed filament
    sensors. Sensor semantics: off = no filament / runout for all three
    integrations (Moonraker and Bambu both use off = runout/not-loaded).
    Condition ensures the printer is actively printing before alerting,
    suppressing spurious triggers when loading/unloading outside a print.
  trigger:
    - platform: state
      entity_id:
        - binary_sensor.flsuns1pro_filament_sensor
        - binary_sensor.ratrig_toolhead_filament_sensor_t0
        - binary_sensor.p1p_01s00c431300106_extruder_filament_state
      to: "off"
  condition:
    - condition: template
      value_template: >
        {% set print_map = {
          'binary_sensor.flsuns1pro_filament_sensor':
            'sensor.flsuns1pro_current_print_state',
          'binary_sensor.ratrig_toolhead_filament_sensor_t0':
            'sensor.ratrig_current_print_state',
          'binary_sensor.p1p_01s00c431300106_extruder_filament_state':
            'sensor.p1p_01s00c431300106_print_status'
        } %}
        {% set active_states = {
          'binary_sensor.flsuns1pro_filament_sensor': 'printing',
          'binary_sensor.ratrig_toolhead_filament_sensor_t0': 'printing',
          'binary_sensor.p1p_01s00c431300106_extruder_filament_state': 'running'
        } %}
        {{ states(print_map[trigger.entity_id]) == active_states[trigger.entity_id] }}
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Manufacturing — FILAMENT RUNOUT"
        message: >
          {{ trigger.to_state.attributes.friendly_name }}
          — filament runout detected mid-print!
    - service: notify.mobile_app_ipad
      data:
        title: "Manufacturing — FILAMENT RUNOUT"
        message: >
          {{ trigger.to_state.attributes.friendly_name }}
          — filament runout detected mid-print!
  mode: parallel
  max: 3

- id: manufacturing_prusa_plug_off
  alias: "Manufacturing: Prusa MK4S Auto Plug-Off"
  description: >
    Automatically powers off the Prusa MK4S smart plug after print completion.
    The 5-minute delay allows post-print sequences (nozzle park, bed cooling
    fan rundown, final homing moves) to complete before cutting power.
  trigger:
    - platform: state
      entity_id: sensor.prusa_mk4s_print_status
      to: FINISHED
  condition:
    - condition: state
      entity_id: switch.prusa_mk4s_plug
      state: "on"
  action:
    - delay: "00:05:00"
    - service: switch.turn_off
      target:
        entity_id: switch.prusa_mk4s_plug
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Manufacturing"
        message: "Prusa MK4S print complete — plug powered off."
    - service: notify.mobile_app_ipad
      data:
        title: "Manufacturing"
        message: "Prusa MK4S print complete — plug powered off."
  mode: single

# ── Infrastructure: Connectivity & Hardware ───────────────────────────────────

- id: infrastructure_wan_outage
  alias: "Infrastructure: WAN Outage"
  description: >
    Fires a local persistent notification (visible without internet) and
    attempts mobile push (queued for delivery when connectivity returns)
    after the eero WAN sensor reports offline for 2 minutes.
    eero_wan_status semantics: on = WAN connected, off = WAN down
    (standard HA binary sensor convention for connectivity sensors).
  trigger:
    - platform: state
      entity_id: binary_sensor.eero_wan_status
      to: "off"
      for: "00:02:00"
  action:
    - service: persistent_notification.create
      data:
        notification_id: wan_outage
        title: "WAN Outage"
        message: >
          Internet connection lost. Cloud integrations (Roborock, Mammotion,
          Bambu, Ring) will appear unavailable.
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Infrastructure"
        message: "WAN outage detected. Internet connection lost."
    - service: notify.mobile_app_ipad
      data:
        title: "Infrastructure"
        message: "WAN outage detected. Internet connection lost."
  mode: single

- id: infrastructure_wan_restored
  alias: "Infrastructure: WAN Restored"
  description: >
    Dismisses the wan_outage persistent notification and sends a recovery
    push when the eero WAN sensor returns to on (connected).
  trigger:
    - platform: state
      entity_id: binary_sensor.eero_wan_status
      from: "off"
      to: "on"
  action:
    - service: persistent_notification.dismiss
      data:
        notification_id: wan_outage
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Infrastructure"
        message: "Internet connection restored."
    - service: notify.mobile_app_ipad
      data:
        title: "Infrastructure"
        message: "Internet connection restored."
  mode: single

- id: infrastructure_rpi_undervoltage
  alias: "Infrastructure: RPi Under-Voltage Alert"
  description: >
    Notifies immediately when the RPi power monitor detects under-voltage.
    Under-voltage during SD card writes risks filesystem corruption.
    device_class: problem — on = problem detected.
  trigger:
    - platform: state
      entity_id: binary_sensor.rpi_power_status
      to: "on"
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Infrastructure — HA HOST ALERT"
        message: >
          Raspberry Pi under-voltage detected. Check power supply to prevent
          SD card corruption.
    - service: notify.mobile_app_ipad
      data:
        title: "Infrastructure — HA HOST ALERT"
        message: >
          Raspberry Pi under-voltage detected. Check power supply to prevent
          SD card corruption.
  mode: single

# ── Kamino Station: R2 (Spino E1) ────────────────────────────────────────────
- id: r2_low_battery_alert
  alias: "R2: Low Battery Alert"
  description: >
    Alerts when R2's battery drops below 10% while it is accessible (signal
    range). Fires on two paths: (1) battery crosses below 10% while already
    reachable, (2) R2 reconnects after a dive and battery is already low.
    Underwater the vacuum entity goes unavailable — the guard condition blocks
    false triggers from stale sensor values during that window.
  trigger:
    - platform: numeric_state
      entity_id: sensor.pool_spino_e13d6btg_battery
      below: 10
    - platform: state
      entity_id: vacuum.pool_spino_e13d6btg
      from: unavailable
  condition:
    - condition: numeric_state
      entity_id: sensor.pool_spino_e13d6btg_battery
      below: 10
    - condition: not
      conditions:
        - condition: state
          entity_id: vacuum.pool_spino_e13d6btg
          state: unavailable
    - condition: template
      value_template: >
        {{ this.last_triggered is none or
           (now() - this.last_triggered).total_seconds() > 3600 }}
  action:
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Kamino Station"
        message: >
          R2 battery critical: {{ states('sensor.pool_spino_e13d6btg_battery') | int }}%.
          Unit is accessible — retrieve or dock for recharge.
    - service: notify.mobile_app_ipad
      data:
        title: "Kamino Station"
        message: >
          R2 battery critical: {{ states('sensor.pool_spino_e13d6btg_battery') | int }}%.
          Unit is accessible — retrieve or dock for recharge.
  mode: single

- id: cadets_barracks_fan_temp_control
  alias: "Cadet's Barracks: Fan Speed — Temperature Adaptive"
  trigger:
    - platform: time_pattern
      minutes: "/15"
  condition:
    - condition: time
      after: "07:00:00"
      before: "21:00:00"
  action:
    - variables:
        setpoint: >
          {{ state_attr('climate.t6_pro_z_wave_programmable_thermostat', 'target_temp_high')
             | float(state_attr('climate.t6_pro_z_wave_programmable_thermostat', 'temperature') | float(72)) }}
        room_temp: "{{ states('sensor.cats_room_temp_humidity_sensor_temperature') | float }}"
        drift: "{{ room_temp - setpoint }}"
        pct: >
          {% if drift <= 0 %} 0
          {% elif drift < 1 %} 25
          {% elif drift < 2 %} 50
          {% elif drift < 3 %} 75
          {% else %} 100
          {% endif %}
    - choose:
        - conditions: "{{ pct | int == 0 }}"
          sequence:
            - service: fan.turn_off
              target:
                entity_id: fan.cats_ceiling_fan_fan
      default:
        - service: fan.set_percentage
          target:
            entity_id: fan.cats_ceiling_fan_fan
          data:
            percentage: "{{ pct | int }}"
  mode: single

- id: cadets_barracks_fan_night_high
  alias: "Cadet's Barracks: Fan — Night High"
  trigger:
    - platform: time
      at: "21:00:00"
  action:
    - service: fan.set_percentage
      target:
        entity_id: fan.cats_ceiling_fan_fan
      data:
        percentage: 100
  mode: single

# ── Grow Room: Detect Watering Event ─────────────────────────────────────────
# No physical pump/valve exists (hand-watered) — watering is inferred from the
# soil moisture sawtooth: gradual drying, then a sharp rise on watering. A
# below-45% crossing arms the Schmitt trigger; the next above-60% crossing
# while armed is treated as one watering cycle. Requiring the prior dry
# crossing (via the armed condition) keeps an isolated wet-crossing — e.g.
# right after an HA restart — from being counted as a real cycle.
# input_number.grow_room_watering_interval_avg is an adaptive EMA (alpha=0.4)
# over the interval between cycles, not a plain running mean, so it tracks
# the plant's current drying rate rather than being anchored to old cycles.
# See packages/botanical_bay.yaml header for the full write-up.
- id: grow_room_detect_watering
  alias: "Grow Room: Detect Watering Event"
  trigger:
    - platform: numeric_state
      entity_id: sensor.grow_controller_soil_sensor_soil_moisture
      below: 45
      id: dry
    - platform: numeric_state
      entity_id: sensor.grow_controller_soil_sensor_soil_moisture
      above: 60
      id: wet
  condition: []
  action:
    - choose:
        # Dry crossing: arm. If already armed (e.g. a wobble back below 45
        # before a real watering) this is a harmless no-op.
        - conditions: "{{ trigger.id == 'dry' }}"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.grow_room_soil_armed

        # Wet crossing, but only counted as a real watering cycle if it was
        # preceded by an armed (dry) crossing.
        - conditions:
            - condition: template
              value_template: "{{ trigger.id == 'wet' }}"
            - condition: state
              entity_id: input_boolean.grow_room_soil_armed
              state: "on"
          sequence:
            - variables:
                last_watered: "{{ states('input_datetime.grow_room_last_watered') }}"
            - if:
                # Very first watering event ever observed — no prior
                # timestamp to diff against, so just seed last_watered and
                # skip the EMA math entirely (don't touch the average or
                # counter on this cycle).
                - condition: template
                  value_template: "{{ last_watered in ['unknown', 'unavailable'] }}"
              then:
                - service: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.grow_room_last_watered
                  data:
                    datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                - service: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.grow_room_soil_armed
              else:
                - variables:
                    interval_hours: "{{ (now() - as_local(as_datetime(last_watered))).total_seconds() / 3600 }}"
                    current_avg: "{{ states('input_number.grow_room_watering_interval_avg') | float(0) }}"
                    events_so_far: "{{ states('counter.grow_room_watering_events') | int(0) }}"
                    new_avg: >
                      {% if events_so_far == 0 %}
                        {{ interval_hours }}
                      {% else %}
                        {{ 0.4 * interval_hours + 0.6 * current_avg }}
                      {% endif %}
                - service: input_number.set_value
                  target:
                    entity_id: input_number.grow_room_watering_interval_avg
                  data:
                    value: "{{ new_avg | float | round(2) }}"
                - service: input_datetime.set_datetime
                  target:
                    entity_id: input_datetime.grow_room_last_watered
                  data:
                    datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                - service: counter.increment
                  target:
                    entity_id: counter.grow_room_watering_events
                - service: input_boolean.turn_off
                  target:
                    entity_id: input_boolean.grow_room_soil_armed
  mode: single

# ── Grow Room: Camera Day/Night Mode Follows Light ───────────────────────────
# The Reolink camera was remounted close to the grow light, and its built-in
# light sensor now misreads the light's spectrum/proximity — with the light on,
# sensor.grow_room_day_night_state reports "night" and the feed drops to
# black-and-white. So the camera's own `auto` detection is overridden while the
# light is powered: force "color" on, restore "auto" off. Auto is restored
# rather than pinning "blackwhite" so genuine darkness still gets proper IR
# night vision — the confused-sensor condition only exists while the light is on.
#
# Trigger is sensor.grow_controller_port_3_current_power, NOT
# binary_sensor.grow_controller_port_3_state or
# select.grow_room_grow_controller_port_3_active_mode — both of those are
# frozen/stale since the last HA restart and do not reflect live state.
# NOT binary_sensor.grow_controller_port_3_status either — that's
# device_class: connectivity (controller network reachability, always "on"),
# unrelated to the light itself.
#
# The power sensor is mislabeled (device_class: power_factor, no unit) — its
# history shows it's actually a 0-5 dimming ramp (AC Infinity sunrise/sunset
# fade), not wattage. numeric_state triggers (not a state trigger) are used
# deliberately: a state trigger would fire on every ramp step (6x per
# transition) instead of once per edge.
#
# The homeassistant/start trigger resyncs mode after an HA restart, guarded so
# it no-ops if the sensor hasn't polled yet (comes up non-numeric at startup).
# Each branch also guards against redundantly re-setting a mode that's already
# active, since the sensor can blip to unavailable and back, which would
# otherwise re-fire the numeric_state trigger and add log noise.
- id: grow_room_camera_day_night_sync
  alias: "Grow Room: Camera Day/Night Follows Grow Light"
  trigger:
    - platform: numeric_state
      entity_id: sensor.grow_controller_port_3_current_power
      above: 0
      id: lights_on
    - platform: numeric_state
      entity_id: sensor.grow_controller_port_3_current_power
      below: 1
      id: lights_off
    - platform: homeassistant
      event: start
      id: sync
  condition: []
  action:
    - choose:
        - conditions:
            - condition: trigger
              id: lights_on
            - condition: not
              conditions:
                - condition: state
                  entity_id: select.grow_room_day_night_mode
                  state: "color"
          sequence:
            - service: select.select_option
              target:
                entity_id: select.grow_room_day_night_mode
              data:
                option: "color"
        - conditions:
            - condition: trigger
              id: lights_off
            - condition: not
              conditions:
                - condition: state
                  entity_id: select.grow_room_day_night_mode
                  state: "auto"
          sequence:
            - service: select.select_option
              target:
                entity_id: select.grow_room_day_night_mode
              data:
                option: "auto"
        - conditions:
            - condition: trigger
              id: sync
            - condition: template
              value_template: "{{ states('sensor.grow_controller_port_3_current_power') | is_number }}"
            - condition: template
              # Guard against redundantly re-setting a mode that's already active,
              # matching the lights_on/lights_off branches above.
              value_template: >
                {{ ('color' if states('sensor.grow_controller_port_3_current_power') | float > 0 else 'auto')
                   != states('select.grow_room_day_night_mode') }}
          sequence:
            - service: select.select_option
              target:
                entity_id: select.grow_room_day_night_mode
              data:
                option: "{{ 'color' if states('sensor.grow_controller_port_3_current_power') | float > 0 else 'auto' }}"
  mode: single

# ── Life Safety: Smoke/CO Detectors (5x First Alert SMCO410, Z-Wave) ────────
# Room identity for these 5 units cannot come from friendly_name (all 5
# report identical text, e.g. "Smoke & CO Alarm Smoke detected") or from
# area_name()/area_id() Jinja helpers (entity-level area_id is None on every
# detector entity — area is inherited from the device only). All four
# automations below use an explicit static zone_map dict instead. Keep that
# map in sync with customize.yaml's friendly_name overrides and
# packages/life_safety.yaml if a room is renamed or a unit is added/removed.
#
# QA fix (2026-08-27): Sonos snapshot/volume_set/restore used to live inside
# life_safety_smoke_co_alarm itself. Two bugs came from that: (1) tts.speak
# returns once playback is dispatched, not once it finishes, so restore
# fired ~1s after the last tts.speak and likely truncated the announcement;
# (2) mode: restart could cancel an in-flight run between its own snapshot
# and restore (e.g. a second detector tripping mid-announcement) — the next
# run's snapshot would then capture the ALARM volume (0.8) as "normal," so
# restore afterward left the speakers stuck at alarm volume permanently.
# Fix: snapshot/restore now live in two small edge-triggered automations
# (life_safety_sonos_alarm_snapshot / life_safety_sonos_alarm_restore) keyed
# off binary_sensor.life_safety_alarm_active's rising/falling edge, which is
# immune to life_safety_smoke_co_alarm's internal restarts since it only
# fires once per alarm episode. life_safety_smoke_co_alarm itself now only
# does push notification + TTS.
- id: life_safety_smoke_co_alarm
  alias: "Life Safety: Smoke / CO Alarm"
  description: >
    Critical alert for the 5 smoke/CO detectors (grow_room, maker_space,
    kitchen, primary_suite, bathroom_2nd_level). Pushes a critical iOS
    notification to Jason's iPhone only (not the iPad — this path is
    intentionally single-target so the one device most likely to be on
    Jason at all times gets the alert with no ambiguity about which device
    to check) and announces over the main-floor Sonos speakers (volume/
    snapshot/restore are owned by life_safety_sonos_alarm_snapshot and
    life_safety_sonos_alarm_restore below, not by this automation — see the
    QA fix note above the header comment).
    mode: restart — chosen over single/parallel deliberately: `single` would
    drop a second room's alarm while the first announcement is still in
    flight; `parallel` would produce overlapping, unintelligible TTS on the
    same speakers; `restart` recomputes the full set of active zones on
    every new trigger and is never overlapping.
    No input_boolean mute/latch exists on this automation by design — the
    repeat `while:` below reads live sensor state on every iteration, which
    is the entire safety property here; do not add a manual override that
    could suppress it.
  trigger:
    - platform: state
      id: smoke
      to: "on"
      entity_id:
        - binary_sensor.grow_room_smoke_co_alarm_smoke_detected
        - binary_sensor.maker_space_smoke_co_alarm_smoke_detected
        - binary_sensor.kitchen_smoke_co_alarm_smoke_detected
        - binary_sensor.primary_suite_smoke_co_alarm_smoke_detected
        - binary_sensor.bathroom_2nd_level_smoke_co_alarm_smoke_detected
    - platform: state
      id: co
      to: "on"
      entity_id:
        - binary_sensor.grow_room_smoke_co_alarm_carbon_monoxide_detected
        - binary_sensor.maker_space_smoke_co_alarm_carbon_monoxide_detected
        - binary_sensor.kitchen_smoke_co_alarm_carbon_monoxide_detected
        - binary_sensor.primary_suite_smoke_co_alarm_carbon_monoxide_detected
        - binary_sensor.bathroom_2nd_level_smoke_co_alarm_carbon_monoxide_detected
  condition:
    - condition: template
      value_template: "{{ trigger.to_state.state not in ['unavailable', 'unknown'] }}"
  action:
    - variables:
        # Plain string -> string dict, not a Jinja-constructed list of State
        # objects — safe to pass through the variables: boundary.
        zone_map:
          binary_sensor.grow_room_smoke_co_alarm_smoke_detected: "Grow Room"
          binary_sensor.grow_room_smoke_co_alarm_carbon_monoxide_detected: "Grow Room"
          binary_sensor.maker_space_smoke_co_alarm_smoke_detected: "Maker Space"
          binary_sensor.maker_space_smoke_co_alarm_carbon_monoxide_detected: "Maker Space"
          binary_sensor.kitchen_smoke_co_alarm_smoke_detected: "Kitchen"
          binary_sensor.kitchen_smoke_co_alarm_carbon_monoxide_detected: "Kitchen"
          binary_sensor.primary_suite_smoke_co_alarm_smoke_detected: "Primary Suite"
          binary_sensor.primary_suite_smoke_co_alarm_carbon_monoxide_detected: "Primary Suite"
          binary_sensor.bathroom_2nd_level_smoke_co_alarm_smoke_detected: "Bathroom (2nd Level)"
          binary_sensor.bathroom_2nd_level_smoke_co_alarm_carbon_monoxide_detected: "Bathroom (2nd Level)"
        # Each of the following is built as ONE template expression that
        # returns a finished joined string — never a Jinja list passed
        # through the variables: boundary.
        #
        # QA fix (2026-08-27): smoke_zones/co_zones are checked INDEPENDENTLY
        # here (not derived from `trigger.id`) precisely so that a mode:
        # restart re-trigger from a second, different hazard type can't drop
        # the first hazard from the message. Previously the push notification
        # branched on `hazard` (= trigger.id of the MOST RECENT trigger only)
        # while active_zones aggregated all zones regardless of type — e.g.
        # CO active in Kitchen, then smoke trips in Grow Room 10s later:
        # restart replaced the run with hazard: 'smoke' and the push became
        # "Smoke detected in the Kitchen, Grow Room... prepare to evacuate,"
        # silently dropping the Kitchen CO warning (which demands the
        # OPPOSITE instruction: evacuate, don't investigate). The push now
        # reuses this same smoke_zones/co_zones-independent logic (via
        # tts_message) instead of a hazard-branched template.
        smoke_zones: >
          {% set ns = namespace(z=[]) %}
          {% for eid, name in zone_map.items() %}
            {% if eid.endswith('_smoke_detected') and states(eid) == 'on' and name not in ns.z %}
              {% set ns.z = ns.z + [name] %}
            {% endif %}
          {% endfor %}
          {{ ns.z | join(', ') }}
        co_zones: >
          {% set ns = namespace(z=[]) %}
          {% for eid, name in zone_map.items() %}
            {% if eid.endswith('_carbon_monoxide_detected') and states(eid) == 'on' and name not in ns.z %}
              {% set ns.z = ns.z + [name] %}
            {% endif %}
          {% endfor %}
          {{ ns.z | join(', ') }}
        tts_message: >
          {% if co_zones != '' and smoke_zones != '' %}
            Warning. Carbon monoxide detected in the {{ co_zones }}. Carbon
            monoxide is invisible and has no smell. Move outside to fresh air
            now, then call for help. Smoke also detected in the
            {{ smoke_zones }}. Check the {{ smoke_zones }} immediately and
            prepare to evacuate.
          {% elif co_zones != '' %}
            Warning. Carbon monoxide detected in the {{ co_zones }}. Carbon
            monoxide is invisible and has no smell. Move outside to fresh air
            now, then call for help.
          {% else %}
            Warning. Smoke detected in the {{ smoke_zones }}. Check the
            {{ smoke_zones }} immediately and prepare to evacuate.
          {% endif %}

    # iPhone only — intentionally NOT also pushing to notify.mobile_app_ipad
    # on this critical path (see description above). continue_on_error:
    # true so a transient APNs failure can't block the in-house TTS/Sonos
    # safety channel below from running.
    # NOTE: iOS Critical Alerts (data.push.sound.critical: 1) requires the HA
    # Companion app to have the Critical Alerts entitlement granted in iOS
    # Settings > Notifications, or `critical: 1` silently downgrades to a
    # normal notification. Send a live test push to confirm this is granted.
    #
    # Title and message both check smoke_zones/co_zones independently (same
    # dual-hazard-aware logic as tts_message, reused verbatim as the body)
    # rather than branching on the single most-recent `trigger.id` — see the
    # QA fix note on the variables: step above.
    - service: notify.mobile_app_jason_s_iphone
      continue_on_error: true
      data:
        title: >
          {% if co_zones != '' and smoke_zones != '' %}
            Carbon Monoxide + Smoke Alarm
          {% elif co_zones != '' %}
            Carbon Monoxide Alarm
          {% else %}
            Smoke Alarm
          {% endif %}
        message: "{{ tts_message }}"
        data:
          push:
            sound:
              name: default
              critical: 1
              volume: 1.0

    # TTS announcement — engine: tts.home_assistant_cloud. Fallback engine
    # tts.google_translate_en_com exists if the Nabu Casa cloud TTS ever
    # fails (subscription dependent) — informational only, no automatic
    # fallback logic implemented, that's out of scope.
    #
    # No sonos.snapshot/volume_set here — life_safety_sonos_alarm_snapshot
    # (triggered by binary_sensor.life_safety_alarm_active turning 'on')
    # owns that now, so the speakers are expected to already be at alarm
    # volume by the time these calls run. See the DEPENDENCY NOTE on that
    # automation's description for why this ordering is safe in practice
    # but not strictly enforced.
    #
    # One tts.speak call per speaker (not one call with all four in the
    # target) — a single multi-target call fails as a unit, and a dead/
    # unavailable portable speaker (crafting_room "Recroom" or unnamed_room
    # "Portable") must not abort calls to the working main-floor speakers.
    - service: tts.speak
      continue_on_error: true
      target:
        entity_id: tts.home_assistant_cloud
      data:
        media_player_entity_id: media_player.living_room
        message: "{{ tts_message }}"
        cache: false
    - service: tts.speak
      continue_on_error: true
      target:
        entity_id: tts.home_assistant_cloud
      data:
        media_player_entity_id: media_player.family_room
        message: "{{ tts_message }}"
        cache: false
    - service: tts.speak
      continue_on_error: true
      target:
        entity_id: tts.home_assistant_cloud
      data:
        media_player_entity_id: media_player.crafting_room
        message: "{{ tts_message }}"
        cache: false
    - service: tts.speak
      continue_on_error: true
      target:
        entity_id: tts.home_assistant_cloud
      data:
        media_player_entity_id: media_player.unnamed_room
        message: "{{ tts_message }}"
        cache: false

    # Self-terminates within ~2 min of the alarm clearing (while: reads live
    # sensor state via binary_sensor.life_safety_alarm_active, which
    # recomputes on every evaluation), caps at ~30 min of re-alerts
    # (2 min delay x 15 iterations). No Sonos calls in here either — same
    # reasoning as the initial TTS block above; life_safety_sonos_alarm_
    # restore fires independently once the alarm sensor goes 'off'.
    - repeat:
        while:
          - condition: template
            value_template: "{{ states('binary_sensor.life_safety_alarm_active') == 'on' }}"
          - condition: template
            value_template: "{{ repeat.index < 15 }}"
        sequence:
          - delay: "00:02:00"
          - variables:
              # Recompute live — zones may have changed (grown or shrunk)
              # during the 2-minute delay. zone_map itself is static and is
              # inherited unchanged from the outer variables: step above.
              smoke_zones: >
                {% set ns = namespace(z=[]) %}
                {% for eid, name in zone_map.items() %}
                  {% if eid.endswith('_smoke_detected') and states(eid) == 'on' and name not in ns.z %}
                    {% set ns.z = ns.z + [name] %}
                  {% endif %}
                {% endfor %}
                {{ ns.z | join(', ') }}
              co_zones: >
                {% set ns = namespace(z=[]) %}
                {% for eid, name in zone_map.items() %}
                  {% if eid.endswith('_carbon_monoxide_detected') and states(eid) == 'on' and name not in ns.z %}
                    {% set ns.z = ns.z + [name] %}
                  {% endif %}
                {% endfor %}
                {{ ns.z | join(', ') }}
              tts_message: >
                {% if co_zones != '' and smoke_zones != '' %}
                  Warning. Carbon monoxide detected in the {{ co_zones }}.
                  Carbon monoxide is invisible and has no smell. Move outside
                  to fresh air now, then call for help. Smoke also detected
                  in the {{ smoke_zones }}. Check the {{ smoke_zones }}
                  immediately and prepare to evacuate.
                {% elif co_zones != '' %}
                  Warning. Carbon monoxide detected in the {{ co_zones }}.
                  Carbon monoxide is invisible and has no smell. Move outside
                  to fresh air now, then call for help.
                {% else %}
                  Warning. Smoke detected in the {{ smoke_zones }}. Check the
                  {{ smoke_zones }} immediately and prepare to evacuate.
                {% endif %}
          - service: tts.speak
            continue_on_error: true
            target:
              entity_id: tts.home_assistant_cloud
            data:
              media_player_entity_id: media_player.living_room
              message: "{{ tts_message }}"
              cache: false
          - service: tts.speak
            continue_on_error: true
            target:
              entity_id: tts.home_assistant_cloud
            data:
              media_player_entity_id: media_player.family_room
              message: "{{ tts_message }}"
              cache: false
          - service: tts.speak
            continue_on_error: true
            target:
              entity_id: tts.home_assistant_cloud
            data:
              media_player_entity_id: media_player.crafting_room
              message: "{{ tts_message }}"
              cache: false
          - service: tts.speak
            continue_on_error: true
            target:
              entity_id: tts.home_assistant_cloud
            data:
              media_player_entity_id: media_player.unnamed_room
              message: "{{ tts_message }}"
              cache: false
  mode: restart

# ── Life Safety: Sonos snapshot/restore (decoupled from restart lifecycle) ──
# Split out of life_safety_smoke_co_alarm per QA fix (2026-08-27) — see the
# note above that automation's header comment for the full rationale. Both
# of these are mode: single, edge-triggered on the AGGREGATE sensor's real
# state transition (not a manual toggle), so this does not reintroduce the
# input_boolean mute/latch that was explicitly declined for this feature.
- id: life_safety_sonos_alarm_snapshot
  alias: "Life Safety: Sonos Alarm Snapshot"
  description: >
    Rising-edge companion to life_safety_smoke_co_alarm. Captures Sonos
    state and raises volume to alarm level exactly once per alarm episode —
    triggered off binary_sensor.life_safety_alarm_active turning 'on' rather
    than the individual smoke/CO entities, so it is immune to
    life_safety_smoke_co_alarm's mode: restart internally cancelling and
    re-running on every additional detector that trips during the same
    episode. That immunity is the whole point: previously, a second
    detector tripping between the in-flight run's own snapshot and restore
    would cause mode: restart to cancel that run before restore ever
    executed, and the new run's snapshot would then capture the speakers
    already sitting at ALARM volume (0.8) as "normal" — so the eventual
    restore left them stuck at 0.8 permanently after the fire alarm cleared.
    DEPENDENCY NOTE for future maintainers: life_safety_smoke_co_alarm's
    tts.speak calls assume the speakers are already at alarm volume by the
    time TTS fires. That depends on THIS automation's snapshot/volume_set
    completing before life_safety_smoke_co_alarm's TTS action runs. Both are
    triggered off the same underlying sensor state change (this one off the
    aggregate binary_sensor.life_safety_alarm_active, the other off the
    individual smoke/CO entities that make it go 'on'), and HA processes
    automation triggers fast enough in practice for this ordering to hold —
    but it is not an enforced/blocking dependency. If TTS content or Sonos
    setup ever needs strict ordering, add an explicit wait_template here.
  trigger:
    - platform: state
      entity_id: binary_sensor.life_safety_alarm_active
      to: "on"
  condition: []
  action:
    - service: sonos.snapshot
      target:
        entity_id:
          - media_player.living_room
          - media_player.family_room
          - media_player.crafting_room
          - media_player.unnamed_room
      data:
        with_group: true
    - service: media_player.volume_set
      target:
        entity_id:
          - media_player.living_room
          - media_player.family_room
          - media_player.crafting_room
          - media_player.unnamed_room
      data:
        volume_level: 0.8
  mode: single

- id: life_safety_sonos_alarm_restore
  alias: "Life Safety: Sonos Alarm Restore"
  description: >
    Falling-edge companion to life_safety_sonos_alarm_snapshot, triggered
    off binary_sensor.life_safety_alarm_active turning 'off' (all 5 units
    clear). Waits 20s before restoring — life_safety_smoke_co_alarm's final
    TTS announcement may still be dispatching/playing right as the alarm
    clears, and tts.speak returns once playback is DISPATCHED, not once it
    FINISHES, so restoring immediately risked truncating the last
    announcement on all 4 speakers. The 20s settle delay gives that
    announcement time to finish before pre-alarm volume/source/group are
    reapplied.
    mode: restart (QA fix, 2026-08-27) — not single. If the alarm fully
    clears and then re-trips within the 20s settle delay (a brief Z-Wave
    flicker, or a genuinely new event starting right as the first ends),
    mode: single would sleep through its first delay and silently drop the
    second falling-edge trigger, so that clearing event would never get its
    own restore call. mode: restart resets the 20s wait on every fresh
    falling edge instead, guaranteeing the most recent clear always gets a
    restore.
  trigger:
    - platform: state
      entity_id: binary_sensor.life_safety_alarm_active
      to: "off"
  condition: []
  action:
    - delay: "00:00:20"
    - service: sonos.restore
      continue_on_error: true
      target:
        entity_id:
          - media_player.living_room
          - media_player.family_room
          - media_player.crafting_room
          - media_player.unnamed_room
      data:
        with_group: true
  mode: restart

- id: life_safety_detector_maintenance
  alias: "Life Safety: Detector Maintenance Required"
  description: >
    Low-urgency maintenance alert for the 5 smoke/CO detectors — low battery,
    dust maintenance, end-of-life replacement, hardware failure, or a node
    gone offline (Z-Wave status 'dead'). Normal-priority push to both iPhone
    and iPad (unlike life_safety_smoke_co_alarm, which is iPhone-only). No
    TTS, no critical flag — this is not an active-hazard alert.
    Anti-spam throttle is 21600s (6h), longer than R2's 3600s pattern
    elsewhere in this file, since this is low-urgency and repeated pushes
    for a fault that persists for days would just be noise.
  trigger:
    - platform: numeric_state
      id: battery
      below: 20
      # NOTE: verify via history that sensor.P_battery_level reports
      # intermediate values (not just 100/50/0) before trusting this 20%
      # threshold in practice. eol/hardware triggers below provide
      # independent coverage regardless. 20% matches battery_threshold: 20
      # already set on custom:imperial-alert-panel in ui-lovelace.yaml.
      entity_id:
        - sensor.grow_room_smoke_co_alarm_battery_level
        - sensor.maker_space_smoke_co_alarm_battery_level
        - sensor.kitchen_smoke_co_alarm_battery_level
        - sensor.primary_suite_smoke_co_alarm_battery_level
        - sensor.bathroom_2nd_level_smoke_co_alarm_battery_level
    - platform: state
      id: dust
      to: "on"
      entity_id:
        - binary_sensor.grow_room_smoke_co_alarm_maintenance_required_dust_in_device
        - binary_sensor.maker_space_smoke_co_alarm_maintenance_required_dust_in_device
        - binary_sensor.kitchen_smoke_co_alarm_maintenance_required_dust_in_device
        - binary_sensor.primary_suite_smoke_co_alarm_maintenance_required_dust_in_device
        - binary_sensor.bathroom_2nd_level_smoke_co_alarm_maintenance_required_dust_in_device
    - platform: state
      id: eol
      to: "on"
      entity_id:
        - binary_sensor.grow_room_smoke_co_alarm_replacement_required_end_of_life
        - binary_sensor.maker_space_smoke_co_alarm_replacement_required_end_of_life
        - binary_sensor.kitchen_smoke_co_alarm_replacement_required_end_of_life
        - binary_sensor.primary_suite_smoke_co_alarm_replacement_required_end_of_life
        - binary_sensor.bathroom_2nd_level_smoke_co_alarm_replacement_required_end_of_life
    - platform: state
      id: hardware
      to: "on"
      entity_id:
        - binary_sensor.grow_room_smoke_co_alarm_system_hardware_failure
        - binary_sensor.maker_space_smoke_co_alarm_system_hardware_failure
        - binary_sensor.kitchen_smoke_co_alarm_system_hardware_failure
        - binary_sensor.primary_suite_smoke_co_alarm_system_hardware_failure
        - binary_sensor.bathroom_2nd_level_smoke_co_alarm_system_hardware_failure
    - platform: state
      id: offline
      to: "dead"
      entity_id:
        - sensor.grow_room_smoke_co_alarm_node_status
        - sensor.maker_space_smoke_co_alarm_node_status
        - sensor.kitchen_smoke_co_alarm_node_status
        - sensor.primary_suite_smoke_co_alarm_node_status
        - sensor.bathroom_2nd_level_smoke_co_alarm_node_status
  condition:
    - condition: template
      value_template: "{{ trigger.to_state.state not in ['unavailable', 'unknown'] }}"
    - condition: template
      value_template: >
        {{ this.last_triggered is none or
           (now() - this.last_triggered).total_seconds() > 21600 }}
  action:
    - variables:
        zone_map:
          sensor.grow_room_smoke_co_alarm_battery_level: "Grow Room"
          sensor.maker_space_smoke_co_alarm_battery_level: "Maker Space"
          sensor.kitchen_smoke_co_alarm_battery_level: "Kitchen"
          sensor.primary_suite_smoke_co_alarm_battery_level: "Primary Suite"
          sensor.bathroom_2nd_level_smoke_co_alarm_battery_level: "Bathroom (2nd Level)"
          binary_sensor.grow_room_smoke_co_alarm_maintenance_required_dust_in_device: "Grow Room"
          binary_sensor.maker_space_smoke_co_alarm_maintenance_required_dust_in_device: "Maker Space"
          binary_sensor.kitchen_smoke_co_alarm_maintenance_required_dust_in_device: "Kitchen"
          binary_sensor.primary_suite_smoke_co_alarm_maintenance_required_dust_in_device: "Primary Suite"
          binary_sensor.bathroom_2nd_level_smoke_co_alarm_maintenance_required_dust_in_device: "Bathroom (2nd Level)"
          binary_sensor.grow_room_smoke_co_alarm_replacement_required_end_of_life: "Grow Room"
          binary_sensor.maker_space_smoke_co_alarm_replacement_required_end_of_life: "Maker Space"
          binary_sensor.kitchen_smoke_co_alarm_replacement_required_end_of_life: "Kitchen"
          binary_sensor.primary_suite_smoke_co_alarm_replacement_required_end_of_life: "Primary Suite"
          binary_sensor.bathroom_2nd_level_smoke_co_alarm_replacement_required_end_of_life: "Bathroom (2nd Level)"
          binary_sensor.grow_room_smoke_co_alarm_system_hardware_failure: "Grow Room"
          binary_sensor.maker_space_smoke_co_alarm_system_hardware_failure: "Maker Space"
          binary_sensor.kitchen_smoke_co_alarm_system_hardware_failure: "Kitchen"
          binary_sensor.primary_suite_smoke_co_alarm_system_hardware_failure: "Primary Suite"
          binary_sensor.bathroom_2nd_level_smoke_co_alarm_system_hardware_failure: "Bathroom (2nd Level)"
          sensor.grow_room_smoke_co_alarm_node_status: "Grow Room"
          sensor.maker_space_smoke_co_alarm_node_status: "Maker Space"
          sensor.kitchen_smoke_co_alarm_node_status: "Kitchen"
          sensor.primary_suite_smoke_co_alarm_node_status: "Primary Suite"
          sensor.bathroom_2nd_level_smoke_co_alarm_node_status: "Bathroom (2nd Level)"
        room: "{{ zone_map[trigger.entity_id] }}"
        fault_type: >
          {% if trigger.id == 'battery' %}
            Low battery
          {% elif trigger.id == 'dust' %}
            Needs cleaning (dust)
          {% elif trigger.id == 'eol' %}
            Replacement required (end of life)
          {% elif trigger.id == 'hardware' %}
            Hardware failure
          {% else %}
            Detector offline / unreachable
          {% endif %}
    - service: notify.mobile_app_jason_s_iphone
      data:
        title: "Life Safety"
        message: "{{ room }}: {{ fault_type }}"
    - service: notify.mobile_app_ipad
      data:
        title: "Life Safety"
        message: "{{ room }}: {{ fault_type }}"
  mode: queued
  max: 10
