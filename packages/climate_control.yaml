# ─────────────────────────────────────────────────────────────────────────────
# packages/climate_control.yaml — House climate management
#
# Template sensors: house_average_temperature, house_average_humidity
# NOTE: Carbonite Vault (freezer) is intentionally excluded from all averages.
#
# Automation logic:
#   - 6:00 AM  → daytime setpoint  (cool 72°F / heat 68°F)
#   - 9:00 PM  → night setpoint    (cool 68°F / heat 64°F)
#   - Every 15 min → recalculate adjusted setpoints based on room offset
#
# Room offset compensation:
#   The T6 only senses its own location (Forward Command Post). If the house
#   average runs warmer/cooler than the T6, we shift the T6 setpoint to
#   compensate so the whole-house average lands at the target.
#   adjusted_target = target - (house_avg - t6_reading)
# ─────────────────────────────────────────────────────────────────────────────

input_boolean:
  climate_manual_override:
    name: Climate Manual Override
    icon: mdi:hand-back-right

template:
  - sensor:
      - name: "House Average Temperature"
        unique_id: house_average_temperature
        unit_of_measurement: "°F"
        device_class: temperature
        state_class: measurement
        state: >
          {{ ((
              states('sensor.timmerflotte_temp_hmd_sensor_temperature') | float(72) +
              states('sensor.timmerflotte_temp_hmd_sensor_temperature_2') | float(72) +
              states('sensor.timmerflotte_temp_hmd_sensor_temperature_3') | float(72) +
              states('sensor.timmerflotte_temp_hmd_sensor_temperature_4') | float(72) +
              states('sensor.timmerflotte_temp_hmd_sensor_temperature_5') | float(72) +
              states('sensor.timmerflotte_temp_hmd_sensor_temperature_6') | float(72) +
              states('sensor.t6_pro_z_wave_programmable_thermostat_air_temperature') | float(72)
            ) / 7) | round(1) }}

      - name: "T6 Fan Status"
        unique_id: t6_fan_status
        icon: mdi:fan-clock
        state: >
          {% set s = state_attr('climate.t6_pro_z_wave_programmable_thermostat', 'fan_state') | lower %}
          {% if 'high' in s %}High
          {% elif 'low' in s %}Low
          {% elif 'running' in s %}Running
          {% else %}Idle
          {% endif %}

      - name: "House Average Humidity"
        unique_id: house_average_humidity
        unit_of_measurement: "%"
        device_class: humidity
        state_class: measurement
        state: >
          {{ ((
              states('sensor.timmerflotte_temp_hmd_sensor_humidity') | float(50) +
              states('sensor.timmerflotte_temp_hmd_sensor_humidity_2') | float(50) +
              states('sensor.timmerflotte_temp_hmd_sensor_humidity_3') | float(50) +
              states('sensor.timmerflotte_temp_hmd_sensor_humidity_4') | float(50) +
              states('sensor.timmerflotte_temp_hmd_sensor_humidity_5') | float(50) +
              states('sensor.timmerflotte_temp_hmd_sensor_humidity_6') | float(50) +
              states('sensor.t6_pro_z_wave_programmable_thermostat_humidity') | float(50)
            ) / 7) | round(1) }}
