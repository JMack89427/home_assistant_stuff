# ─────────────────────────────────────────────────────────────────────────────
# ui-lawn-pool.yaml  —  Lawn & Pool dashboard (standalone)
# ─────────────────────────────────────────────────────────────────────────────

title: Lawn & Pool
views:
  - title: Lawn & Pool
    path: lawn-pool
    icon: mdi:pool
    panel: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: markdown
            content: "## Garden — LUBA VA624UNR"

          - type: grid
            columns: 5
            square: false
            cards:
              - type: tile
                entity: lawn_mower.garden_luba_va624unr
                name: Start
                icon: mdi:play
                tap_action:
                  action: call-service
                  service: lawn_mower.start_mowing
                  service_data:
                    entity_id: lawn_mower.garden_luba_va624unr
              - type: tile
                entity: lawn_mower.garden_luba_va624unr
                name: Pause
                icon: mdi:pause
                tap_action:
                  action: call-service
                  service: lawn_mower.pause
                  service_data:
                    entity_id: lawn_mower.garden_luba_va624unr
              - type: tile
                entity: lawn_mower.garden_luba_va624unr
                name: Return to Base
                icon: mdi:home-import-outline
                tap_action:
                  action: call-service
                  service: lawn_mower.dock
                  service_data:
                    entity_id: lawn_mower.garden_luba_va624unr
              - type: tile
                entity: button.garden_luba_va624unr_cancel_current_task
                name: Cancel Task
                icon: mdi:cancel
                tap_action:
                  action: call-service
                  service: button.press
                  service_data:
                    entity_id: button.garden_luba_va624unr_cancel_current_task
              - type: tile
                entity: button.garden_luba_va624unr_restart_mower
                name: Restart
                icon: mdi:restart
                tap_action:
                  action: call-service
                  service: button.press
                  service_data:
                    entity_id: button.garden_luba_va624unr_restart_mower

          - type: horizontal-stack
            cards:
              - type: vertical-stack
                cards:
                  - type: entities
                    title: Status
                    entities:
                      - entity: lawn_mower.garden_luba_va624unr
                        name: State
                        icon: mdi:robot-mower
                      - entity: sensor.garden_luba_va624unr_battery
                        name: Battery
                        icon: mdi:battery
                      - entity: sensor.garden_luba_va624unr_activity_mode
                        name: Activity
                        icon: mdi:information-outline
                      - entity: sensor.garden_luba_va624unr_connection
                        name: Connection
                        icon: mdi:wifi
                      - entity: binary_sensor.garden_luba_va624unr_charging
                        name: Charging
                        icon: mdi:lightning-bolt
                      - entity: sensor.garden_luba_va624unr_rtk_position
                        name: RTK Fix
                        icon: mdi:crosshairs-gps
                      - entity: sensor.garden_luba_va624unr_satellites_robot
                        name: Satellites
                        icon: mdi:satellite-variant

                  - type: entities
                    title: Active Mowing
                    entities:
                      - entity: sensor.garden_luba_va624unr_progress
                        name: Progress
                        icon: mdi:progress-check
                      - entity: sensor.garden_luba_va624unr_elapsed_time
                        name: Elapsed
                        icon: mdi:timer
                      - entity: sensor.garden_luba_va624unr_time_left
                        name: Time Left
                        icon: mdi:timer-sand
                      - entity: sensor.garden_luba_va624unr_area
                        name: Area
                        icon: mdi:texture-box
                      - entity: sensor.garden_luba_va624unr_mowing_speed
                        name: Speed
                        icon: mdi:speedometer

              - type: vertical-stack
                cards:
                  - type: entities
                    title: Zones
                    entities:
                      - entity: switch.chopper_zone_north_lawn
                        name: North Lawn
                        icon: mdi:map-marker-outline
                      - entity: switch.chopper_zone_back_lawn
                        name: Back Lawn
                        icon: mdi:map-marker-outline
                      - entity: switch.chopper_zone_south_lawn
                        name: South Lawn
                        icon: mdi:map-marker-outline

                  - type: markdown
                    content: "_Zones are managed automatically by the mow rotation — manual toggles here may be overridden at the next scheduled run (11am)._"

                  - type: entities
                    title: Field Settings
                    entities:
                      - entity: switch.garden_luba_va624unr_rain_detection_mower_on_off
                        name: Rain Detection
                        icon: mdi:weather-rainy
                      - entity: switch.garden_luba_va624unr_rain_detection_during_mow_on_off
                        name: Rain During Mow
                        icon: mdi:weather-pouring
                      - entity: switch.garden_luba_va624unr_side_led_on_off
                        name: Navigation LEDs
                        icon: mdi:led-on
                      - entity: select.garden_luba_va624unr_obstacle_detection
                        name: Obstacle Detection
                        icon: mdi:eye-outline
                      - entity: select.garden_luba_va624unr_wildlife_safety
                        name: Wildlife Safety
                        icon: mdi:paw
                      - entity: number.garden_luba_va624unr_blade_height
                        name: Blade Height
                        icon: mdi:ruler
                      - entity: select.garden_luba_va624unr_cutting_path_mode
                        name: Cutting Pattern
                        icon: mdi:grid
                      - entity: select.garden_luba_va624unr_perimeter_mowing_laps
                        name: Perimeter Laps
                        icon: mdi:vector-square
                      - entity: number.garden_luba_va624unr_path_spacing
                        name: Path Spacing
                        icon: mdi:arrow-expand-horizontal
                      - entity: number.garden_luba_va624unr_cutting_path_angle
                        name: Cutting Angle
                        icon: mdi:angle-acute
                      - entity: select.garden_luba_va624unr_cutting_path_angle_mode
                        name: Angle Mode
                        icon: mdi:rotate-3d-variant
                      - entity: select.garden_luba_va624unr_traversal_mode
                        name: Traversal Mode
                        icon: mdi:transit-connection-variant
                      - entity: select.garden_luba_va624unr_turnaround_mode
                        name: Turnaround Mode
                        icon: mdi:sync
                      - entity: number.garden_luba_va624unr_working_speed
                        name: Working Speed
                        icon: mdi:speedometer

              - type: vertical-stack
                cards:
                  - type: map
                    entities:
                      - entity: device_tracker.garden_luba_va624unr_luba_va624unr
                        label: Garden Mower
                    hours_to_show: 1
                    default_zoom: 18
                    aspect_ratio: "16:9"

                  - type: entities
                    title: Maintenance
                    entities:
                      - entity: sensor.garden_luba_va624unr_blade_used_time
                        name: Blade Hours
                        icon: mdi:timer-outline
                      - entity: sensor.garden_luba_va624unr_blade_wear_warning_time
                        name: Blade Warning At
                        icon: mdi:alert-outline
                      - entity: sensor.garden_luba_va624unr_total_mileage
                        name: Total Mileage
                        icon: mdi:map-marker-distance
                      - entity: sensor.garden_luba_va624unr_total_work_time
                        name: Total Duty Time
                        icon: mdi:timer
                      - entity: sensor.garden_luba_va624unr_battery_cycles
                        name: Battery Cycles
                        icon: mdi:battery-sync

          - type: markdown
            content: "## Pool — Spino E1"

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: vacuum.pool_spino_e13d6btg
                name: Start
                icon: mdi:play
                tap_action:
                  action: call-service
                  service: vacuum.start
                  service_data:
                    entity_id: vacuum.pool_spino_e13d6btg
              - type: tile
                entity: vacuum.pool_spino_e13d6btg
                name: Return to Base
                icon: mdi:home-import-outline
                tap_action:
                  action: call-service
                  service: vacuum.return_to_base
                  service_data:
                    entity_id: vacuum.pool_spino_e13d6btg

          - type: horizontal-stack
            cards:
              - type: entities
                title: Status
                entities:
                  - entity: sensor.pool_spino_e13d6btg_battery
                    name: Battery
                    icon: mdi:battery
                  - entity: vacuum.pool_spino_e13d6btg
                    name: State
                    icon: mdi:robot
                  - entity: sensor.pool_spino_e13d6btg_status
                    name: Status
                    icon: mdi:information-outline
                  - entity: sensor.pool_spino_e13d6btg_cleaning_mode
                    name: Mode
                    icon: mdi:washing-machine

              - type: entities
                title: Operations
                entities:
                  - entity: switch.pool_spino_e13d6btg_turbo_cleaning
                    name: Turbo Mode
                    icon: mdi:turbine
                  - entity: switch.pool_spino_e13d6btg_platform_cleaning
                    name: Platform Clean
                    icon: mdi:stairs
                  - entity: switch.pool_spino_e13d6btg_waterline_parking
                    name: Waterline Park
                    icon: mdi:water-outline
                  - entity: switch.pool_spino_e13d6btg_buzzer
                    name: Buzzer
                    icon: mdi:volume-high

              - type: picture-entity
                entity: camera.pool_live_view
                name: Pool Camera — Ring

          - type: horizontal-stack
            cards:
              - type: entities
                title: Configuration
                entities:
                  - entity: select.pool_spino_e13d6btg_cleaning_mode
                    name: Cleaning Mode
                    icon: mdi:cog
                  - entity: select.pool_spino_e13d6btg_wall_material
                    name: Wall Material
                    icon: mdi:texture-box
                  - entity: select.pool_spino_e13d6btg_pool_bottom_shape
                    name: Bottom Shape
                    icon: mdi:shape
                  - entity: number.pool_spino_e13d6btg_pool_floor_movement_speed
                    name: Floor Speed
                    icon: mdi:speedometer

              - type: grid
                columns: 3
                square: false
                cards:
                  - type: tile
                    entity: button.pool_spino_e13d6btg_refresh_status
                    name: Refresh Status
                    icon: mdi:refresh
                    tap_action:
                      action: call-service
                      service: button.press
                      service_data:
                        entity_id: button.pool_spino_e13d6btg_refresh_status
                  - type: tile
                    entity: button.pool_spino_e13d6btg_fetch_pool_map
                    name: Fetch Pool Map
                    icon: mdi:map
                    tap_action:
                      action: call-service
                      service: button.press
                      service_data:
                        entity_id: button.pool_spino_e13d6btg_fetch_pool_map
                  - type: tile
                    entity: button.pool_spino_e13d6btg_fetch_cleaning_route
                    name: Fetch Route
                    icon: mdi:routes
                    tap_action:
                      action: call-service
                      service: button.press
                      service_data:
                        entity_id: button.pool_spino_e13d6btg_fetch_cleaning_route
