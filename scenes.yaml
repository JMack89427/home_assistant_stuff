# ─────────────────────────────────────────────────────────────────────────────
# scenes.yaml  —  Home Assistant scene definitions
# ─────────────────────────────────────────────────────────────────────────────

# ── Example: Bright / daytime ─────────────────────────────────────────────────
- id: scene_bright
  name: Bright
  entities:
    light.living_room:         # TODO: replace with your entities
      state: "on"
      brightness: 255
      color_temp: 4000

# ── Example: Relax / evening ──────────────────────────────────────────────────
- id: scene_relax
  name: Relax
  entities:
    light.living_room:
      state: "on"
      brightness: 128
      rgb_color: [255, 200, 100]

# ── Example: Sleep ────────────────────────────────────────────────────────────
- id: scene_sleep
  name: Sleep
  entities:
    light.living_room:
      state: "off"
    light.bedroom:
      state: "on"
      brightness: 10
