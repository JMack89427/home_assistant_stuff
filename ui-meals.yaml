title: Meals
resources:
  - url: /hacsfiles/mealie-card/mealie-card.js
    type: module
views:
  - title: Meals
    path: meals
    icon: mdi:silverware-fork-knife
    badges: []
    cards:
      - type: custom:mealie-mealplan-card
        title: "Today"
        config_entry_id: 01KRC45RGW4GTDF6KA325E97AB
        day_offset: 0
        show_image: true
        show_description: true
        show_prep_time: true
        show_perform_time: false
        show_total_time: true
        show_rating: true
        show_servings: true
        layout: horizontal

